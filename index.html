/* PERIODS 定义已移至 v3.7 内核常量之后（避免 TDZ） */



const DEFAULT_GIST_ID = 'b33a02fb9982b4dfc3203e7118e912db';



function expandPeriods(newLabels) {

  // v3.7：输入可为 label（M/D、M月D日、YYYY-MM-DD、M/D/YYYY）或 id；统一解析为真实日历 id 后走 rebuildPeriods。
  // 注意：本函数只扩时间轴，不重排数据域；数据重排由调用方（导入内核 / loadDataFromJson）用 remapPositional 完成。
  const ids = [];

  (newLabels||[]).forEach(label => {

    const clean = String(label||'').trim();

    if (!clean) return;

    const pi = parsePeriodInput(clean, TIMELINE_BASE_YEAR);

    if (pi && pi.id) ids.push(pi.id);

  });

  if (ids.length === 0) return false;

  const beforeKey = PERIODS.map(p=>p.id).join('|');

  const rebuilt = rebuildPeriods([...PERIODS, ...ids.map(id=>({id}))]);

  commitPeriodsInPlace(rebuilt);

  return PERIODS.map(p=>p.id).join('|') !== beforeKey;

}



function normalizePeriodLabel(label) {

  if (!label) return '';

  const clean = String(label).trim();

  const m1 = clean.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);

  if (m1) return String(parseInt(m1[2],10)) + '/' + String(parseInt(m1[3],10));

  const m2 = clean.match(/^(\d{1,2})[\/\-](\d{1,2})$/);

  if (m2) return String(parseInt(m2[1],10)) + '/' + String(parseInt(m2[2],10));

  const m3 = clean.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);

  if (m3) return String(parseInt(m3[1],10)) + '/' + String(parseInt(m3[2],10));

  const m4 = clean.match(/(\d{1,2})月(\d{1,2})日?/);

  if (m4) return parseInt(m4[1],10) + '/' + parseInt(m4[2],10);

  return clean;

}



function findPeriodIdx(label) {

  if (!label) return -1;

  if (!Array.isArray(PERIODS)) return -1;

  // v3.7：id 精确匹配优先（区分不同年份的同月日）
  const rawClean = String(label).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(rawClean)) {

    const byId = PERIODS.findIndex(p => p.id === rawClean);

    if (byId >= 0) return byId;

  }

  const target = normalizePeriodLabel(label);

  const clean = String(label).trim();

  let idx = PERIODS.findIndex(p => p.label === clean);

  if (idx >= 0) return idx;

  idx = PERIODS.findIndex(p => p.label === target);

  if (idx >= 0) return idx;

  const nums = clean.match(/(\d{1,2})\D+(\d{1,2})/);

  if (nums) {

    idx = PERIODS.findIndex(p => p.label === parseInt(nums[1],10) + '/' + parseInt(nums[2],10));

    if (idx >= 0) return idx;

  }

  return -1;

}


/* ================= v3.7 数据可靠性内核 ================= */
/* 时间轴 / CSV 解析 / 数值校验 / 主键 upsert / 原子快照构建 / 统一 SKU 指标。全部为纯函数，可单测。 */
const TIMELINE_BASE_YEAR = 2026; // 用户确认：现有历史数据所属年份为 2026（2026-03-24 周起）；跨年序列按月份回绕自动 +1
const WEEK_DAYS = 7;             // 用户确认：周粒度、每周 7 天；第一周同为 7 天，不做相邻标签推断
const SCHEMA_VERSION = 'v3.7';
const DATASET_ID = 'zhaofeng-main';
const CSV_MAX_ROWS = 5000;       // 按源文件数据行计算，超限整文件拒绝

// v3.7：周期对象带真实日历 id（YYYY-MM-DD）+ days；label 仅为展示。初始默认时间轴锚定 2026 年（用户确认）。
const PERIODS = periodsFromLegacyLabels(['3/24','3/30','4/6','4/13','4/20','4/27','5/4','5/11','5/18','5/25','6/1','6/8','6/15','6/22','6/29','7/6','7/13','7/20','7/27','8/3','8/10'], 2026);

/* 唯一时间轴提交点：rebuildPeriods 结果就地写回 PERIODS（保留数组身份，兼容存量引用）；
   所有调用方必须同时用 remapPositional 重排数据域并 setState 触发渲染。 */
function commitPeriodsInPlace(newPeriods){
  PERIODS.length = 0;
  (newPeriods||[]).forEach(p => PERIODS.push(p));
  return PERIODS;
}

function pad2(n){ return String(n).padStart(2,'0'); }
function isRealDate(y,m,d){ if(!Number.isInteger(y)||!Number.isInteger(m)||!Number.isInteger(d)) return false; const dt=new Date(Date.UTC(y,m-1,d)); return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d; }
function makePeriodId(y,m,d){ return isRealDate(y,m,d)?(y+'-'+pad2(m)+'-'+pad2(d)):null; }
function periodLabelFromId(id){ const p=String(id||'').split('-'); return p.length===3?(parseInt(p[1],10)+'/'+parseInt(p[2],10)):String(id||''); }

/* 解析周期输入 → {y,m,d,id}；缺年份且无锚定年 → {needYear:true}（禁止用当前年份/随机年猜测） */
function parsePeriodInput(raw, anchorYear){
  const s=String(raw??'').trim(); if(!s) return null;
  let m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(m){ const y=+m[1],mo=+m[2],d=+m[3]; const id=makePeriodId(y,mo,d); return id?{y,m:mo,d,id}:null; }
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); // 美式 月/日/年
  if(m){ const mo=+m[1],d=+m[2],y=+m[3]; const id=makePeriodId(y,mo,d); return id?{y,m:mo,d,id}:null; }
  m=s.match(/^(\d{1,2})月(\d{1,2})日?$/);
  if(m){ const mo=+m[1],d=+m[2]; if(anchorYear==null) return {needYear:true,m:mo,d}; const id=makePeriodId(anchorYear,mo,d); return id?{y:anchorYear,m:mo,d,id}:null; }
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/); // 无年份 月/日 → 需要锚定年
  if(m){ const mo=+m[1],d=+m[2]; if(anchorYear==null) return {needYear:true,m:mo,d}; const id=makePeriodId(anchorYear,mo,d); return id?{y:anchorYear,m:mo,d,id}:null; }
  return null;
}

/* 唯一时间轴重建函数：新增周期 / 插入历史周 / JSON 导入 / 旧数据迁移全部走这里。
   输入可乱序 [{id,label?,days?}] → 按日期排序、重建 idx、统一 label。 */
function rebuildPeriods(periodsIn){
  const seen=new Map();
  (periodsIn||[]).forEach(p=>{
    if(!p||!p.id) return;
    const y=+String(p.id).slice(0,4), mo=+String(p.id).slice(5,7), d=+String(p.id).slice(8,10);
    if(!isRealDate(y,mo,d)) return;
    if(!seen.has(p.id)) seen.set(p.id,{ id:p.id, days:(Number.isInteger(p.days)&&p.days>0)?p.days:WEEK_DAYS });
  });
  const arr=[...seen.values()].sort((a,b)=>a.id<b.id?-1:1);
  arr.forEach((p,i)=>{ p.idx=i; p.label=periodLabelFromId(p.id); });
  return arr;
}

/* 旧标签序列 → 带 id 周期：锚定 baseYear（默认 TIMELINE_BASE_YEAR，用户已确认），月份回绕自动跨年（序列延续而非猜测） */
function periodsFromLegacyLabels(labels, baseYear){
  let year=(baseYear==null?TIMELINE_BASE_YEAR:baseYear), prevMonth=null;
  const out=[];
  (labels||[]).forEach(lb=>{
    const pi=parsePeriodInput(lb, null); // 先不带锚定：区分「输入自带年份」与「需锚定」
    if(!pi) return;
    if(pi.id){ year=pi.y; prevMonth=pi.m; out.push({id:pi.id, days:WEEK_DAYS}); return; }
    if(pi.needYear){
      if(prevMonth!==null && pi.m<prevMonth) year+=1; // 月份回绕 → 跨年 +1（序列延续而非猜测）
      prevMonth=pi.m;
      const id=makePeriodId(year, pi.m, pi.d);
      if(id) out.push({id, days:WEEK_DAYS});
    }
  });
  return rebuildPeriods(out);
}

/* 位置数组按旧 idx → 新 idx 重排（排序/插周后各 SKU 数据仍对应正确日期）；新周期补 undefined */
function remapPositional(series, oldPeriods, newPeriods){
  const pos={}; (oldPeriods||[]).forEach(p=>{ if(p&&p.id) pos[p.id]=p.idx; });
  return (newPeriods||[]).map(p=>{ const oi=pos[p.id]; return (oi===undefined||oi===null||!Array.isArray(series)) ? undefined : series[oi]; });
}

/* ---------------- CSV 解析（BOM/CRLF/引号逗号/双引号转义；引号内换行明确拒绝并给行号） ---------------- */
function parseCSVRobust(text){
  if(text==null) return {ok:false, errors:[{line:0,col:'',value:'',msg:'空文件'}]};
  let t=String(text);
  if(t.charCodeAt(0)===0xFEFF) t=t.slice(1);
  const rows=[], rowLines=[];
  let cur=[], field='', inQ=false, line=1, qLine=1;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(inQ){
      if(ch==='"'){ if(t[i+1]==='"'){ field+='"'; i++; } else inQ=false; }
      else if(ch==='\n'||ch==='\r'){ return {ok:false, errors:[{line:qLine,col:'',value:'',msg:'第 '+qLine+' 行：引号内换行（本版本不支持多行单元格），文件未导入'}]}; }
      else field+=ch;
    } else {
      if(ch==='"'){ if(field.trim()!=='') return {ok:false, errors:[{line,col:'',value:field,msg:'第 '+line+' 行：引号位置非法'}]}; inQ=true; qLine=line; }
      else if(ch===','){ cur.push(field); field=''; }
      else if(ch==='\n'){ cur.push(field); rows.push(cur); rowLines.push(line); cur=[]; field=''; line++; }
      else if(ch==='\r'){ if(t[i+1]!=='\n'){ cur.push(field); rows.push(cur); rowLines.push(line); cur=[]; field=''; line++; } }
      else field+=ch;
    }
  }
  if(inQ) return {ok:false, errors:[{line:qLine,col:'',value:'',msg:'第 '+qLine+' 行：引号未闭合'}]};
  if(field!==''||cur.length){ cur.push(field); rows.push(cur); rowLines.push(line); }
  const fr=[], fl=[];
  rows.forEach((r,i)=>{ if(r.some(c=>String(c).trim()!=='')){ fr.push(r); fl.push(rowLines[i]); } });
  return {ok:true, rows:fr, rowLines:fl};
}

/* ---------------- 数值校验（不 ||0；真实 0 合法；负数拒绝；千分位白名单；金额不用 parseInt） ---------------- */
function parseQtyRaw(v){ // 数量：合法整数（允许千分位）
  const s=String(v??'').trim();
  if(s==='') return {ok:false,msg:'空白必填字段'};
  if(/^-/.test(s)) return {ok:false,msg:'数量为负数（无退货口径支持，明确拒绝）',value:s};
  if(/^\d+$/.test(s)) return {ok:true,value:parseInt(s,10)};
  if(/^\d{1,3}(,\d{3})+$/.test(s)) return {ok:true,value:parseInt(s.replace(/,/g,''),10)};
  return {ok:false,msg:'非法整数（数量须为整数，可为 0）',value:s};
}
function parseAmountRaw(v){ // 金额：允许小数与合法千分位；"1,2,3" 不静默当 123
  const s=String(v??'').trim();
  if(s==='') return {ok:false,msg:'空白必填字段'};
  if(/^-/.test(s)) return {ok:false,msg:'金额为负数（无退货口径支持，明确拒绝）',value:s};
  if(/^\d+(\.\d+)?$/.test(s)) return {ok:true,value:parseFloat(s)};
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return {ok:true,value:parseFloat(s.replace(/,/g,''))};
  return {ok:false,msg:'非法金额格式',value:s};
}

/* CSV 导出转义 + 防电子表格公式注入（= + - @ Tab CR 开头加 '） */
function csvEscape(v){
  let s=String(v??'');
  if(/^[=+\-@\t\r]/.test(s)) s="'"+s;
  if(/[",\n\r]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
  return s;
}

/* ---------------- 表头 schema 识别（按列名，不仅凭列数） ---------------- */
function detectSchema(header){
  const H=(header||[]).map(h=>String(h||'').trim());
  const has=(...kws)=>H.some(h=>kws.some(k=>h.toLowerCase().includes(k.toLowerCase())));
  const pairCols=[];
  H.forEach((h,i)=>{ if(h.endsWith('数量')){ const base=h.slice(0,-2); const gi=H.findIndex((x,xi)=>xi>i&&x===base+'金额'); if(gi>=0) pairCols.push({name:base,volIdx:i,gmvIdx:gi}); } });
  if(has('商品编码','code') && has('期初','begin')) return {kind:'sku'};
  if(pairCols.length>0 && has('周期','period','周')) return {kind:'channelMatrix', pairCols};
  if(has('渠道','channel') && has('销售额','金额','gmv')) return {kind:'channelLong'};
  if(has('成本','cost')||has('供货')) return {kind:'cost'};
  if(has('控价','price')) return {kind:'price'};
  return {kind:'unknown'};
}

/* 渠道主数据：硬编码 CHANNELS + 现有数据中的渠道（受控新增：文件里新渠道允许导入并列入 warnings） */
function collectChannelMaster(channelWeekly, channelSkuWeekly){
  const set=[];
  const add=c=>{ if(c&&!set.includes(c)) set.push(c); };
  (channelWeekly||[]).forEach(r=>Object.keys(r||{}).forEach(k=>{ if(k.startsWith('g_')) add(k.slice(2)); }));
  Object.values(channelSkuWeekly||{}).forEach(chs=>Object.keys(chs||{}).forEach(add));
  (typeof CHANNELS!=='undefined'?CHANNELS:[]).forEach(add);
  return set;
}

/* ---------------- 原子快照构建（纯函数，不碰 state；校验失败不改任何数据） ---------------- */
/* SKU 周数据：主键 periodId+skuCode；文件内重复主键=冲突（库存快照不可相加）；导入已有数据=按主键 upsert 覆盖单元格 */
function buildSkuWeeksSnapshot(rows, mode, curWeeks, periods){
  const errs=[], norm=[];
  rows.forEach(r=>{
    const pi=parsePeriodInput(r.period, null);
    let pid=null;
    if(pi&&pi.id) pid=pi.id;
    else if(pi&&pi.needYear){ const ai=parsePeriodInput(r.period, TIMELINE_BASE_YEAR); pid=ai&&ai.id; }
    if(!pid){ errs.push({line:r.line,col:'周期',value:r.period,msg:'无法识别的周期（支持 M/D、M月D日、YYYY-MM-DD、M/D/YYYY）'}); return; }
    norm.push(Object.assign({}, r, {periodId:pid}));
  });
  if(errs.length) return {ok:false, errors:errs};
  const seen=new Map();
  for(const r of norm){
    const k=r.periodId+'|'+r.code;
    if(seen.has(k)) return {ok:false, errors:[{line:r.line,col:'商品编码',value:r.code,msg:'与第 '+seen.get(k)+' 行主键重复（'+k+'）：库存快照不可相加，请合并后重传'}]};
    seen.set(k, r.line);
  }
  const newPeriods=rebuildPeriods([...(periods||[]), ...norm.map(r=>({id:r.periodId}))]);
  const filePeriods=[...new Set(norm.map(r=>r.periodId))];
  const warnings=[];
  if(mode==='appendNew'){
    const dup=filePeriods.filter(id=>(periods||[]).some(p=>p.id===id));
    if(dup.length) return {ok:false, errors:[{line:0,col:'周期',value:dup.join('、'),msg:'「仅新增周期」模式下周期已存在：'+dup.map(periodLabelFromId).join('、')+'，禁止静默累加；如需更新请改用「按业务主键更新」'}]};
  }
  const base={};
  Object.keys(curWeeks||{}).forEach(code=>{
    base[code]= mode==='replace' ? newPeriods.map(()=>({})) : remapPositional(curWeeks[code]||[], periods||[], newPeriods).map(c=>c||{});
  });
  const idxOf={}; newPeriods.forEach(p=>{ idxOf[p.id]=p.idx; });
  let applied=0;
  norm.forEach(r=>{
    const arr=base[r.code]||(base[r.code]=newPeriods.map(()=>({})));
    arr[idxOf[r.periodId]]={begin:r.begin,inbound:r.inbound,end:r.end,sales:r.sales,gmv:r.gmv,unitPrice:r.sales>0?+(r.gmv/r.sales).toFixed(2):0};
    applied++;
  });
  return {ok:true, applied, warnings, periods:newPeriods, skuWeeks:base, filePeriods, norm};
}

/* 渠道数据：主键 periodId+channel(+skuCode)。
   矩阵/明细行在文件内部按主键聚合合法；导入已有数据 upsert 不累加。
   汇总输入（无 SKU 明细）→ 替换时清除旧 SKU 明细并警告（不得用旧明细继续算活动 ROI）。 */
function buildChannelSnapshot(rows, mode, curAgg, curDetail, periods){
  const errs=[], norm=[];
  rows.forEach(r=>{
    const pi=parsePeriodInput(r.period, null);
    let pid=null;
    if(pi&&pi.id) pid=pi.id;
    else if(pi&&pi.needYear){ const ai=parsePeriodInput(r.period, TIMELINE_BASE_YEAR); pid=ai&&ai.id; }
    if(!pid){ errs.push({line:r.line,col:'周期',value:r.period,msg:'无法识别的周期'}); return; }
    norm.push(Object.assign({}, r, {periodId:pid}));
  });
  if(errs.length) return {ok:false, errors:errs};
  const hasDetail=norm.some(r=>r.code);
  const newPeriods=rebuildPeriods([...(periods||[]), ...norm.map(r=>({id:r.periodId}))]);
  const filePeriods=[...new Set(norm.map(r=>r.periodId))];
  const warnings=[];
  if(mode==='appendNew'){
    const dup=filePeriods.filter(id=>(periods||[]).some(p=>p.id===id));
    if(dup.length) return {ok:false, errors:[{line:0,col:'周期',value:dup.join('、'),msg:'「仅新增周期」模式下周期已存在：'+dup.map(periodLabelFromId).join('、')+'，禁止静默累加'}]};
  }
  const idxOf={}; newPeriods.forEach(p=>{ idxOf[p.id]=p.idx; });
  // 文件内按主键聚合
  const aggMap={}, detMap={};
  norm.forEach(r=>{
    if(r.code){
      const k=r.periodId+'|'+r.channel+'|'+r.code;
      if(!detMap[k]) detMap[k]={periodId:r.periodId, channel:r.channel, code:r.code, gmv:0, vol:0};
      detMap[k].gmv+=r.gmv; detMap[k].vol+=r.vol;
    } else {
      const k=r.periodId+'|'+r.channel;
      if(!aggMap[k]) aggMap[k]={periodId:r.periodId, channel:r.channel, gmv:0, vol:0};
      aggMap[k].gmv+=r.gmv; aggMap[k].vol+=r.vol;
    }
  });
  // 底：upsert/appendNew 保留现状（按新时间轴重排）；replace 清空本域
  let detail={};
  if(mode!=='replace'){
    Object.keys(curDetail||{}).forEach(code=>{
      detail[code]={};
      Object.keys(curDetail[code]||{}).forEach(ch=>{
        detail[code][ch]=remapPositional(curDetail[code][ch]||[], periods||[], newPeriods).map(c=>c===undefined?null:c);
      });
    });
  }
  let detailInvalidated=false;
  if(mode==='replace' && !hasDetail && Object.keys(curDetail||{}).length>0){
    detailInvalidated=true; // 汇总输入替换渠道历史 → 旧 SKU 明细失效清除
    warnings.push('本次为渠道汇总输入（无 SKU 明细），替换后旧 SKU×渠道 明细已失效清除，活动 ROI 将暂按无明细口径提示');
  }
  // 明细 upsert
  Object.values(detMap).forEach(r=>{
    if(!detail[r.code]) detail[r.code]={};
    if(!detail[r.code][r.channel]) detail[r.code][r.channel]=newPeriods.map(()=>null);
    const arr=detail[r.code][r.channel];
    while(arr.length<newPeriods.length) arr.push(null);
    arr[idxOf[r.periodId]]={gmv:r.gmv, vol:r.vol};
  });
  // 汇总：replace 重建空表；明细输入时从明细重算对应周期；汇总输入 upsert 汇总值
  let agg;
  if(mode==='replace') agg=newPeriods.map(p=>({id:p.id, label:p.label}));
  else agg=newPeriods.map(p=>{ const oi=(periods||[]).findIndex(q=>q.id===p.id); const old=(oi>=0&&curAgg&&curAgg[oi])?curAgg[oi]:null; const row={id:p.id, label:p.label}; if(old) Object.keys(old).forEach(k=>{ if(k.startsWith('g_')||k.startsWith('v_')) row[k]=old[k]; }); return row; });
  if(hasDetail){
    // 明细覆盖的 (period,channel) 汇总由明细重算
    const touched={};
    Object.values(detMap).forEach(r=>{ const k=r.periodId+'|'+r.channel; if(!touched[k]) touched[k]={gmv:0,vol:0}; touched[k].gmv+=r.gmv; touched[k].vol+=r.vol; });
    Object.keys(touched).forEach(k=>{
      const [pid,ch]=k.split('|'); const row=agg[idxOf[pid]];
      row['g_'+ch]=touched[k].gmv; row['v_'+ch]=touched[k].vol;
    });
  }
  Object.values(aggMap).forEach(r=>{
    const row=agg[idxOf[r.periodId]];
    row['g_'+r.channel]=r.gmv; row['v_'+r.channel]=r.vol;
  });
  const applied=Object.keys(detMap).length+Object.keys(aggMap).length;
  return {ok:true, applied, warnings, periods:newPeriods, channelWeekly:agg, channelSkuWeekly:detail, detailInvalidated, filePeriods, hasDetail};
}

/* ---------------- 统一 SKU 指标（唯一实现；缺周保留 null；missing 不补 0） ---------------- */
function genSkuMetrics(skus, weeks, periods){
  const out={};
  for(const s of skus){
    const series=weeks[s.code]||[];
    out[s.code]=(periods||[]).map((p,i)=>{
      const w=series[i]||{};
      const days=(p&&p.days)||WEEK_DAYS;
      const has=v=>typeof v==='number'&&Number.isFinite(v);
      const begin=has(w.begin)?w.begin:null, inbound=has(w.inbound)?w.inbound:null, sales=has(w.sales)?w.sales:null, gmv=has(w.gmv)?w.gmv:null, end=has(w.end)?w.end:null;
      // 期初=固定统计起点（时间轴第一周）的显式 begin，包括合法 0；起点缺失则累计指标不可用
      const w0=series[0]||{};
      const firstBegin=has(w0.begin)?w0.begin:null;
      let totalSales=0, salesComplete=true;
      for(let j=0;j<=i;j++){ const sv=(series[j]||{}).sales; if(typeof sv==='number'&&Number.isFinite(sv)) totalSales+=sv; else salesComplete=false; }
      let ratio=null, ratioNet=null, ratioStatus='ok';
      if(sales===null||end===null){ ratioStatus='missing'; }
      else if(sales>0){ ratio=+(end/(sales/days*30)).toFixed(2); ratioNet=(inbound===null)?null:+(Math.max(0,end-inbound)/(sales/days*30)).toFixed(2); }
      else if(end>0){ ratioStatus='no_sales_with_stock'; }       // 无动销（有库存），不再用 99
      else { ratioStatus='no_stock_no_sales'; }
      const turnover=(firstBegin===null||end===null||!salesComplete)?null:((firstBegin+end)>0?+(totalSales/((firstBegin+end)/2)).toFixed(2):null);
      // v3.8：滚动4周周转——近4周售出 ÷ ((窗口第一周 begin + 当周 end)/2)；窗口内任一周销量缺失或端点缺失则当周为 null（断线不补，缺口只影响前后4周）
      let turnover4w=null;
      { const ws=Math.max(0,i-3); const wStart=series[ws]||{};
        const winBegin=has(wStart.begin)?wStart.begin:null;
        let winSales=0, winComplete=true;
        for(let j=ws;j<=i;j++){ const sv=(series[j]||{}).sales; if(typeof sv==='number'&&Number.isFinite(sv)) winSales+=sv; else winComplete=false; }
        if(winBegin!==null && end!==null && winComplete){ const avg=(winBegin+end)/2; turnover4w=avg>0?+(winSales/avg).toFixed(4):null; } }
      const dailyAvg=(sales===null)?null:+(sales/days).toFixed(2);
      const avgPrice=(sales===null||sales===0||gmv===null)?null:+(gmv/sales).toFixed(2);
      return { period:p?p.label:'', periodId:p?p.id:'',
        begin, inbound, end, sales, gmv,
        unitPrice:avgPrice,
        ratio, ratioNet, ratioStatus, turnover, turnover4w, dailyAvg, avgPrice };
    });
  }
  return out;
}

/* ---------------- v3.7（规则七）：数据质量与对账报告（纯函数，可单测） ---------------- */
function computeQualityReport({ skuMaster, skuWeeks, channelWeekly, channelSkuWeekly, cost, supply, ctrl, dataCoverage, periods }){
  const issues = [];
  const masterCodes = new Set((skuMaster||[]).map(s => String(s.code)));
  const P = periods || [];

  // 1) 未维护 SKU：出现在周数据/渠道明细但不在主数据（扫两个域，不只利润页）
  const unmaintained = new Set();
  Object.keys(skuWeeks||{}).forEach(c => { if (!masterCodes.has(String(c))) unmaintained.add(c); });
  Object.keys(channelSkuWeekly||{}).forEach(c => { if (!masterCodes.has(String(c))) unmaintained.add(c); });
  if (unmaintained.size) issues.push({ sev:'high', kind:'unmaintained_sku', title:'未维护 SKU', count: unmaintained.size,
    detail: [...unmaintained].slice(0,20).map(c => c + ' 有周数据但未在 SKU 主数据中维护') });

  // 2) 库存恒等式：residual = end-(begin+inbound-sales)，四字段齐全才算；只报告不改数据
  const resid = [];
  Object.entries(skuWeeks||{}).forEach(([code, series]) => {
    (series||[]).forEach((w, i) => {
      if (!w) return;
      const f = [w.begin, w.inbound, w.sales, w.end];
      if (!f.every(v => typeof v === 'number' && Number.isFinite(v))) return;
      const r = w.end - (w.begin + w.inbound - w.sales);
      if (r !== 0) resid.push({ code, label: P[i]?.label || ('#'+i), residual: r });
    });
  });
  if (resid.length) issues.push({ sev:'mid', kind:'inventory_residual', title:'库存恒等式差异（不自动修正）', count: resid.length,
    detail: resid.slice(0,20).map(x => `${x.code} @ ${x.label}：期末-(期初+入库-销售) = ${x.residual}`) });

  // 3) 库存连续性：本周 begin vs 上周 end
  const disc = [];
  Object.entries(skuWeeks||{}).forEach(([code, series]) => {
    for (let i = 1; i < (series||[]).length; i++) {
      const prev = series[i-1], cur = series[i];
      if (!prev || !cur) continue;
      if (typeof prev.end === 'number' && Number.isFinite(prev.end) && typeof cur.begin === 'number' && Number.isFinite(cur.begin) && prev.end !== cur.begin)
        disc.push({ code, label: P[i]?.label || ('#'+i), prevEnd: prev.end, begin: cur.begin });
    }
  });
  if (disc.length) issues.push({ sev:'mid', kind:'inventory_continuity', title:'库存连续性断点', count: disc.length,
    detail: disc.slice(0,20).map(x => `${x.code} @ ${x.label}：期初 ${x.begin} ≠ 上周期末 ${x.prevEnd}`) });

  // 4) SKU总GMV vs 渠道总GMV：范围/完整性一致才标可对账
  const skuGmvByIdx = P.map((_, i) => Object.values(skuWeeks||{}).reduce((t, s) => t + ((s[i] && typeof s[i].gmv === 'number') ? s[i].gmv : 0), 0));
  const chGmvByIdx = P.map((_, i) => { const row = (channelWeekly||[])[i] || {}; return Object.keys(row).filter(k => k.startsWith('g_')).reduce((t, k) => t + (row[k] || 0), 0); });
  const covSku = (dataCoverage && dataCoverage.skuWeeks) || {};
  const scopeConsistent = P.length > 0 && P.every(p => {
    const c = covSku[p.id] || covSku[p.label];
    return c && c.status === 'complete' && c.missingMeansZero === true;
  });
  const gmvDiffIdx = [];
  for (let i = 0; i < P.length; i++) { if (Math.abs(skuGmvByIdx[i] - chGmvByIdx[i]) > 0.01) gmvDiffIdx.push(i); }
  if (!scopeConsistent) {
    issues.push({ sev:'info', kind:'gmv_recon_scope', title:'SKU总GMV vs 渠道总GMV', count: gmvDiffIdx.length,
      detail: ['覆盖范围不完整/未知，两口径不可直接对账（需先在导入时确认「无记录=零销量」）。数值不一致周期：' + (gmvDiffIdx.slice(0,10).map(i => P[i]?.label).join('、') || '无')] });
  } else if (gmvDiffIdx.length) {
    issues.push({ sev:'high', kind:'gmv_recon_diff', title:'SKU总GMV ≠ 渠道总GMV（可对账范围）', count: gmvDiffIdx.length,
      detail: gmvDiffIdx.slice(0,20).map(i => `${P[i]?.label}：SKU口径 ¥${skuGmvByIdx[i].toFixed(0)} vs 渠道口径 ¥${chGmvByIdx[i].toFixed(0)}`) });
  }

  // 5) 渠道汇总 vs 渠道明细（GMV+销量分别对账）
  const chMismatch = [];
  P.forEach((p, i) => {
    const row = (channelWeekly||[])[i] || {};
    const chans = Object.keys(row).filter(k => k.startsWith('g_')).map(k => k.slice(2));
    chans.forEach(ch => {
      let dg = 0, dv = 0, has = false;
      Object.values(channelSkuWeekly||{}).forEach(chs => {
        const cell = chs && chs[ch] && chs[ch][i];
        if (cell && typeof cell === 'object') { has = true; dg += cell.gmv || 0; dv += cell.vol || 0; }
      });
      if (!has) return; // 无明细覆盖，不可对账
      const ag = row['g_' + ch] || 0, av = row['v_' + ch] || 0;
      if (Math.abs(dg - ag) > 0.01 || dv !== av) chMismatch.push(`${p.label} · ${ch}：明细 ¥${dg.toFixed(0)}/${dv}件 vs 汇总 ¥${ag.toFixed(0)}/${av}件`);
    });
  });
  if (chMismatch.length) issues.push({ sev:'mid', kind:'channel_recon', title:'渠道汇总 ≠ 渠道明细', count: chMismatch.length, detail: chMismatch.slice(0,20) });

  // 6) 缺成本/供价/控价
  const missCost = (skuMaster||[]).filter(s => toMetricNumber((cost||{})[s.code]) === null).map(s => s.code);
  const missSupply = (skuMaster||[]).filter(s => toMetricNumber((supply||{})[s.code]) === null).map(s => s.code);
  const missCtrl = (skuMaster||[]).filter(s => toMetricNumber((ctrl||{})[s.code]) === null).map(s => s.code);
  if (missCost.length) issues.push({ sev:'high', kind:'missing_cost', title:'缺成本', count: missCost.length, detail: missCost.slice(0,20) });
  if (missSupply.length) issues.push({ sev:'high', kind:'missing_supply', title:'缺供货价', count: missSupply.length, detail: missSupply.slice(0,20) });
  if (missCtrl.length) issues.push({ sev:'low', kind:'missing_ctrl', title:'缺控价', count: missCtrl.length, detail: missCtrl.slice(0,20) });

  // 7) 缺周：主数据 SKU 在某周无任何记录
  const missingWeeks = [];
  (skuMaster||[]).forEach(s => {
    const series = (skuWeeks||{})[s.code] || [];
    P.forEach((p, i) => {
      const w = series[i];
      if (!w || Object.keys(w).length === 0) missingWeeks.push(s.code + ' @ ' + p.label);
    });
  });
  if (missingWeeks.length) issues.push({ sev:'low', kind:'missing_weeks', title:'SKU 缺周记录', count: missingWeeks.length, detail: missingWeeks.slice(0,20) });

  return { issues, checkedAt: Date.now() };
}

function normalizeImportedActivity(act) {
  if (!act || typeof act !== 'object') return null;
  const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
  const legacySubsidy = n(act.activityPriceSubsidy);
  const hasNewFields = act.consumerPriceSubsidy !== undefined || act.distributorRebate !== undefined;
  // 旧数据只有 activityPriceSubsidy 时，兼容归入消费者端补贴，且不得重复扣减
  const consumerPriceSubsidy = hasNewFields ? n(act.consumerPriceSubsidy) : legacySubsidy;
  const distributorRebate = hasNewFields ? n(act.distributorRebate) : 0;
  return {
    ...act,
    activityChannel: act.activityChannel || 'ALL',
    skuMode: act.skuMode || (act.skuCodes && act.skuCodes.length > 0 ? 'custom' : 'all'),
    activityPriceSubsidy: legacySubsidy,
    consumerPriceSubsidy,
    distributorRebate,
    updatedAt: act.updatedAt || act.createdAt || Date.now()
  };
}

      const gmv = Math.round(sales*unitPrice);

    }

function genChannelWeekly(skus, weeks, seed=987654321){

  const rng = mulberry32(seed);

  const CAT_CH_W = {};

  for (const c of CATS){

    const w = CHANNELS.map(()=>0.3+rng()*rng()*3);

    const sum = w.reduce((a,b)=>a+b,0);

    CAT_CH_W[c.key] = w.map(x=>x/sum);

  }

  return PERIODS.map(p=>{

    const row = { label:p.label };

    CHANNELS.forEach((ch,ci)=>{

      let gmv=0, vol=0;

      for (const s of skus){

        const w = weeks[s.code][p.idx];

        const wt = CAT_CH_W[s.cat][ci]*(0.85+rng()*0.3);

        gmv += w.gmv*wt; vol += w.sales*wt;

      }

      row['g_'+ch]=Math.round(gmv); row['v_'+ch]=Math.round(vol);

    });

    return row;

  });

}

function toMetricNumber(value) {
  if (typeof value === 'number') {
    return Number.isFinite(value) ? value : null;
  }
  if (typeof value !== 'string') return null;
  const text = value.trim();
  if (!text) return null;
  const n = Number(text);
  return Number.isFinite(n) ? n : null;
}

function fmtFixed(value, digits = 2) {
  const n = toMetricNumber(value);
  return n === null ? '—' : n.toFixed(digits);
}

function fmtRatioValue(value, digits = 2) {
  if (value === Infinity) return '∞';
  return fmtFixed(value, digits);
}

function fmtSignedPercent(value, digits = 2) {
  const n = toMetricNumber(value);
  return n === null ? '—' : (n > 0 ? '+' : '') + n.toFixed(digits) + '%';
}

  const n = toMetricNumber(value);

  return (n < 0 ? '-' : '') + text;
};

const fmtNum = value => {
  const n = toMetricNumber(value);
  return n === null ? '—' : Math.round(n).toLocaleString('zh-CN');
};

const pct = value => fmtSignedPercent(value, 2);

// 有符号金额：负数正确显示 -¥X，非有限值显示 —
const fmtSignedMoney = value => {
  const n = toMetricNumber(value);
  if (n === null) return '—';
  return (n < 0 ? '-¥' : '¥') + fmtMoney(Math.abs(n));
};

function Sparkline({ data, dataKey, color, valueFormatter }) {
  const rows = Array.isArray(data) ? data : [];
  const latestValue = rows.length
    ? toMetricNumber(rows[rows.length - 1]?.[dataKey])
    : null;

  // v3.5：缺失点断线（M 重新起笔），不再把缺口连线；x/y 二次校验杜绝 NaN
  const path = useMemo(() => {
    const vals = rows.map(row => toMetricNumber(row?.[dataKey]));
    const finite = vals.filter(v => v !== null);
    if (!finite.length) return '';

    const min = Math.min(...finite);
    const max = Math.max(...finite);
    const range = max - min;
    const W = 120, H = 30, pad = 3;

    if (!Number.isFinite(range)) return '';

    let connected = false;
    const commands = [];

    vals.forEach((v, i) => {
      if (v === null) {
        connected = false;
        return;
      }

      const x = vals.length > 1
        ? pad + i / (vals.length - 1) * (W - 2 * pad)
        : W / 2;

      const y = range === 0
        ? H / 2
        : H - pad - (v - min) / range * (H - 2 * pad);

      if (!Number.isFinite(x) || !Number.isFinite(y)) {
        connected = false;
        return;
      }

      commands.push(
        (connected ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1)
      );
      connected = true;
    });

    return commands.join(' ');
  }, [data, dataKey]);

  return (
    <div className="flex items-center gap-2">
      <svg width={120} height={30} style={{ flexShrink: 0 }}>
        {path && (
          <path
            d={path}
            fill="none"
            stroke={color || '#64748b'}
            strokeWidth={1.5}
            strokeLinejoin="round"
            strokeLinecap="round"
          />
        )}
      </svg>
      <span
        className="text-xs tabular-nums text-slate-600 text-right"
        style={{ minWidth: '3rem' }}
      >
        {latestValue === null
          ? '—'
          : valueFormatter
            ? valueFormatter(latestValue)
            : latestValue.toFixed(2)}
      </span>
    </div>
  );
}

    if (typeof window === 'undefined' || window.location.protocol === 'file:') return;

    const scopeId = gistIdFromUrl || safeStorage.getItem('zhaofeng_gist_id') || DEFAULT_GIST_ID || '';

            <Card title="价格 / 动销 / 库存 联动分析" subtitle="柱=期末库存（左轴件）｜绿线=周销量（左轴件）｜红线=倒算均价（右轴元）">

              <div className="h-72 w-full">

                  <ComposedChart data={safeSeries} margin={{top:5,right:10,left:0,bottom:0}}>

                    <XAxis dataKey="period" tick={{fontSize:12,fill:'#94a3b8'}}/>

                    <YAxis yAxisId="l" tick={{fontSize:12,fill:'#94a3b8'}}/>

                    <YAxis yAxisId="r" orientation="right" tick={{fontSize:12,fill:'#94a3b8'}} domain={['auto','auto']}/>

                    <Tooltip/>

                    <Legend/>

                    <Bar yAxisId="l" name="期末库存" dataKey="end" fill="#e0e7ff" radius={[3,3,0,0]}/>

                    <Line yAxisId="l" name="周销量" dataKey="sales" stroke="#16a34a" strokeWidth={2} dot={false}/>

                    <Line yAxisId="r" name="倒算均价" dataKey="avgPrice" stroke="#dc2626" strokeWidth={2} dot={{r:2}}/>

        {tab==='channel' && <ChannelView channelWeekly={channelWeekly} onUpload={()=>setShowUploadChannel(true)} isReadOnly={isReadOnly} />}



        {tab==='insight' && <InsightView skuMaster={sortedSkuMaster} skuWeeks={skuWeeks} skuMetrics={skuMetrics} channelWeekly={channelWeekly} channelSkuWeekly={channelSkuWeekly} isReadOnly={isReadOnly}/>}



        {tab==='activity' && <DataQualityCard skuMaster={skuMaster} skuWeeks={skuWeeks} channelWeekly={channelWeekly} channelSkuWeekly={channelSkuWeekly} cost={cost} supply={supply} ctrl={ctrl} dataCoverage={dataCoverage} qualityIgnores={qualityIgnores} setQualityIgnores={setQualityIgnores} isReadOnly={isReadOnly} />}
        {tab==='activity' && <ActivityView skuWeeks={skuWeeks} skuMaster={sortedSkuMaster} channelSkuWeekly={channelSkuWeekly} channelWeekly={channelWeekly} activities={activities} setActivities={setActivities} cost={cost} supply={supply} opRate={opRate} isReadOnly={isReadOnly} dataCoverage={dataCoverage} />}



        {tab==='profit' && <ProfitView cost={cost} setCost={setCost} supply={supply} setSupply={setSupply} skuWeeks={skuWeeks} skuMaster={sortedSkuMaster} opRate={opRate} setOpRate={setOpRate} isReadOnly={isReadOnly} />}



        {tab==='price' && <PriceCtrlView ctrl={ctrl} setCtrl={setCtrl} skuCode={skuCode} setSkuCode={setSkuCode} skuMetrics={skuMetrics} skuWeeks={skuWeeks} skuMaster={sortedSkuMaster} isReadOnly={isReadOnly} />}


        {/* 在线仅阅读版：BatchUploadModal / SkuManagerModal / PasswordSetting / GistSyncModal 等上传与编辑弹窗已物理移除 */}
        <div className="flex items-start gap-2 text-xs text-slate-400 px-1 pb-4">

          <Info className="w-3.5 h-3.5 mt-0.5 shrink-0"/>

          <span>数据由本地可编辑版维护并通过 Gist 同步推送；本页面为仅阅读版本，不提供任何编辑与上传入口。</span>

        </div>



        

        

        

        {showTotalTrend && <TotalTrendModal data={totalTrendData} mode={showTotalTrend} onClose={()=>setShowTotalTrend(null)}/>}

        

        

      </div>

    </div>

  );

}

function BatchUploadModal({open,onClose,mode,onApply,onPreview,skuMaster}){
  const isCost=mode==='cost', isPrice=mode==='price', isSku=mode==='sku', isChannel=mode==='channel';
  const [step,setStep]=useState('idle');
  const [fileName,setFileName]=useState('');
  // v3.7（规则三）：三模式语义——replace 覆盖全部历史 / upsert 按业务主键更新（默认）/ appendNew 仅新增周期
  const [uploadMode,setUploadMode]=useState('upsert');
  const [parsed,setParsed]=useState([]);
  const [parseFatal,setParseFatal]=useState(null);   // 文件级致命错误（引号内换行 / 超 5000 行 / 未识别 schema）
  const [coverageConfirmed,setCoverageConfirmed]=useState(false);
  const [applyResult,setApplyResult]=useState(null);
  const fileRef=useRef(null);

  const isWeekly = isSku || isChannel;

  // v3.7（规则二）：CSV 强化解析——BOM/CRLF/引号逗号/双引号转义；引号内换行明确拒绝并给行号；5000 行按源数据行真限制
  const parseFile=(text)=>{
    const r=parseCSVRobust(text);
    if(!r.ok) return r;
    if(r.rows.length>CSV_MAX_ROWS) return {ok:false, errors:[{line:CSV_MAX_ROWS+1,col:'',value:'',msg:'文件共 '+r.rows.length+' 行，超过单次上限 '+CSV_MAX_ROWS+' 行（按源数据行计算），请拆分后导入'}]};
    return r;
  };

  // 表头映射：按列名定位（不凭列数）；无表头退回固定列序（兼容旧模板）
  const colIdx=(header, kws, def)=>{
    if(!header) return def;
    const i=header.findIndex(h=>kws.some(k=>String(h||'').toLowerCase().includes(k.toLowerCase())));
    return i>=0?i:def;
  };

  const validateRows=(rawRows, rowLines)=>{
    if(isSku){
      let header=null, start=0;
      if(rawRows[0] && (rawRows[0].some(c=>String(c||'').includes('商品编码')) || rawRows[0].some(c=>String(c||'').toLowerCase()==='code'))){ header=rawRows[0].map(h=>String(h||'').trim()); start=1; }
      const ci={ code:colIdx(header,['商品编码','code','编码'],0), period:colIdx(header,['周期','period','周'],1), begin:colIdx(header,['期初'],2), inbound:colIdx(header,['入库'],3), sales:colIdx(header,['销售数量','销量','销售'],4), gmv:colIdx(header,['gmv','GMV','金额','销售额'],5), end:colIdx(header,['期末'],6) };
      const out=[];
      for(let i=start;i<rawRows.length;i++){
        const cols=rawRows[i]; const line=rowLines?rowLines[i]:i+1;
        const code=String(cols[ci.code]??'').trim(); // SKU 编码按字符串匹配（前导零安全）
        const period=String(cols[ci.period]??'').trim();
        const s=skuMaster.find(x=>String(x.code)===code);
        if(!code){ out.push({line,code:'',name:'',period,begin:0,inbound:0,sales:0,gmv:0,end:0,status:'err',msg:'商品编码空白'}); continue; }
        if(!s){ out.push({line,code,name:'',period,begin:0,inbound:0,sales:0,gmv:0,end:0,status:'err',msg:'商品编码不存在（未在主数据中）'}); continue; }
        const fields=[['期初库存',ci.begin,'qty','begin'],['入库数',ci.inbound,'qty','inbound'],['销售数量',ci.sales,'qty','sales'],['GMV',ci.gmv,'amt','gmv'],['期末库存',ci.end,'qty','end']];
        const row={line,code:s.code,name:s.name,period,status:'ok',msg:''};
        let bad=false;
        for(const [colName,idx,kind,key] of fields){
          const raw=cols[idx];
          const pr=kind==='qty'?parseQtyRaw(raw):parseAmountRaw(raw);
          if(!pr.ok){ row.status='err'; row.msg='第 '+line+' 行 · '+colName+'：'+pr.msg+'（原值「'+String(raw??'').trim()+'」）'; bad=true; break; }
          row[key]=pr.value;
        }
        if(!bad && !period){ row.status='err'; row.msg='第 '+line+' 行 · 周期：空白必填字段'; }
        out.push(row);
      }
      return out;
    }
    if(isChannel){
      const header=rawRows[0]?rawRows[0].map(h=>String(h||'').trim()):null;
      const schema=detectSchema(header||[]);
      const master=collectChannelMaster(null, null); // 渠道主数据：硬编码 CHANNELS
      if(schema.kind==='channelMatrix'){
        const start=1;
        const results=[];
        for(let i=start;i<rawRows.length;i++){
          const row=rawRows[i]; if(!row||row.length===0) continue;
          const line=rowLines?rowLines[i]:i+1;
          const period=String(row[0]??'').trim();
          const code=String(row[1]??'').trim();
          if(!period){ results.push({line,period:'',code,channel:'',gmv:0,vol:0,status:'err',msg:'第 '+line+' 行 · 周期：空白必填字段'}); continue; }
          schema.pairCols.forEach(pc=>{
            const volR=parseQtyRaw(row[pc.volIdx]);
            const gmvR=parseAmountRaw(row[pc.gmvIdx]);
            if(!volR.ok){ results.push({line,period,code,channel:pc.name,gmv:0,vol:0,status:'err',msg:'第 '+line+' 行 · '+pc.name+'数量：'+volR.msg+'（原值「'+String(row[pc.volIdx]??'').trim()+'」）'}); return; }
            if(!gmvR.ok){ results.push({line,period,code,channel:pc.name,gmv:0,vol:0,status:'err',msg:'第 '+line+' 行 · '+pc.name+'金额：'+gmvR.msg+'（原值「'+String(row[pc.gmvIdx]??'').trim()+'」）'}); return; }
            const isNewCh=!master.includes(pc.name);
            results.push({line,period,code,channel:pc.name,gmv:gmvR.value,vol:volR.value,status:'ok',msg:isNewCh?'受控新增渠道：'+pc.name:''});
          });
        }
        if(results.length===0) return [{status:'err',msg:'未找到数据行。'}];
        return results;
      }
      // 纵向格式：周期,渠道,销售额,销售量[,商品编码]（按表头定位；无表头按旧列序）
      const hasHead=header && header.some(h=>/渠道|channel/i.test(h||''));
      const ci=hasHead?{ period:colIdx(header,['周期','period','周'],0), channel:colIdx(header,['渠道','channel'],1), gmv:colIdx(header,['销售额','金额','gmv'],2), vol:colIdx(header,['销售量','数量','vol'],3), code:colIdx(header,['商品编码','code'],4) }
                      :{ period:0, channel:1, gmv:2, vol:3, code:4 };
      const start=hasHead?1:0;
      const out=[];
      for(let i=start;i<rawRows.length;i++){
        const cols=rawRows[i]; const line=rowLines?rowLines[i]:i+1;
        const period=String(cols[ci.period]??'').trim();
        const channel=String(cols[ci.channel]??'').trim();
        const code=String(cols[ci.code]??'').trim();
        if(!channel){ out.push({line,period,channel:'',gmv:0,vol:0,status:'err',msg:'第 '+line+' 行 · 渠道：空白必填字段'}); continue; }
        const gmvR=parseAmountRaw(cols[ci.gmv]);
        const volR=parseQtyRaw(cols[ci.vol]);
        if(!gmvR.ok){ out.push({line,period,channel,gmv:0,vol:0,status:'err',msg:'第 '+line+' 行 · 销售额：'+gmvR.msg+'（原值「'+String(cols[ci.gmv]??'').trim()+'」）'}); continue; }
        if(!volR.ok){ out.push({line,period,channel,gmv:0,vol:0,status:'err',msg:'第 '+line+' 行 · 销售量：'+volR.msg+'（原值「'+String(cols[ci.vol]??'').trim()+'」）'}); continue; }
        const isNewCh=!master.includes(channel);
        out.push({line,period,code,channel,gmv:gmvR.value,vol:volR.value,status:'ok',msg:isNewCh?'受控新增渠道：'+channel:''});
      }
      return out;
    }
    const dataRows=rawRows.filter(cols=>{const code=String(cols[0]||'').trim(); return code!=='商品编码'&&code!=='编码'&&code.toLowerCase()!=='code'&&code!=='商品';});
    return dataRows.map((cols,i)=>{
      const line=rowLines?rowLines[i]:i+1;
      if(isCost){
        const [code,name,cStr,spStr,date]=cols;
        const s=skuMaster.find(x=>String(x.code)===String(code||'').trim());
        if(!s) return {line,code:code||'',name:name||'',c:0,sp:0,date:date||'',status:'err',msg:'商品编码不存在'};
        const cR=parseAmountRaw(cStr), spR=parseAmountRaw(spStr);
        if(!cR.ok||!spR.ok) return {line,code:s.code,name:s.name,c:0,sp:0,date:date||'',status:'err',msg:'第 '+line+' 行：成本/供货价 '+(cR.ok?'':cR.msg)+(spR.ok?'':('；供货价 '+spR.msg))};
        return {line,code:s.code,name:s.name,c:cR.value,sp:spR.value,date:date||'',status:'ok',msg:''};
      }
      const [code,name,cpStr,date]=cols;
      const s=skuMaster.find(x=>String(x.code)===String(code||'').trim());
      if(!s) return {line,code:code||'',name:name||'',cp:0,date:date||'',status:'err',msg:'商品编码不存在'};
      const cpR=parseAmountRaw(cpStr);
      if(!cpR.ok) return {line,code:s.code,name:s.name,cp:0,date:date||'',status:'err',msg:'第 '+line+' 行 · 控价：'+cpR.msg};
      return {line,code:s.code,name:s.name,cp:cpR.value,date:date||'',status:'ok',msg:''};
    });
  };

  const handleFile=(file)=>{
    if(!file) return;
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext==='xlsx'||ext==='xls'){alert('当前仅支持 .csv 格式上传。');return;}
    setFileName(file.name);
    setParseFatal(null); setApplyResult(null); setCoverageConfirmed(false);
    const reader=new FileReader();
    reader.onload=(e)=>{
      const pr=parseFile(e.target.result);
      if(!pr.ok){ setParseFatal(pr.errors); setParsed([]); setStep('validated'); return; }
      const validated=validateRows(pr.rows, pr.rowLines);
      setParsed(validated); setStep('validated');
    };
    reader.readAsText(file);
  };
  const handleSelect=()=>{if(fileRef.current) fileRef.current.click();};
  const handleDrop=(e)=>{e.preventDefault(); const files=e.dataTransfer.files; if(files.length>0) handleFile(files[0]);};
  const handleDragOver=(e)=>{e.preventDefault();};
  if(!open) return null;
  const okRows=parsed.filter(r=>r.status==='ok');
  const errCount=parsed.length-okRows.length;
  const warnRows=okRows.filter(r=>r.msg);
  const reset=()=>{setStep('idle');setFileName('');setUploadMode('upsert');setParsed([]);setParseFatal(null);setApplyResult(null);setCoverageConfirmed(false);};
  const close=()=>{reset();onClose();};

  // v3.7（规则四）：导入预览——纯函数，不碰 state；展示覆盖范围/新增周期/差异与警告
  const preview=(isWeekly && okRows.length>0 && typeof onPreview==='function') ? onPreview(okRows, uploadMode) : null;

  // v3.7（规则一）：异步原子确认——onApply 返回 {ok,applied,warnings}/{ok:false,errors}；失败停留在当前步骤并展示错误
  const confirm=async ()=>{
    if(okRows.length===0) return; // 零有效行禁止确认
    setStep('applying');
    try{
      const batchId='up-'+Date.now();
      const res=await onApply(okRows, uploadMode, {fileName, coverageConfirmed, batchId});
      if(res && res.ok===false){ setApplyResult(res); setStep('validated'); return; }
      setApplyResult(res||{ok:true,applied:okRows.length,warnings:[]});
      setStep('done');
    }catch(err){ setApplyResult({ok:false,errors:[{line:0,col:'',value:'',msg:String(err&&err.message||err)}]}); setStep('validated'); }
  };
  const titles={sku:'单品周数据上传',channel:'渠道周数据上传',cost:'成本 / 供货价批量上传',price:'公域控价批量上传'};
  const title=titles[mode]||'批量上传';
  const infos={sku:'批量导入各 SKU 的进销存数据。必填字段：商品编码、周期、期初库存、入库数、销售数量、GMV、期末库存。',channel:'批量导入各渠道周度数据。支持矩阵格式（推荐）和纵向格式。',cost:'批量导入各 SKU 的成本与供货价。',price:'批量导入各 SKU 的公域控价。'};
  const info=infos[mode]||'';
  const bgColors={sku:'bg-blue-50',channel:'bg-purple-50',cost:'bg-emerald-50',price:'bg-amber-50'};
  const iconColors={sku:'text-blue-600',channel:'text-purple-600',cost:'text-emerald-600',price:'text-amber-600'};
  const bgColor=bgColors[mode]||'bg-slate-50';
  const iconColor=iconColors[mode]||'text-slate-600';
  const modeLabel={replace:'覆盖全部历史数据',upsert:'按业务主键更新（默认）',appendNew:'仅新增周期'};

  const downloadTemplate=()=>{
    const BOM='\uFEFF'; let csv='';
    if(mode==='sku'){csv='商品编码,周期,期初库存,入库数,销售数量,GMV,期末库存\n'; skuMaster.forEach(s=>{csv+=s.code+','+PERIODS[0].label+',100,0,50,6500,50\n';});}
    else if(mode==='channel'){csv='周期,商品编码,商品名称'; CHANNELS.forEach(ch=>{csv+=','+ch+'数量,'+ch+'金额';}); csv+='\n'; skuMaster.slice(0,3).forEach(s=>{csv+=PERIODS[0].label+','+s.code+','+s.name; CHANNELS.forEach(ch=>{csv+=',50,5000';}); csv+='\n';});}
    else if(mode==='cost'){csv='商品编码,商品名称,成本（元）,供货价（元）,生效日期\n'; skuMaster.forEach(s=>{csv+=s.code+','+s.name+','+Math.round(s.price*0.3)+','+Math.round(s.price*0.55)+',2026-06-15\n';});}
    else if(mode==='price'){csv='商品编码,商品名称,公域控价（元）,生效日期\n'; skuMaster.forEach(s=>{csv+=s.code+','+s.name+','+Math.round(s.price*0.92)+',2026-06-15\n';});}
    const blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='模板_'+title+'.csv'; a.click(); URL.revokeObjectURL(url);
  };
  const exportErrors=()=>{
    const errRows=parsed.filter(r=>r.status==='err');
    if(errRows.length===0) return;
    const BOM='\uFEFF'; let csv='';
    if(mode==='sku'){csv='行号,商品编码,周期,期初库存,入库数,销售数量,GMV,期末库存,错误原因\n'; errRows.forEach(r=>{csv+=[r.line||'',csvEscape(r.code||''),csvEscape(r.period||''),r.begin||0,r.inbound||0,r.sales||0,r.gmv||0,r.end||0,csvEscape(r.msg||'')].join(',')+'\n';});}
    else if(mode==='channel'){csv='行号,周期,渠道,销售额,销售量,错误原因\n'; errRows.forEach(r=>{csv+=[r.line||'',csvEscape(r.period||''),csvEscape(r.channel||''),r.gmv||0,r.vol||0,csvEscape(r.msg||'')].join(',')+'\n';});}
    else if(mode==='cost'){csv='行号,商品编码,商品名称,成本,供货价,生效日期,错误原因\n'; errRows.forEach(r=>{csv+=[r.line||'',csvEscape(r.code||''),csvEscape(r.name||''),r.c||0,r.sp||0,csvEscape(r.date||''),csvEscape(r.msg||'')].join(',')+'\n';});}
    else if(mode==='price'){csv='行号,商品编码,商品名称,公域控价,生效日期,错误原因\n'; errRows.forEach(r=>{csv+=[r.line||'',csvEscape(r.code||''),csvEscape(r.name||''),r.cp||0,csvEscape(r.date||''),csvEscape(r.msg||'')].join(',')+'\n';});}
    const blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='错误清单_'+title+'.csv'; a.click(); URL.revokeObjectURL(url);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-3xl my-auto">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100"><h3 className="font-bold flex items-center gap-2"><Upload className="w-5 h-5 text-indigo-600"/>{title}</h3><button onClick={close} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button></div>
        <div className="p-5 space-y-4">
          <div className={`flex items-start gap-3 rounded-lg p-3 ${bgColor}`}><Info className={`w-4 h-4 mt-0.5 shrink-0 ${iconColor}`}/><p className="text-xs text-slate-600 leading-relaxed">{info}<span className="font-medium text-slate-700"> 导入方式：{modeLabel[uploadMode]}。</span></p></div>
          {step==='idle' && (
            <div className="space-y-3">
              <button onClick={downloadTemplate} className="inline-flex items-center gap-2 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"><Download className="w-4 h-4"/>下载导入模板</button>
              <input type="file" ref={fileRef} accept=".csv,.xlsx,.xls" className="hidden" onChange={e=>{handleFile(e.target.files[0]);e.target.value='';}}/>
              <div onClick={handleSelect} onDrop={handleDrop} onDragOver={handleDragOver} className="flex w-full flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-slate-300 py-10 hover:border-indigo-400 hover:bg-indigo-50 transition-colors cursor-pointer"><div className="rounded-full bg-slate-100 p-2.5 text-slate-500"><Upload className="w-5 h-5"/></div><p className="text-sm font-medium text-slate-700">点击选择文件 或 拖拽至此</p><p className="text-xs text-slate-400">支持 .csv（UTF-8，含 BOM），单次最多 {CSV_MAX_ROWS} 行（按源数据行）</p></div>
            </div>
          )}
          {step==='validated' && (
            <div className="space-y-3">
              <div className="flex items-center justify-between rounded-lg bg-slate-50 px-3 py-2"><div className="flex items-center gap-2 text-sm text-slate-700"><FileSpreadsheet className="w-4 h-4 text-emerald-600"/>{fileName}</div><button onClick={reset} className="text-slate-400 hover:text-slate-600"><X className="w-4 h-4"/></button></div>
              {parseFatal && (
                <div className="rounded-lg border border-red-200 bg-red-50 px-3 py-2 space-y-1">
                  <p className="text-sm font-medium text-red-700 flex items-center gap-1"><AlertCircle className="w-4 h-4"/>文件未导入（解析失败）</p>
                  {parseFatal.slice(0,5).map((e,i)=>(<p key={i} className="text-xs text-red-600">{e.msg}</p>))}
                </div>
              )}
              {!parseFatal && (
              <>
              <div className="flex flex-wrap gap-2">
                <span className="inline-flex items-center gap-1 rounded-lg bg-slate-50 px-3 py-1.5 text-sm text-slate-700"><FileSpreadsheet className="w-4 h-4"/>共读取 <b>{parsed.length}</b> 行</span>
                <span className="inline-flex items-center gap-1 rounded-lg bg-emerald-50 px-3 py-1.5 text-sm text-emerald-700"><CheckCircle2 className="w-4 h-4"/>校验通过 <b>{okRows.length}</b> 行</span>
                <span className="inline-flex items-center gap-1 rounded-lg bg-red-50 px-3 py-1.5 text-sm text-red-600"><AlertCircle className="w-4 h-4"/>异常 <b>{errCount}</b> 行</span>
                {warnRows.length>0 && <span className="inline-flex items-center gap-1 rounded-lg bg-amber-50 px-3 py-1.5 text-sm text-amber-700"><AlertTriangle className="w-4 h-4"/>提示 <b>{warnRows.length}</b> 行</span>}
                {errCount>0 && <button onClick={exportErrors} className="inline-flex items-center gap-1 rounded-lg border border-red-200 px-3 py-1.5 text-sm text-red-600 hover:bg-red-50"><Download className="w-3.5 h-3.5"/>导出错误清单</button>}
              </div>
              {preview && preview.ok && (
                <div className="rounded-lg border border-indigo-100 bg-indigo-50/60 px-3 py-2 text-xs text-slate-600 space-y-1">
                  <p className="font-medium text-indigo-700">导入预览（{modeLabel[uploadMode]}）</p>
                  <p>覆盖周期：{preview.periodLabels.join('、')||'—'}{preview.newPeriodsCount>0?`（含 ${preview.newPeriodsCount} 个新增周期）`:''}{preview.skuCount?`；涉及 SKU ${preview.skuCount} 个`:''}{preview.channels&&preview.channels.length?`；渠道：${preview.channels.join('、')}`:''}</p>
                  <p>将写入 <b>{preview.applied}</b> 个数据单元{uploadMode==='upsert'?'（已存在的同主键数据将被覆盖更新，不会重复累加）':uploadMode==='replace'?'（本域全部历史将被替换）':'（仅新增周期，已存在周期将被拒绝）'}</p>
                  {preview.detailInvalidated && <p className="text-amber-700 font-medium">⚠ 本次为渠道汇总输入，替换后旧 SKU×渠道 明细将失效清除，活动 ROI 将按无明细口径提示</p>}
                  {(preview.warnings||[]).map((w,i)=>(<p key={i} className="text-amber-700">⚠ {w}</p>))}
                </div>
              )}
              {preview && !preview.ok && (
                <div className="rounded-lg border border-red-200 bg-red-50 px-3 py-2 space-y-1">
                  <p className="text-sm font-medium text-red-700">当前数据无法按「{modeLabel[uploadMode]}」导入：</p>
                  {(preview.errors||[]).slice(0,5).map((e,i)=>(<p key={i} className="text-xs text-red-600">{e.msg}{e.value?`（${e.value}）`:''}</p>))}
                </div>
              )}
              {applyResult && applyResult.ok===false && (
                <div className="rounded-lg border border-red-200 bg-red-50 px-3 py-2 space-y-1">
                  <p className="text-sm font-medium text-red-700">导入未提交（数据与周期未变）：</p>
                  {(applyResult.errors||[]).slice(0,5).map((e,i)=>(<p key={i} className="text-xs text-red-600">{e.msg}</p>))}
                </div>
              )}
              <div className="overflow-x-auto rounded-lg border border-slate-200 max-h-72 overflow-y-auto">
                <table className="w-full text-sm text-left">
                  <thead className="bg-slate-50 text-slate-500 sticky top-0"><tr>
                    <th className="px-3 py-2 font-medium">行号</th>
                    {mode==='sku' && (<><th className="px-3 py-2 font-medium">编码</th><th className="px-3 py-2 font-medium">周期</th><th className="px-3 py-2 font-medium text-right">期初</th><th className="px-3 py-2 font-medium text-right">入库</th><th className="px-3 py-2 font-medium text-right">销售</th><th className="px-3 py-2 font-medium text-right">GMV</th><th className="px-3 py-2 font-medium text-right">期末</th><th className="px-3 py-2 font-medium">校验</th></>)}
                    {mode==='channel' && (<><th className="px-3 py-2 font-medium">周期</th><th className="px-3 py-2 font-medium">商品编码</th><th className="px-3 py-2 font-medium">渠道</th><th className="px-3 py-2 font-medium text-right">销售额</th><th className="px-3 py-2 font-medium text-right">销售量</th><th className="px-3 py-2 font-medium">校验</th></>)}
                    {mode==='cost' && (<><th className="px-3 py-2 font-medium">编码</th><th className="px-3 py-2 font-medium">名称</th><th className="px-3 py-2 font-medium text-right">成本</th><th className="px-3 py-2 font-medium text-right">供货价</th><th className="px-3 py-2 font-medium">生效日期</th><th className="px-3 py-2 font-medium">校验</th></>)}
                    {mode==='price' && (<><th className="px-3 py-2 font-medium">编码</th><th className="px-3 py-2 font-medium">名称</th><th className="px-3 py-2 font-medium text-right">公域控价</th><th className="px-3 py-2 font-medium">生效日期</th><th className="px-3 py-2 font-medium">校验</th></>)}
                  </tr></thead>
                  <tbody>
                    {parsed.map((r,i)=>{
                      const isErr=r.status==='err';
                      const rowCls=`border-t border-slate-100 ${isErr?'bg-red-50':''}`;
                      const cellOk=<span className="inline-flex items-center gap-1 text-emerald-600"><CheckCircle2 className="w-3.5 h-3.5"/>通过</span>;
                      const cellErr=<span className="inline-flex items-center gap-1 text-red-600"><AlertCircle className="w-3.5 h-3.5"/>{r.msg}</span>;
                      const cellWarn=r.msg?<span className="inline-flex items-center gap-1 text-amber-600"><AlertTriangle className="w-3.5 h-3.5"/>{r.msg}</span>:cellOk;
                      const cell=isErr?cellErr:cellWarn;
                      return (
                        <tr key={i} className={rowCls}>
                          <td className="px-3 py-2 text-slate-400 tabular-nums">{r.line||'—'}</td>
                          {mode==='sku' && (<><td className="px-3 py-2 font-mono text-slate-600">{r.code}</td><td className="px-3 py-2 text-slate-500">{r.period}</td><td className="px-3 py-2 text-right tabular-nums">{r.begin}</td><td className="px-3 py-2 text-right tabular-nums">{r.inbound}</td><td className="px-3 py-2 text-right tabular-nums">{r.sales}</td><td className="px-3 py-2 text-right tabular-nums">¥{r.gmv}</td><td className="px-3 py-2 text-right tabular-nums">{r.end}</td><td className="px-3 py-2">{cell}</td></>)}
                          {mode==='channel' && (<><td className="px-3 py-2 text-slate-500">{r.period}</td><td className="px-3 py-2 font-mono text-slate-600">{r.code||'—'}</td><td className="px-3 py-2 text-slate-700">{r.channel}</td><td className="px-3 py-2 text-right tabular-nums">¥{r.gmv}</td><td className="px-3 py-2 text-right tabular-nums">{r.vol}</td><td className="px-3 py-2">{cell}</td></>)}
                          {mode==='cost' && (<><td className="px-3 py-2 font-mono text-slate-600">{r.code}</td><td className="px-3 py-2 text-slate-700">{r.name}</td><td className="px-3 py-2 text-right tabular-nums">¥{(r.c||0).toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums">¥{(r.sp||0).toFixed(2)}</td><td className="px-3 py-2 text-slate-500">{r.date||'—'}</td><td className="px-3 py-2">{cell}</td></>)}
                          {mode==='price' && (<><td className="px-3 py-2 font-mono text-slate-600">{r.code}</td><td className="px-3 py-2 text-slate-700">{r.name}</td><td className="px-3 py-2 text-right tabular-nums">¥{r.cp}</td><td className="px-3 py-2 text-slate-500">{r.date||'—'}</td><td className="px-3 py-2">{cell}</td></>)}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {isWeekly && (
                <label className="flex items-start gap-2 rounded-lg border border-slate-200 px-3 py-2 text-xs text-slate-600 cursor-pointer hover:bg-slate-50">
                  <input type="checkbox" checked={coverageConfirmed} onChange={e=>setCoverageConfirmed(e.target.checked)} className="mt-0.5"/>
                  <span>确认：本文件未包含的 SKU/渠道在所涉周期视为<b>零销量</b>，并将这些周期标记为「完整覆盖」（影响活动 Baseline 判定）。不勾选则覆盖状态保持「未知」，活动增量分析将提示 Baseline 不足。</span>
                </label>
              )}
              <div className="flex items-center gap-2 rounded-lg bg-slate-50 px-3 py-2 text-sm flex-wrap"><span className="text-slate-500">导入方式：</span>
                <button onClick={()=>setUploadMode('upsert')} className={`inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs font-medium ${uploadMode==='upsert'?'bg-indigo-100 text-indigo-700':'text-slate-600 hover:bg-slate-100'}`}>按业务主键更新（默认）</button>
                <button onClick={()=>setUploadMode('replace')} className={`inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs font-medium ${uploadMode==='replace'?'bg-indigo-100 text-indigo-700':'text-slate-600 hover:bg-slate-100'}`}>覆盖全部历史数据</button>
                <button onClick={()=>setUploadMode('appendNew')} className={`inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs font-medium ${uploadMode==='appendNew'?'bg-indigo-100 text-indigo-700':'text-slate-600 hover:bg-slate-100'}`}>仅新增周期</button>
              </div>
              <div className="flex justify-end gap-2"><button onClick={reset} className="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">取消</button><button onClick={confirm} disabled={okRows.length===0 || (preview && !preview.ok)} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed">确认导入 {okRows.length} 行</button></div>
              </>
              )}
              {parseFatal && (
                <div className="flex justify-end"><button onClick={reset} className="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">重新选择文件</button></div>
              )}
            </div>
          )}
          {step==='applying' && (
            <div className="flex flex-col items-center justify-center gap-2 py-8"><div className="w-8 h-8 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"/><p className="text-sm text-slate-500">正在原子提交导入…</p></div>
          )}
          {step==='done' && (
            <div className="flex flex-col items-center justify-center gap-2 py-8"><CheckCircle2 className="w-12 h-12 text-emerald-500"/><p className="text-lg font-semibold">导入成功</p><p className="text-sm text-slate-500">{`已${modeLabel[uploadMode]} ${applyResult&&applyResult.applied!=null?applyResult.applied:okRows.length} 个数据单元，跳过异常 ${errCount} 行`}</p>
              {(applyResult&&(applyResult.warnings||[]).length>0) && (<div className="max-w-md text-xs text-amber-700 space-y-1">{applyResult.warnings.map((w,i)=>(<p key={i}>⚠ {w}</p>))}</div>)}
              <p className="text-xs text-slate-400">如需回退，可点击顶栏「撤销导入」恢复导入前全部数据。</p>
              <button onClick={close} className="mt-2 rounded-lg bg-indigo-600 px-5 py-2 text-sm font-medium text-white hover:bg-indigo-700">完成</button></div>
          )}
        </div>
      </div>
    </div>
  );
}



function TotalTrendModal({data,mode,onClose}){

  const isGmv = mode==='gmv';

  const color = isGmv ? '#6366f1' : '#06b6d4';

  const label = isGmv ? '总体GMV趋势' : '总体件数趋势';

  const fmt = isGmv ? v=>'¥'+fmtMoney(v) : v=>fmtNum(v)+' 件';

  const dataKey = isGmv ? 'gmv' : 'sales';

  return (

    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto">

      <div className="bg-white rounded-2xl shadow-xl w-full max-w-3xl my-auto">

        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">

          <h3 className="font-bold flex items-center gap-2"><BarChart3 className="w-5 h-5 text-indigo-600"/>{label}</h3>

          <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>

        </div>

        <div className="p-5">

          <div className="h-80 w-full">

            <ResponsiveContainer>

              <AreaChart data={data} margin={{top:5,right:10,left:0,bottom:0}}>

                <defs>

                  <linearGradient id="gTotal" x1="0" y1="0" x2="0" y2="1">

                    <stop offset="0%" stopColor={color} stopOpacity={0.35}/>

                    <stop offset="100%" stopColor={color} stopOpacity={0}/>

                  </linearGradient>

                </defs>

                <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/>

                <XAxis dataKey="period" tick={{fontSize:12,fill:'#94a3b8'}}/>

                <YAxis tick={{fontSize:12,fill:'#94a3b8'}} tickFormatter={fmt}/>

                <Tooltip formatter={v=>fmt(v)}/>

                <Area dataKey={dataKey} stroke={color} strokeWidth={2} fill="url(#gTotal)"/>

              </AreaChart>

            </ResponsiveContainer>

          </div>

        </div>

      </div>

    </div>

  );

}





function ChannelView({channelWeekly,onUpload,isReadOnly}){

  const [metric,setMetric] = useState('g');

  const prefix = metric==='g'?'g_':'v_';

  const data = channelWeekly;



  const allChannels = useMemo(()=>{

    const chSet = new Set();

    data.forEach(row=>{

      Object.keys(row).forEach(k=>{

        if(k.startsWith('g_')) chSet.add(k.slice(2));

      });

    });

    return Array.from(chSet);

  },[data]);



  const [active,setActive] = useState([]);

  useEffect(()=>{

    if(allChannels.length>0 && active.length===0){

      setActive(allChannels.slice(0,6));

    }

  },[allChannels]);

  const toggle = ch => setActive(p=>p.includes(ch)?p.filter(x=>x!==ch):[...p,ch]);

  const chColor = ch => CH_COLOR[allChannels.indexOf(ch) % CH_COLOR.length];



  const last = data.length>0 ? data[data.length-1] : {};

  const lastLabel = last.label || '—';

  const rankRaw = allChannels.map(ch=>({name:ch,val:last[prefix+ch]||0})).filter(r=>r.val>0).sort((a,b)=>b.val-a.val);

  const weekTotal = rankRaw.reduce((sum,r)=>sum+r.val,0);

  const rank = rankRaw.slice(0,10).map(r=>({...r, pct: weekTotal>0 ? +((r.val/weekTotal)*100).toFixed(1) : 0}));

  const top10Total = rank.reduce((sum,r)=>sum+r.val,0);

  const top10Share = weekTotal>0 ? +(top10Total/weekTotal*100).toFixed(1) : 0;



  const histRaw = allChannels.map(ch=>{

    const total = data.reduce((sum,row)=>sum+(row[prefix+ch]||0),0);

    return {name:ch,val:total};

  }).filter(r=>r.val>0).sort((a,b)=>b.val-a.val);

  const histTotal = histRaw.reduce((sum,r)=>sum+r.val,0);

  const histRank = histRaw.slice(0,10).map(r=>({...r, pct: histTotal>0 ? +((r.val/histTotal)*100).toFixed(1) : 0}));

  const histTop10Total = histRank.reduce((sum,r)=>sum+r.val,0);

  const histTop10Share = histTotal>0 ? +(histTop10Total/histTotal*100).toFixed(1) : 0;



  const shareSeries = useMemo(()=> data.map(row=>{

    const total = allChannels.reduce((a,ch)=>a+(row['g_'+ch]||0),0);

    const o = { label:row.label };

    allChannels.forEach(ch=>{ o[ch] = total>0 ? +((row['g_'+ch]||0)/total*100).toFixed(2) : 0; });

    return o;

  }),[data,allChannels]);

  const lastShare = shareSeries.length>0 ? shareSeries[shareSeries.length-1] : {};

  const prevShare = shareSeries.length>1 ? shareSeries[shareSeries.length-2] : {};

  const shareDeltas = allChannels.map((ch)=>({

    name:ch, color:chColor(ch),

    cur:lastShare[ch]||0, delta:+((lastShare[ch]||0)-(prevShare[ch]||0)).toFixed(2),

  }));



  const cumData = useMemo(()=>{

    const acc = {};

    return data.map(row=>{

      const out = { label: row.label };

      allChannels.forEach(ch=>{

        const k = prefix+ch;

        acc[k] = (acc[k]||0) + (row[k]||0);

        out[k] = acc[k];

      });

      return out;

    });

  },[data,allChannels,prefix]);



  const cumShareSeries = useMemo(()=> cumData.map(row=>{

    const total = allChannels.reduce((a,ch)=>a+(row[prefix+ch]||0),0);

    const o = { label: row.label };

    allChannels.forEach(ch=>{ o[ch] = total>0 ? +((row[prefix+ch]||0)/total*100).toFixed(2) : 0; });

    return o;

  }),[cumData,allChannels,prefix]);



  return (

    <div className="space-y-5">

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-3 flex flex-wrap items-center gap-2">

        <span className="text-sm text-slate-500 mr-1">渠道</span>

        {allChannels.map((ch)=>{

          const on=active.includes(ch);

          return <button key={ch} onClick={()=>toggle(ch)} className="text-xs px-2.5 py-1 rounded-full border"

            style={{borderColor:on?chColor(ch):'#e2e8f0',background:on?chColor(ch):'#fff',color:on?'#fff':'#64748b'}}>{ch}</button>;

        })}

        <div className="flex-1"/>
        {!isReadOnly && (<button onClick={onUpload}
          className="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">
          <Upload className="w-3.5 h-3.5"/>上传渠道周数据
        </button>)}
        <div className="flex rounded-lg overflow-hidden border border-slate-200">

          {[['g','销售额'],['v','销售量']].map(([k,l])=>(

            <button key={k} onClick={()=>setMetric(k)} className={`text-sm px-4 py-1.5 font-medium ${metric===k?'bg-indigo-600 text-white':'bg-white text-slate-500'}`}>{l}</button>

          ))}

        </div>

      </div>



      <Card title={`各渠道周度${metric==='g'?'销售额':'销售量'}趋势`} subtitle={`已选 ${active.length} 个渠道 · 全 ${data.length} 周`}>

        <div className="h-80 w-full">

          <ResponsiveContainer>

            <LineChart data={data} margin={{top:5,right:10,left:0,bottom:0}}>

              <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/>

              <XAxis dataKey="label" tick={{fontSize:12,fill:'#94a3b8'}}/>

              <YAxis tick={{fontSize:12,fill:'#94a3b8'}} tickFormatter={v=>metric==='g'?(v/10000).toFixed(0)+'万':v}/>

              <Tooltip formatter={v=>metric==='g'?'¥'+fmtMoney(v):fmtNum(v)+' 件'}/>

              <Legend/>

              {active.map(ch=>{const i=allChannels.indexOf(ch);return (

                <Line key={ch} name={ch} dataKey={prefix+ch} stroke={CH_COLOR[i % CH_COLOR.length]} strokeWidth={2} dot={false}/>

              );})}

            </LineChart>

          </ResponsiveContainer>

        </div>

      </Card>



      <Card title="各渠道销售额占比变化（每周）" subtitle="以销售额(GMV)为基数 · 卡片数值=当周占比，pp=环比上周百分点变化 · 折线为占比趋势">

        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-4">

          {shareDeltas.filter(d=>active.includes(d.name)).map(d=>{

            const up=d.delta>=0;

            return (

              <div key={d.name} className="rounded-lg border border-slate-200 p-2.5">

                <div className="flex items-center gap-1.5">

                  <span className="inline-block w-2.5 h-2.5 rounded-full" style={{background:d.color}}/>

                  <span className="text-xs text-slate-500 truncate">{d.name}</span>

                </div>

                <div className="mt-1 text-lg font-bold tabular-nums">{d.cur}%</div>

                <div className={`text-xs flex items-center gap-0.5 ${up?'text-green-600':'text-red-500'}`}>

                  {up?<TrendingUp className="w-3 h-3"/>:<TrendingDown className="w-3 h-3"/>}

                  {up?'+':''}{d.delta} pp

                </div>

              </div>

            );

          })}

        </div>

        <div className="h-72 w-full">

          <ResponsiveContainer>

            <LineChart data={shareSeries} margin={{top:5,right:10,left:0,bottom:0}}>

              <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/>

              <XAxis dataKey="label" tick={{fontSize:12,fill:'#94a3b8'}}/>
