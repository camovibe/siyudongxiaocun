                    })}
                  </svg>
                </div>
                <div className="lg:w-72 shrink-0 bg-slate-50 rounded-lg border border-slate-200 p-3 text-xs space-y-1.5">
                  {hovered ? (
                    <>
                      <div className="font-semibold text-slate-800 text-sm flex items-center gap-1.5">{hovered.name}{hovered.brandLoss && <span className="text-red-500">⚠</span>}{hovered.observing && <span className="text-blue-500 font-normal">观察中</span>}</div>
                      <div className="flex justify-between"><span className="text-slate-500">Incremental ROI</span><span className="font-medium">{fmtROI(hovered.roi)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">Persistence</span><span className="font-medium">{safePct(hovered.persistence, 1)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">Activity GMV</span><span className="font-medium">{fmtSignedMoney(hovered.gmv)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">Incremental Sell-out</span><span className="font-medium">{fmtSignedMoney(hovered.incrementalSellout)}</span></div>
                      <div className="border-t border-slate-200 pt-1.5 flex justify-between"><span className="text-slate-500">品牌毛利</span><span className="font-medium">{fmtSignedMoney(hovered.brandGross)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">品牌净利</span><span className={`font-medium ${hovered.brandNet < 0 ? 'text-red-600' : ''}`}>{fmtSignedMoney(hovered.brandNet)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">品牌净利率</span><span className="font-medium">{safePct(hovered.brandNetMargin, 1)}</span></div>
                      <div className="border-t border-slate-200 pt-1.5 flex justify-between"><span className="text-slate-500">托盘商毛利</span><span className="font-medium">{fmtSignedMoney(hovered.distGross)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">托盘商净利</span><span className="font-medium">{fmtSignedMoney(hovered.distNet)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">托盘商净利率</span><span className="font-medium">{safePct(hovered.distNetMargin, 1)}</span></div>
                      <div className="border-t border-slate-200 pt-1.5 flex justify-between"><span className="text-slate-500">品牌增量毛利</span><span className="font-medium">{fmtSignedMoney(hovered.incBrandGross)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">品牌增量净利</span><span className="font-medium">{fmtSignedMoney(hovered.incBrandNet)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">托盘商增量净利</span><span className="font-medium">{fmtSignedMoney(hovered.incDistNet)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">增量净利润投入比</span><span className="font-medium">{hovered.profitInvestment === null || hovered.profitInvestment === undefined ? '—' : safePct(hovered.profitInvestment, 1)}</span></div>
                      <div className="border-t border-slate-200 pt-1.5 flex justify-between"><span className="text-slate-500">Risk Status</span><span className="font-medium" style={{color: hovered.brandLoss ? '#dc2626' : '#16a34a'}}>{hovered.economicRisk.map(r => RISK_META[r]?.label || r).join('、')}</span></div>
                      <div className="text-slate-400 pt-1">点击活动点可跳转到活动明细</div>
                    </>
                  ) : (
                    <div className="text-slate-400 py-8 text-center">悬停或点击活动点<br/>查看三方经营明细</div>
                  )}
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {activities.length > 0 && (
        <div className="flex flex-wrap gap-2">
          {activities.map(act => {
            const res = activityResultMap[act.id];
            const roi = res?.return?.incrementalSellOutROI;
            const roiStr = res?.status === 'baseline_insufficient' ? 'Baseline不足' : (res?.error ? '-' : (res?.evaluation?.provisional ? fmtROI(roi, 1) + '·暂' : fmtROI(roi, 1)));
            const grade = res?.error ? (res?.status === 'baseline_insufficient' ? '待评估' : '?') : (res?.evaluation?.grade || '?');
            const chipBrandLoss = (() => { const _np = toMetricNumber(res?.economics?.brand?.netProfit); return _np !== null && _np < 0; })();
            const skuCount = act.skuMode === 'all' ? skuMaster.length : (act.skuCodes || []).filter(c => skuMaster.some(s => s.code === c)).length;
            const chLabel = act.activityChannel && act.activityChannel !== 'ALL' ? act.activityChannel : (act.activityChannel === 'ALL' ? '全渠道' : '');

                <span className="text-xs text-slate-500">{roiStr}</span>

                {chipBrandLoss && <span className="text-xs px-1.5 py-0.5 rounded-full font-bold bg-red-50 text-red-600 border border-red-200" title="品牌净利为负 · 风险活动">⚠</span>}
                {!isReadOnly && (
                  <>
                <span onClick={(e) => { e.stopPropagation(); handleEdit(act); }} className="ml-1 text-slate-400 hover:text-indigo-500 cursor-pointer" title="编辑">✎</span>
                <span onClick={(e) => { e.stopPropagation(); handleDelete(act.id); }} className="text-slate-400 hover:text-red-500 cursor-pointer">×</span>
                  </>
                )}
              </button>
            );
          })}
        </div>
      )}

      {hasError && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-6 text-center text-amber-700">
          <AlertTriangle className="w-8 h-8 mx-auto mb-2"/>
          <p className="font-medium">{rawResult.error}</p>
          {rawResult.status === 'baseline_insufficient' && rawResult.activityGmvRatio !== null && rawResult.activityGmvRatio !== undefined && (
            <p className="text-sm mt-2 text-slate-600">活动GMV投入比（非增量ROI）：<span className="font-bold text-amber-700">{Number(rawResult.activityGmvRatio).toFixed(2)}x</span></p>
          )}
          {rawResult.baselineInfo && (
            <p className="text-xs mt-1 text-amber-500">Baseline 配置 {rawResult.baselineInfo.configured} 周，实际可用 {rawResult.baselineInfo.actual} 周</p>
          )}
          {diagnosis && diagnosis.activityChannel && diagnosis.activityChannel !== 'ALL（全渠道兼容）' && (
            <p className="text-sm mt-1 text-amber-600">请先确认该平台的 SKU×周度数据已上传至「渠道分析」tab</p>
          )}
        </div>
      )}

      {/* Baseline 不足时的降级展示（规则二十二）：仅展示活动窗口实际经营结果，增量指标一律 —，不以 GMV/投入 冒充增量ROI */}
      {hasError && rawResult?.status === 'baseline_insufficient' && rawResult?.economics && (() => { const E = rawResult.economics; return (
        <div className="bg-white rounded-xl border border-amber-200 shadow-sm overflow-hidden">
          <div className="px-4 py-3 border-b border-amber-100 bg-amber-50/50">
            <h3 className="font-semibold text-slate-700">Activity Window 实际经营结果（Baseline 不足 · 增量指标不可用）</h3>
            <p className="text-xs text-slate-400 mt-0.5">Incremental ROI = — · Grade = — · 增量利润 = —（Baseline 需 ≥2 个有效周）</p>
          </div>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 p-4 text-sm">
            <div className="bg-slate-50 rounded-lg p-3"><div className="text-xs text-slate-500">Activity GMV</div><div className="text-lg font-bold text-slate-800 mt-0.5">{fmtSignedMoney(E.terminal.gmv)}</div></div>
            <div className="bg-slate-50 rounded-lg p-3"><div className="text-xs text-slate-500">Activity Sales</div><div className="text-lg font-bold text-slate-800 mt-0.5">{fmtNum(E.terminal.sales)} 件</div></div>
            <div className="bg-slate-50 rounded-lg p-3"><div className="text-xs text-slate-500">托盘商毛利 / 净利</div><div className="text-lg font-bold text-slate-800 mt-0.5">{fmtSignedMoney(E.distributor.grossProfit)} / {fmtSignedMoney(E.distributor.netProfit)}</div></div>
            <div className="bg-slate-50 rounded-lg p-3"><div className="text-xs text-slate-500">品牌毛利 / 净利</div><div className={`text-lg font-bold mt-0.5 ${E.brand.netProfit < 0 ? 'text-red-600' : 'text-slate-800'}`}>{fmtSignedMoney(E.brand.grossProfit)} / {fmtSignedMoney(E.brand.netProfit)}</div></div>
          </div>
          <div className="px-4 pb-4 text-xs text-slate-500">
            品牌投入 ¥{fmtMoney(E.investment.brandInvestment)} · 消费者端补贴 ¥{fmtMoney(E.investment.consumerPriceSubsidy)} · 托盘商返利 ¥{fmtMoney(E.investment.distributorRebate)}
            {E.brand.netProfit < 0 && <span className="ml-2 font-bold text-red-600">⚠ 品牌净利为负 · 风险活动</span>}
          </div>
        </div>
      ); })()}

      {result && selectedActivity && (
        <div className="space-y-4">
          <div className="bg-slate-50 rounded-lg border border-slate-200 p-3 text-sm">
            <div className="flex flex-wrap gap-x-4 gap-y-1">
              <span><span className="text-slate-500">活动平台：</span><span className="font-medium">{selectedActivity.activityChannel && selectedActivity.activityChannel !== 'ALL' ? selectedActivity.activityChannel : '全渠道兼容'}</span></span>
              <span><span className="text-slate-500">参与 SKU：</span><span className="font-medium">{selectedActivity.skuMode === 'all' ? skuMaster.length + '个（全部）' : ((selectedActivity.skuCodes || []).filter(c => skuMaster.some(s => s.code === c)).length + '个')}</span></span>

          {result.economics && (() => { const E = result.economics; const qm = result.quality ? QUALITY_META[result.quality] : null; return (
          <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">

/* ---------------- v3.7（规则七）：数据质量卡（点击摘要展开明细；只报告不改数据） ---------------- */
function DataQualityCard({ skuMaster, skuWeeks, channelWeekly, channelSkuWeekly, cost, supply, ctrl, dataCoverage, qualityIgnores, setQualityIgnores, isReadOnly }){
  const [open, setOpen] = useState(null);
  const [showIgnored, setShowIgnored] = useState(false);
  const ignores = Array.isArray(qualityIgnores) ? qualityIgnores : [];
  const ignoredSet = useMemo(() => new Set(ignores), [ignores]);
  const report = useMemo(() => computeQualityReport({ skuMaster, skuWeeks, channelWeekly, channelSkuWeekly, cost, supply, ctrl, dataCoverage, periods: PERIODS }),
    [skuMaster, skuWeeks, channelWeekly, channelSkuWeekly, cost, supply, ctrl, dataCoverage]);
  const kindKey = (kind) => kind + '|*';
  const itemKey = (kind, d) => kind + '|' + d;
  // 可见性过滤：整类忽略 > 单项忽略；计数同步扣减
  const visibleIssues = report.issues
    .filter(it => !ignoredSet.has(kindKey(it.kind)))
    .map(it => {
      const vis = (it.detail || []).filter(d => !ignoredSet.has(itemKey(it.kind, d)));
      return { ...it, visibleDetail: vis, visibleCount: Math.max(0, it.count - ((it.detail || []).length - vis.length)) };
    })
    .filter(it => it.visibleCount > 0 || (it.detail || []).length === 0);
  const errs = visibleIssues.filter(i => i.sev === 'high').reduce((t, i) => t + i.visibleCount, 0);
  const warns = visibleIssues.filter(i => i.sev !== 'high' && i.sev !== 'info').reduce((t, i) => t + i.visibleCount, 0);
  const tint = errs > 0 ? 'rose' : warns > 0 ? 'amber' : 'emerald';
  const chipCls = { rose: 'bg-rose-100 text-rose-700', amber: 'bg-amber-100 text-amber-700', emerald: 'bg-emerald-100 text-emerald-700', slate: 'bg-slate-100 text-slate-500' };
  const addIgnore = (key) => { if (setQualityIgnores) setQualityIgnores(prev => [...new Set([...(prev || []), key])]); };
  const removeIgnore = (key) => { if (setQualityIgnores) setQualityIgnores(prev => (prev || []).filter(k => k !== key)); };
  const openIssue = visibleIssues.find(i => i.kind === open);
  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm px-4 py-3">
      <div className="flex flex-wrap items-center gap-2">
        <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${chipCls[tint]}`}>
          数据质量：{errs > 0 ? errs + ' 项需处理' : warns > 0 ? warns + ' 项提示' : '全部通过'}
        </span>
        {visibleIssues.map(it => (
          <button key={it.kind} onClick={() => setOpen(open === it.kind ? null : it.kind)}
            className={`text-xs px-2 py-0.5 rounded-full font-medium transition-colors ${open === it.kind ? 'bg-indigo-600 text-white' : chipCls[it.sev === 'high' ? 'rose' : it.sev === 'info' ? 'slate' : 'amber']}`}>
            {it.title}（{it.visibleCount}）
          </button>
        ))}
        {ignores.length > 0 && (
          <button onClick={() => setShowIgnored(!showIgnored)}
            className={`text-xs px-2 py-0.5 rounded-full font-medium transition-colors ${showIgnored ? 'bg-slate-600 text-white' : chipCls.slate}`}>
            已忽略（{ignores.length}）
          </button>
        )}
      </div>
      {openIssue && (
        <div className="mt-2 rounded-lg bg-slate-50 border border-slate-100 px-3 py-2 max-h-56 overflow-y-auto">
          {!isReadOnly && (
            <div className="flex justify-end mb-1">
              <button onClick={() => { addIgnore(kindKey(openIssue.kind)); setOpen(null); }}
                className="text-xs text-slate-400 hover:text-slate-600 underline">忽略整类「{openIssue.title}」</button>
            </div>
          )}
          {openIssue.visibleDetail.map((d, i) => (
            <div key={i} className="flex items-start justify-between gap-2">
              <p className="text-xs text-slate-600 leading-relaxed flex-1">{d}</p>
              {!isReadOnly && (
                <button onClick={() => addIgnore(itemKey(openIssue.kind, d))}
                  className="shrink-0 text-xs text-slate-300 hover:text-slate-500">忽略</button>
              )}
            </div>
          ))}
        </div>
      )}
      {showIgnored && (
        <div className="mt-2 rounded-lg bg-slate-50 border border-slate-100 px-3 py-2 max-h-56 overflow-y-auto">
          <p className="text-xs text-slate-400 mb-1">已忽略的项不再计入上方提示，随数据同步给只读版；点击「恢复」重新计入。</p>
          {ignores.map((k, i) => (
            <div key={i} className="flex items-start justify-between gap-2">
              <p className="text-xs text-slate-500 leading-relaxed flex-1">{k.endsWith('|*') ? '【整类】' + k.slice(0, -2) : k.split('|').slice(1).join('|')}</p>
              {!isReadOnly && (
                <button onClick={() => removeIgnore(k)} className="shrink-0 text-xs text-indigo-400 hover:text-indigo-600">恢复</button>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function SkuManagerInner({skuMaster,onSave,onClose}){
  const [rows,setRows]=useState(()=>skuMaster.map(s=>({code:s.code,name:s.name,cat:s.cat,status:'ok',msg:''})));
  const [err,setErr]=useState('');
  const [csvInfo,setCsvInfo]=useState(null);
  const fileRef=useRef(null);

  const detectDelimiter=(text)=>{
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length===0)return ',';
    const delimiters=[',',';','\t'];
    let best=',';let max=0;
    for(const d of delimiters){
      const re=new RegExp(d==='\t'?'\\t':d.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
      const cnt=(lines[0].match(re)||[]).length;
      if(cnt>max){max=cnt;best=d;}
    }
    return best;
  };

  const parseCSV=(text)=>{
    text=text.replace(/^\uFEFF/,'');
    const delimiter=detectDelimiter(text);
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length===0)return [];
    const first=lines[0];
    const hasHeader=first.includes('编码')||first.includes('code')||first.includes('商品')||first.includes('名称');
    const startIdx=hasHeader?1:0;
    const out=[];
    for(let i=startIdx;i<lines.length;i++){
      const line=lines[i].trim(); if(!line)continue;
      const cols=[];let cur='';let inQuote=false;
      for(let j=0;j<line.length;j++){
        const ch=line[j];
        if(ch==='"'){inQuote=!inQuote;}
        else if(ch===delimiter&&!inQuote){cols.push(cur.trim());cur='';}
        else{cur+=ch;}
      }
      cols.push(cur.trim());
      out.push(cols);
    }
    return out;
  };

  const validateCsvRow=(cols)=>{
    const [code,name,cat]=cols;
    if(!code||!code.trim())return{code:'',name:'',cat:'',status:'err',msg:'编码不能为空'};
    if(!name||!name.trim())return{code:code.trim(),name:'',cat:'',status:'err',msg:'名称不能为空'};
    if(!CATS.find(c=>c.key===cat))return{code:code.trim(),name:name.trim(),cat,status:'err',msg:'品类不存在：'+cat};
    return{code:code.trim(),name:name.trim(),cat,status:'ok',msg:''};
  };

  const applyCsvRows=(validated)=>{
    const okRows=validated.filter(r=>r.status==='ok');
    const errRows=validated.filter(r=>r.status==='err');
    setRows(p=>{
      let updated=[...p];
      okRows.forEach(r=>{
        const idx=updated.findIndex(x=>x.code===r.code);
        if(idx>=0){updated[idx]={...r,status:'ok',msg:''};}
        else{updated.push({...r,status:'ok',msg:''});}
      });
      errRows.forEach(r=>{
        updated.push({...r});
      });
      return updated;
    });
    setCsvInfo({total:validated.length,ok:okRows.length,err:errRows.length});
  };

  const handleFile=(file)=>{
    if(!file)return;
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext!=='csv'){setErr('仅支持 .csv 格式');return;}
    setErr('');
    setCsvInfo(null);
    const reader=new FileReader();
    reader.onload=(e)=>{
      const buf=new Uint8Array(e.target.result);
      let text;
      try{
        text=new TextDecoder('utf-8',{fatal:true}).decode(buf);
      }catch(err){
        try{
          text=new TextDecoder('gbk').decode(buf);
        }catch(err2){
          setErr('文件编码无法识别（请用记事本打开→另存为→UTF-8）');
          return;
        }
      }
      const raw=parseCSV(text);
      if(raw.length===0){
        setErr('CSV 内容为空，请检查文件');
        return;
      }
      const validated=raw.map(cols=>validateCsvRow(cols));
      applyCsvRows(validated);
    };
    reader.onerror=()=>{setErr('文件读取失败');};
    reader.readAsArrayBuffer(file);
  };
  const handleDrop=(e)=>{e.preventDefault();const files=e.dataTransfer.files;if(files.length>0)handleFile(files[0]);};
  const handleDragOver=(e)=>{e.preventDefault();};
  const handleSelect=()=>{if(fileRef.current)fileRef.current.click();};

  const downloadTemplate=()=>{
    const BOM='\uFEFF';
    let csv='商品编码,名称,品类\n';
    skuMaster.forEach(s=>{csv+=s.code+','+s.name+','+s.cat+'\n';});
    const blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='模板_SKU维护.csv';a.click();URL.revokeObjectURL(url);
  };

  const moveRow = (i, dir) => {
    if ((dir === -1 && i === 0) || (dir === 1 && i === rows.length - 1)) return;
    const newRows = [...rows];
    [newRows[i], newRows[i + dir]] = [newRows[i + dir], newRows[i]];
    setRows(newRows);
  };
  const addRow=()=>{
    setRows(p=>[...p,{code:'',name:'',cat:CATS[0].key,status:'ok',msg:''}]);
  };
  const removeRow=(i)=>{setRows(p=>p.filter((_,idx)=>idx!==i));};
  const updateRow=(i,k,v)=>{setRows(p=>{const n=[...p];n[i]={...n[i],[k]:v,status:'ok',msg:''};return n;});};
  const validate=()=>{
    const codes=new Set();
    for(const r of rows){
      if(r.status==='err')return '请先修正表格中标红的异常行';
      if(!r.code.trim())return '编码不能为空';
      if(codes.has(r.code.trim()))return '编码重复：'+r.code;
      codes.add(r.code.trim());
      if(!r.name.trim())return '名称不能为空';
      if(!CATS.find(c=>c.key===r.cat))return '品类不存在：'+r.cat;
    }
    return '';
  };
  const submit=()=>{
    const msg=validate();
    if(msg){setErr(msg);return;}
    setErr('');
    /* 说明：新增/修改 SKU 会保留原 SKU 的 price/demand/profile，
       仅在新增时以默认值兜底。 */
    onSave(rows.map((r, i) => {
      const old = skuMaster.find(s=>s.code===r.code.trim());
      return {
        code:r.code.trim(), name:r.name.trim(), cat:r.cat,
        price: old?.price ?? 100,
        demand: old?.demand ?? 200,
        profile: old?.profile ?? 'healthy',
        sortOrder: i,
      };
    }));
    onClose();
  };
  return (
    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl my-auto">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <h3 className="font-bold flex items-center gap-2"><Boxes className="w-5 h-5 text-indigo-600"/>SKU 维护</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
        </div>
        <div className="p-5 space-y-4">
          <p className="text-xs text-slate-500">当前共 {rows.length} 个 SKU。添加、删除或修改后点击保存，看板数据将自动重新生成。</p>
          {err && <p className="text-xs text-red-500 bg-red-50 rounded-lg px-3 py-2">{err}</p>}
          {csvInfo && (
            <div className="flex items-center gap-2 rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-700">
              <CheckCircle2 className="w-4 h-4"/>
              CSV 解析完成：覆盖/新增 {csvInfo.ok} 行，异常 {csvInfo.err} 行。
              <button onClick={()=>setCsvInfo(null)} className="text-emerald-800 underline text-xs ml-2">清除</button>
            </div>
          )}
          <div className="flex items-center gap-2">
            <button onClick={downloadTemplate} className="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
              <Download className="w-3.5 h-3.5"/>下载导入模板
            </button>
            <input type="file" ref={fileRef} accept=".csv" className="hidden" onChange={e=>{handleFile(e.target.files[0]);e.target.value='';}}/>
            <button onClick={handleSelect} className="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
              <Upload className="w-3.5 h-3.5"/>上传 CSV
            </button>
          </div>
          <div onDrop={handleDrop} onDragOver={handleDragOver}
            className="flex flex-col items-center justify-center gap-1 rounded-lg border-2 border-dashed border-slate-300 py-6 hover:border-indigo-400 hover:bg-indigo-50 transition-colors cursor-pointer"
            onClick={handleSelect}>
            <p className="text-xs text-slate-500">或拖拽 CSV 文件到此处</p>
          </div>
          <div className="overflow-x-auto rounded-lg border border-slate-200">
            <table className="w-full text-sm text-left">
              <thead className="bg-slate-50 text-slate-500">
                <tr>
                  <th className="px-3 py-2 font-medium">编码</th>
                  <th className="px-3 py-2 font-medium">名称</th>
                  <th className="px-3 py-2 font-medium">品类</th>
                  <th className="px-3 py-2 font-medium">校验</th>
                  <th className="px-3 py-2 font-medium"></th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i)=>{
                  const isErr = r.status==='err';
                  const isNew = !skuMaster.find(s=>s.code===r.code);
                  const rowCls = `border-t border-slate-100 ${isErr?'bg-red-50':isNew?'bg-blue-50':''}`;
                  return (
                    <tr key={i} className={rowCls}>
                      <td className="px-3 py-2"><input value={r.code} onChange={e=>updateRow(i,'code',e.target.value)} className="w-24 border border-slate-200 rounded px-2 py-1 text-sm font-mono"/></td>
                      <td className="px-3 py-2"><input value={r.name} onChange={e=>updateRow(i,'name',e.target.value)} className="w-48 border border-slate-200 rounded px-2 py-1 text-sm"/></td>
                      <td className="px-3 py-2">
                        <select value={r.cat} onChange={e=>updateRow(i,'cat',e.target.value)} className="border border-slate-200 rounded px-2 py-1 text-sm">
                          {CATS.map(c=><option key={c.key} value={c.key}>{c.key}</option>)}
                        </select>
                      </td>
                      <td className="px-3 py-2">
                        {isErr
                          ? <span className="inline-flex items-center gap-1 text-red-600 text-xs"><AlertCircle className="w-3.5 h-3.5"/>{r.msg}</span>
                          : <span className="inline-flex items-center gap-1 text-emerald-600 text-xs"><CheckCircle2 className="w-3.5 h-3.5"/>通过</span>
                        }
                      </td>
                      <td className="px-3 py-2">
                        <div className="flex items-center gap-1.5">
                          <button onClick={()=>moveRow(i,-1)} disabled={i===0} className={`text-xs px-1.5 py-0.5 rounded border ${i===0?'text-slate-300 border-slate-100':'text-slate-500 border-slate-200 hover:bg-slate-100'}`}>↑</button>
                          <button onClick={()=>moveRow(i,1)} disabled={i===rows.length-1} className={`text-xs px-1.5 py-0.5 rounded border ${i===rows.length-1?'text-slate-300 border-slate-100':'text-slate-500 border-slate-200 hover:bg-slate-100'}`}>↓</button>
                          <button onClick={()=>removeRow(i)} className="text-red-400 hover:text-red-600 text-xs ml-1">删除</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <button onClick={addRow} className="inline-flex items-center gap-1 rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
            + 添加 SKU
          </button>
          <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
            <button onClick={onClose} className="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">取消</button>
            <button onClick={submit} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">保存并重新生成数据</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PasswordSetting({current,onSave,onClose}){

  return <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto"><div className="bg-white rounded-2xl shadow-xl w-full max-w-sm my-auto"><div className="flex items-center justify-between px-5 py-4 border-b border-slate-100"><h3 className="font-bold flex items-center gap-2"><Settings className="w-5 h-5 text-indigo-600"/>设置防误操作密码</h3><button onClick={onClose} className="..."><X className="w-5 h-5"/></button></div><div className="p-5 space-y-4"><div className="rounded-lg bg-slate-50 border border-slate-200 px-3 py-2 text-xs text-slate-500">说明：此密码仅用于本机防误操作（防止误触利润/控价/活动页），不是安全访问控制；任何能打开本文件的人都可读取其中全部数据。如需对外分享，请使用只读版链接。</div><div className="space-y-2"><label className="text-sm text-slate-600">新密码</label><input type="password" value={val} onChange={e=>{setVal(e.target.value);setErr('');}} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div><div className="space-y-2"><label className="text-sm text-slate-600">确认密码</label><input type="password" value={confirm} onChange={e=>{setConfirm(e.target.value);setErr('');}} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>{err&&<p className="text-xs text-red-500">{err}</p>}<div className="flex justify-end gap-2"><button onClick={onClose} className="...">取消</button><button onClick={submit} className="...">保存</button></div></div></div></div>;

function GistSyncModal({data,onLoad,onClose}){

  const [token,setToken]=useState('');

  const [gistId,setGistId]=useState(()=>{const saved=safeStorage.getItem('zhaofeng_gist_id'); return saved||DEFAULT_GIST_ID;});

  const [status,setStatus]=useState('');

  const [loading,setLoading]=useState(false);

  // 推送阶段提示（双写链路在慢网络下需 2-4 分钟，避免误以为卡死）
  const [stage,setStage]=useState('');

  // 带超时的 fetch：任何一步网络 Stall 都在 240s 后报错退出，而不是无限「推送中」
  const fetchT=(url,opts={},ms=240000)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(t));};

  useEffect(()=>{if(window.location.protocol!=='file:'){const saved=safeStorage.getItem('zhaofeng_gist_id'); if(saved) setGistId(saved);}},[]);

  const showMsg=(msg)=>{setStatus(msg);setTimeout(()=>setStatus(''),10000);};

  // 把 data.json 推到 Pages 仓库（在线只读版的同源主数据源）。
  // 注意：文件约 3MB，超过 Contents API 的 1MB 上限，必须走 Git Data API（blob→tree→commit→ref）。
  const pushDataJsonToRepo=async(content,tk)=>{
    const h={'Authorization':`token ${tk}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
    const repo='camovibe/siyudongxiaocun';
    const api='https://api.github.com/repos/'+repo;
    const repoInfo=await (await fetchT(api,{headers:h})).json();
    const branch=repoInfo.default_branch||'main';
    const b64=btoa(unescape(encodeURIComponent(content)));
    const blob=await (await fetchT(api+'/git/blobs',{method:'POST',headers:h,body:JSON.stringify({content:b64,encoding:'base64'})})).json();
    if(!blob.sha) throw new Error(blob.message||'创建 blob 失败');
    const ref=await (await fetchT(api+`/git/refs/heads/${branch}`,{headers:h})).json();
    if(!ref.object?.sha) throw new Error(ref.message||'读取分支失败');
    const baseCommit=await (await fetchT(api+`/git/commits/${ref.object.sha}`,{headers:h})).json();
    const tree=await (await fetchT(api+'/git/trees',{method:'POST',headers:h,body:JSON.stringify({base_tree:baseCommit.tree.sha,tree:[{path:'data.json',mode:'100644',type:'blob',sha:blob.sha}]})})).json();
    if(!tree.sha) throw new Error(tree.message||'创建 tree 失败');
    const commit=await (await fetchT(api+'/git/commits',{method:'POST',headers:h,body:JSON.stringify({message:'data: 兆丰罗盘数据同步（本地可编辑版推送双写）',tree:tree.sha,parents:[ref.object.sha]})})).json();
    if(!commit.sha) throw new Error(commit.message||'创建 commit 失败');
    const up=await fetchT(api+`/git/refs/heads/${branch}`,{method:'PATCH',headers:h,body:JSON.stringify({sha:commit.sha})});
    if(!up.ok){const uj=await up.json().catch(()=>({}));throw new Error(uj.message||`HTTP ${up.status}`);}
  };

  const push=async()=>{if(!token){showMsg('请输入 GitHub PAT Token');return;} setLoading(true); setStage('· 0/2 检查远端版本…');
      // v3.7（规则九）：推送前查远端 revision——远端比本地新时提示确认，不静默覆盖（前端无法做原子并发锁，以提示为准）
      if(gistId){ try{ const metaRes=await fetchT(`https://api.github.com/gists/${gistId}`,{headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}}); if(metaRes.ok){ const meta=await metaRes.json(); const remoteAt=meta.history&&meta.history[0]?new Date(meta.history[0].committed_at).getTime():0; const localAt=data&&data.exportedAt||0; const lastPush=Number(safeStorage.getItem('zhaofeng_last_push_at')||0); if(remoteAt>Math.max(localAt,lastPush)+5000){ const go=window.confirm('远端 Gist 的最近更新（'+new Date(remoteAt).toLocaleString('zh-CN')+'）晚于本地数据。继续推送将覆盖远端更新，确认继续？'); if(!go){ setLoading(false); setStage(''); return; } } } }catch(_e){} }
      setStage('· 1/2 推送 Gist（约 3MB）…'); try{const content=JSON.stringify(data,null,2); const body={description:'兆丰渠道周转数据',public:false,files:{'data.json':{content}}}; const url=gistId?`https://api.github.com/gists/${gistId}`:'https://api.github.com/gists'; const method=gistId?'PATCH':'POST'; const res=await fetchT(url,{method,headers:{'Authorization':`token ${token}`,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify(body)}); const json=await res.json(); if(!res.ok)throw new Error(json.message||`HTTP ${res.status}`); const newId=json.id; if(newId){setGistId(newId); safeStorage.setItem('zhaofeng_gist_id',newId);} safeStorage.setItem('zhaofeng_last_push_at', String(Date.now())); setStage('· 2/2 双写在线数据文件（约 4MB，慢网需 1-2 分钟）…'); let pagesMsg=''; try{await pushDataJsonToRepo(content,token); pagesMsg='；✅ 在线数据文件已同步（只读版约 1 分钟后可见）';}catch(e2){pagesMsg=`；⚠️ 在线数据文件同步失败（${e2.message}），只读版将显示上一次的数据，请确认 Token 已勾选 repo 权限后重推`;} showMsg((gistId?'✅ Gist 更新成功':`✅ Gist 创建成功，ID: ${newId}`)+pagesMsg);}catch(e){showMsg('❌ 失败: '+(e.name==='AbortError'?'网络超时（240s），请检查网络后重试':e.message));}finally{setLoading(false); setStage('');}};

  const pull=async()=>{if(!gistId){showMsg('请输入 Gist ID');return;} setLoading(true); try{const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:token?{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}:{}}); const json=await res.json(); if(!res.ok)throw new Error(json.message||`HTTP ${res.status}`); const file=json.files?.['data.json']; if(!file)throw new Error('Gist 中未找到 data.json'); let content=file.content; if(file.truncated||!content){const rawRes=await fetchT(file.raw_url+`?t=${Date.now()}`,{},240000); if(!rawRes.ok)throw new Error(`raw 下载失败 HTTP ${rawRes.status}`); content=await rawRes.text();} let parsed; try{parsed=JSON.parse(content);}catch(pe){throw new Error('数据下载不完整（网络中断），请重试');} onLoad(parsed); safeStorage.setItem('zhaofeng_gist_id',gistId); showMsg('✅ 拉取成功，数据已更新');}catch(e){showMsg('❌ 失败: '+(e.name==='AbortError'?'网络超时（240s），请检查网络后重试':e.message));}finally{setLoading(false);}};

  return <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto"><div className="bg-white rounded-2xl shadow-xl w-full max-w-md my-auto"><div className="flex items-center justify-between px-5 py-4 border-b border-slate-100"><h3 className="font-bold flex items-center gap-2"><Upload className="w-5 h-5 text-indigo-600"/>Gist 同步</h3><button onClick={onClose} className="..."><X className="w-5 h-5"/></button></div><div className="p-5 space-y-4"><div className="rounded-lg bg-amber-50 border border-amber-200 px-3 py-2 text-xs text-amber-700"><p className="font-semibold">首次使用流程：</p><ol className="list-decimal list-inside mt-1 space-y-0.5"><li>生成 Token，勾选 gist + repo 权限（repo 用于在线数据文件双写）</li><li>输入 Token 点击「推送」→ 自动生成 secret Gist</li><li>记录 Gist ID，填入 HTML 中 GIST_ID 常量</li></ol></div><div className="space-y-2"><label className="text-sm text-slate-600">GitHub PAT Token</label><input type="password" value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono"/></div><div className="space-y-2"><label className="text-sm text-slate-600">Gist ID</label><input type="text" value={gistId} onChange={e=>setGistId(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono"/></div>{status&&<p className="text-xs px-3 py-2 rounded-lg bg-slate-50 text-slate-700">{status}</p>}<div className="flex justify-end gap-2"><button onClick={onClose} className="...">关闭</button><button onClick={pull} disabled={loading} className="...">拉取</button><button onClick={push} disabled={loading} className="...">{loading?('推送中 '+stage):'推送'}</button></div></div></div></div>;

}



const root = createRoot(document.getElementById('root'));

root.render(<ErrorBoundary><Dashboard/></ErrorBoundary>);

</script>
