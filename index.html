etR')} className="px-3 py-2 text-right font-medium cursor-pointer select-none">累积净利率</th></tr><tr className="bg-amber-50/50"><th className="px-2 py-1"><input id="flt_name" value={flt.name||''} onChange={e=>setFlt(p=>({...p,name:e.target.value}))} className="flt" readOnly placeholder="筛选商品"/></th><th className="px-2 py-1"><input id="flt_endStock" value={flt.endStock||''} onChange={e=>setFlt(p=>({...p,endStock:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_stockSalesRatio" value={flt.stockSalesRatio||''} onChange={e=>setFlt(p=>({...p,stockSalesRatio:e.target.value}))} className="flt" readOnly placeholder="1-3"/></th><th className="px-2 py-1"><input id="flt_sp" value={flt.sp||''} onChange={e=>setFlt(p=>({...p,sp:e.target.value}))} className="flt" readOnly placeholder=">50"/></th><th className="px-2 py-1"><input id="flt_actualPrice" value={flt.actualPrice||''} onChange={e=>setFlt(p=>({...p,actualPrice:e.target.value}))} className="flt" readOnly placeholder=">100"/></th><th className="px-2 py-1"><input id="flt_dUnit" value={flt.dUnit||''} onChange={e=>setFlt(p=>({...p,dUnit:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_dMargin" value={flt.dMargin||''} onChange={e=>setFlt(p=>({...p,dMargin:e.target.value}))} className="flt" readOnly placeholder=">15%"/></th><th className="px-2 py-1"><input id="flt_dNetUnit" value={flt.dNetUnit||''} onChange={e=>setFlt(p=>({...p,dNetUnit:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_dNetMargin" value={flt.dNetMargin||''} onChange={e=>setFlt(p=>({...p,dNetMargin:e.target.value}))} className="flt" readOnly placeholder=">0%"/></th><th className="px-2 py-1"><input id="flt_bePrice" value={flt.bePrice||''} onChange={e=>setFlt(p=>({...p,bePrice:e.target.value}))} className="flt" readOnly placeholder="<200"/></th><th className="px-2 py-1"><input id="flt_supplyRoom" value={flt.supplyRoom||''} onChange={e=>setFlt(p=>({...p,supplyRoom:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_wkSales" value={flt.wkSales||''} onChange={e=>setFlt(p=>({...p,wkSales:e.target.value}))} className="flt" readOnly placeholder=">10"/></th><th className="px-2 py-1"><input id="flt_dProfit" value={flt.dProfit||''} onChange={e=>setFlt(p=>({...p,dProfit:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_wkNet" value={flt.wkNet||''} onChange={e=>setFlt(p=>({...p,wkNet:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_wkNetR" value={flt.wkNetR||''} onChange={e=>setFlt(p=>({...p,wkNetR:e.target.value}))} className="flt" readOnly placeholder=">0%"/></th><th className="px-2 py-1"><input id="flt_cumNet" value={flt.cumNet||''} onChange={e=>setFlt(p=>({...p,cumNet:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_cumNetR" value={flt.cumNetR||''} onChange={e=>setFlt(p=>({...p,cumNetR:e.target.value}))} className="flt" readOnly placeholder=">0%"/></th></tr></thead>
              <tbody>{distFiltered.length===0?<tr><td colSpan={17} className="px-4 py-8 text-center text-slate-400 text-sm">无匹配数据</td></tr>:distFiltered.map(r=>{const noSale=r.wkSales===0||r.actualPrice===0;const marginColor=noSale?'#94a3b8':(r.dMargin<=0?'#dc2626':r.dMargin<opRate?'#ea580c':'#16a34a');const roomColor=noSale?'#94a3b8':(r.supplyRoom>0?'#16a34a':'#dc2626');return(<tr key={r.code} className="border-b border-slate-50 hover:bg-amber-50/50"><td className="px-3 py-2"><div className="font-medium">{r.name}</div><div className="text-xs text-slate-400">{r.code}</div></td><td className="px-3 py-2 text-right tabular-nums">{fmtNum(r.endStock)}</td><td className="px-3 py-2 text-right tabular-nums">{r.wkSales>0?(r.stockSalesRatio).toFixed(2):'—'}</td><td className="px-3 py-2 text-right tabular-nums">¥{r.sp.toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums">{noSale?'—':'¥'+r.actualPrice.toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums font-medium" style={{color:noSale?'#94a3b8':r.dUnit>=0?'#16a34a':'#dc2626'}}>{noSale?'未售卖':'¥'+r.dUnit.toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums" style={{color:marginColor}}>{noSale?'未售卖':r.dMargin.toFixed(2)+'%'}</td><td className="px-3 py-2 text-right tabular-nums font-medium" style={{color:noSale?'#94a3b8':r.dNetUnit>=0?'#16a34a':'#dc2626'}}>{noSale?'未售卖':'¥'+r.dNetUnit.toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums" style={{color:noSale?'#94a3b8':r.dNetMargin>=0?'#16a34a':'#dc2626'}}>{noSale?'未售卖':r.dNetMargin.toFixed(2)+'%'}</td><td className="px-3 py-2 text-right tabular-nums text-slate-600">{noSale?'—':'¥'+r.bePrice.toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums font-medium" style={{color:roomColor}}>{noSale?'—':(r.supplyRoom>=0?'+':'')+'¥'+r.supplyRoom.toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums text-slate-500">{fmtNum(r.wkSales)}</td><td className="px-3 py-2 text-right tabular-nums font-semibold">{noSale?'-':'¥'+fmtMoney(r.dProfit)}</td><td className="px-3 py-2 text-right tabular-nums font-semibold" style={{color:noSale?'#94a3b8':r.wkNet>=0?'#16a34a':'#dc2626'}}>{noSale?'-':'¥'+fmtMoney(Math.round(r.wkNet))}</td><td className="px-3 py-2 text-right tabular-nums" style={{color:noSale?'#94a3b8':r.wkNetR>=0?'#16a34a':'#dc2626'}}>{noSale?'-':r.wkNetR.toFixed(2)+'%'}</td><td className="px-3 py-2 text-right tabular-nums font-semibold" style={{color:noSale?'#94a3b8':r.cumNet>=0?'#16a34a':'#dc2626'}}>{noSale?'-':'¥'+fmtMoney(Math.round(r.cumNet))}</td><td className="px-3 py-2 text-right tabular-nums" style={{color:noSale?'#94a3b8':r.cumNetR>=0?'#16a34a':'#dc2626'}}>{noSale?'-':r.cumNetR.toFixed(2)+'%'}</td></tr>);})}</tbody>
            </table>
          </div>
        </div>
      </div>
      
      {showSupplyDetail && <SupplyDetailModal skuMaster={skuMaster} skuWeeks={skuWeeks} supply={supply} onClose={()=>setShowSupplyDetail(false)} />}
    </div>
  );
}

function SupplyDetailModal({ skuMaster, skuWeeks, supply, onClose }) {
  const rows = useMemo(() => {
    const lastIdx = PERIODS.length - 1;
    const result = skuMaster.map(s => {
      const weeks = skuWeeks[s.code] || [];
      const totalSales = weeks.reduce((sum, w) => sum + (w.sales || 0), 0);
      const endStock = weeks[lastIdx]?.end || 0;
      const unitSupply = +supply[s.code] || 0;
      const totalQty = totalSales + endStock;
      const realizedSupply = totalSales * unitSupply;
      const potentialSupply = endStock * unitSupply;
      const totalSupply = realizedSupply + potentialSupply;
      return { code: s.code, name: s.name, cat: s.cat, totalQty, realizedSupply, potentialSupply, totalSupply, unitSupply };
    });
    return result.sort((a, b) => b.totalSupply - a.totalSupply);
  }, [skuMaster, skuWeeks, supply]);

  const totalSum = rows.reduce((acc, r) => ({
    totalQty: acc.totalQty + r.totalQty,
    realizedSupply: acc.realizedSupply + r.realizedSupply,
    potentialSupply: acc.potentialSupply + r.potentialSupply,
    totalSupply: acc.totalSupply + r.totalSupply,
  }), { totalQty: 0, realizedSupply: 0, potentialSupply: 0, totalSupply: 0 });

  return (
    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl my-auto">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <h3 className="font-bold flex items-center gap-2"><Store className="w-5 h-5 text-indigo-600"/> 我方总供货额明细（按总供货额降序）</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
        </div>
        <div className="p-5">
          <div className="overflow-x-auto rounded-lg border border-slate-200">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 text-slate-500">
                <tr>
                  <th className="px-3 py-2 text-left font-medium">商品</th>
                  <th className="px-3 py-2 text-right font-medium">件数（总货量）</th>
                  <th className="px-3 py-2 text-right font-medium">已实现供货额</th>
                  <th className="px-3 py-2 text-right font-medium">库存潜在供货额</th>
                  <th className="px-3 py-2 text-right font-medium">总供货额</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.code} className="border-b border-slate-50 hover:bg-slate-50">
                    <td className="px-3 py-2"><div className="font-medium text-slate-700">{r.name}</div><div className="text-xs text-slate-400">{r.code} · {r.cat}</div></td>
                    <td className="px-3 py-2 text-right tabular-nums">{fmtNum(r.totalQty)}</td>
                    <td className="px-3 py-2 text-right tabular-nums text-slate-600">¥{fmtMoney(r.realizedSupply)}</td>
                    <td className="px-3 py-2 text-right tabular-nums text-slate-600">¥{fmtMoney(r.potentialSupply)}</td>
                    <td className="px-3 py-2 text-right tabular-nums font-semibold">¥{fmtMoney(r.totalSupply)}</td>
                  </tr>
                ))}
                <tr className="border-t-2 border-slate-200 bg-slate-50 font-semibold">
                  <td className="px-3 py-2">总计</td>
                  <td className="px-3 py-2 text-right tabular-nums">{fmtNum(totalSum.totalQty)}</td>
                  <td className="px-3 py-2 text-right tabular-nums">¥{fmtMoney(totalSum.realizedSupply)}</td>
                  <td className="px-3 py-2 text-right tabular-nums">¥{fmtMoney(totalSum.potentialSupply)}</td>
                  <td className="px-3 py-2 text-right tabular-nums">¥{fmtMoney(totalSum.totalSupply)}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div className="mt-4 flex justify-end">
            <button onClick={onClose} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">关闭</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PriceCtrlView({ctrl,setCtrl,skuCode,setSkuCode,skuMetrics,skuWeeks,skuMaster}){
  const [showUpload,setShowUpload]=useState(false);
  const applyUpload=rows=>setCtrl(p=>{const n={...p};rows.forEach(r=>{n[r.code]=r.cp;});return n;});
  const last=PERIODS.length-1;
  const rows=skuMaster.map(s=>{const cp=+ctrl[s.code]||0;const actual=skuMetrics[s.code]?.[last]?.avgPrice||0;const endInv=skuWeeks[s.code]&&skuWeeks[s.code][last]?(skuWeeks[s.code][last].end||0):0;const diff=actual-cp,dpct=cp>0?diff/cp*100:0;const status=endInv===0?'无库存':actual===0?'无销量':diff<-0.5?'破价':diff<cp*0.03?'临界':'正常';return{...s,cp,actual,diff,dpct,status,endInv};});
  const breaks=rows.filter(r=>r.status==='破价').length;
  const warns=rows.filter(r=>r.status==='临界').length;
  const zero=rows.filter(r=>r.status==='无库存'||r.status==='无销量').length;
  const sku=skuMaster.find(s=>s.code===skuCode);
  const series=(skuMetrics[skuCode]||[]).map(w=>({period:w.period,actual:+(w.avgPrice||0).toFixed(2),ctrl:+ctrl[skuCode]||0}));
  const ctrlValue=+ctrl[skuCode]||0;
  const renderActualDot=(props)=>{const{cx,cy,payload}=props;if(cx==null||cy==null)return null;const broken=payload.ctrl>0&&payload.actual>0&&payload.actual<payload.ctrl;return <circle cx={cx} cy={cy} r={broken?4.5:2.5} fill={broken?'#dc2626':'#2563eb'} stroke="#fff" strokeWidth={1}/>;};
  const stColor={'破价':'#dc2626','临界':'#ea580c','正常':'#16a34a','无销量':'#94a3b8','无库存':'#cbd5e1'};
  return (
    <div className="space-y-5">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <Kpi icon={<ShieldAlert className="w-5 h-5"/>} tint="#dc2626" label="破价 SKU" value={breaks+' 个'}/>
        <Kpi icon={<TrendingDown className="w-5 h-5"/>} tint="#ea580c" label="临界预警" value={warns+' 个'}/>
        <Kpi icon={<Tag className="w-5 h-5"/>} tint="#16a34a" label="正常" value={(rows.length-breaks-warns-zero)+' 个'}/>
      </div>
      <Card title="实际单价 vs 公域控价" subtitle={`${sku?.name||'—'} — 蓝=分销商倒算单价 ｜ 红虚线=公域控价`}>
        <div className="flex items-center gap-2 mb-2"><select value={skuCode} onChange={e=>setSkuCode(e.target.value)} className="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-sm">{skuMaster.map(s=><option key={s.code} value={s.code}>{s.name}</option>)}</select></div>
        <div className="h-64 w-full"><ResponsiveContainer><LineChart data={series} margin={{top:5,right:10,left:0,bottom:0}}><CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/><XAxis dataKey="period" tick={{fontSize:12,fill:'#94a3b8'}}/><YAxis tick={{fontSize:12,fill:'#94a3b8'}} domain={[0,'auto']}/><Tooltip formatter={v=>'¥'+Number(v).toFixed(2)}/><Legend/>{ctrlValue>0&&<ReferenceArea y1={0} y2={ctrlValue} fill="#dc2626" fillOpacity={0.07} ifOverflow="extendDomain"/>}<Line name="实际倒算单价" dataKey="actual" stroke="#2563eb" strokeWidth={2} dot={renderActualDot}/><Line name="公域控价（红色区域内为破价）" dataKey="ctrl" stroke="#dc2626" strokeWidth={2} strokeDasharray="5 4" dot={false}/></LineChart></ResponsiveContainer></div>
      </Card>
      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2"><div className="flex items-center gap-2"><EyeOff className="w-4 h-4 text-slate-400"/><h3 className="font-semibold">公域控价录入与破价监控</h3></div></div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 border-b border-slate-100"><tr className="text-slate-500"><th className="px-3 py-2 text-left font-medium">商品</th><th className="px-3 py-2 text-right font-medium">公域控价</th><th className="px-3 py-2 text-right font-medium">本周实际单价</th><th className="px-3 py-2 text-right font-medium">差额</th><th className="px-3 py-2 text-right font-medium">偏离</th><th className="px-3 py-2 text-left font-medium">状态</th></tr></thead>
            <tbody>{rows.map(r=>(<tr key={r.code} className="border-b border-slate-50 hover:bg-slate-50"><td className="px-3 py-2"><div className="font-medium">{r.name}</div><div className="text-xs text-slate-400">{r.code}</div></td><td className="px-3 py-2 text-right"><NumInput value={r.cp} onChange={v=>setCtrl(p=>({...p,[r.code]:v}))}/></td><td className="px-3 py-2 text-right tabular-nums">¥{r.actual.toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums" style={{color:r.status==='无库存'||r.status==='无销量'?'#94a3b8':r.diff<0?'#dc2626':'#16a34a'}}>{r.status==='无库存'||r.status==='无销量'?r.status:(r.diff>=0?'+':'')+r.diff.toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums" style={{color:r.status==='无库存'||r.status==='无销量'?'#94a3b8':r.diff<0?'#dc2626':'#16a34a'}}>{r.status==='无库存'||r.status==='无销量'?r.status:(r.dpct>=0?'+':'')+r.dpct.toFixed(2)+'%'}</td><td className="px-3 py-2"><span onClick={()=>setSkuCode(r.code)} className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full font-medium cursor-pointer" style={{background:stColor[r.status]+'1a',color:stColor[r.status]}}>{r.status==='破价'&&<ShieldAlert className="w-3 h-3"/>}{r.status}{r.status==='无销量'&&<span className="ml-1 opacity-70">(库存{fmtNum(r.endInv)})</span>}</span></td></tr>))}</tbody>
          </table>
        </div>
      </div>
      
    </div>
  );
}


function Card({title, subtitle, action, children}){
  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
      {(title || subtitle || action) && (
        <div className="flex items-start justify-between gap-2 mb-3">
          <div>
            {title && <h3 className="font-semibold text-slate-800">{title}</h3>}
            {subtitle && <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>}
          </div>
          {action ? <div className="shrink-0">{action}</div> : null}
        </div>
      )}
      {children}
    </div>
  );
}
function Kpi({icon,tint,label,value,chg,sub,onClick}){
  const up=chg>=0;
  return <div className={`bg-white rounded-xl border border-slate-200 shadow-sm p-4 ${onClick?'cursor-pointer':''}`} onClick={onClick}><div className="flex items-center justify-between"><span className="text-sm text-slate-500">{label}</span><span className="p-1.5 rounded-lg" style={{background:tint+'1a',color:tint}}>{icon}</span></div><div className="mt-2 text-2xl font-bold tabular-nums">{value}</div>{chg!==undefined&&<div className={`mt-1 text-xs flex items-center gap-1 ${up?'text-green-600':'text-red-500'}`}>{up?<TrendingUp className="w-3.5 h-3.5"/>:<TrendingDown className="w-3.5 h-3.5"/>}{pct(chg)}<span className="text-slate-400">环比</span></div>}{sub&&<div className="mt-1 text-xs text-slate-400">{sub}</div>}</div>;
}
function NumInput({value,onChange}){
  return <input type="number" step="0.01" value={value} onChange={e=>onChange(e.target.value===''?'':Number(e.target.value))} className="w-24 text-right border border-slate-200 rounded-md px-2 py-1 text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-indigo-400"/>;
}
function PasswordSetting({current,onSave,onClose}){
  const [val,setVal]=useState(''); const [confirm,setConfirm]=useState(''); const [err,setErr]=useState('');
  const submit=()=>{if(!val){setErr('请输入新密码');return;} if(val!==confirm){setErr('两次输入不一致');return;} onSave(val); onClose();};
  return <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto"><div className="bg-white rounded-2xl shadow-xl w-full max-w-sm my-auto"><div className="flex items-center justify-between px-5 py-4 border-b border-slate-100"><h3 className="font-bold flex items-center gap-2"><Settings className="w-5 h-5 text-indigo-600"/>设置访问密码</h3><button onClick={onClose} className="..."><X className="w-5 h-5"/></button></div><div className="p-5 space-y-4"><div className="space-y-2"><label className="text-sm text-slate-600">新密码</label><input type="password" value={val} onChange={e=>{setVal(e.target.value);setErr('');}} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div><div className="space-y-2"><label className="text-sm text-slate-600">确认密码</label><input type="password" value={confirm} onChange={e=>{setConfirm(e.target.value);setErr('');}} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>{err&&<p className="text-xs text-red-500">{err}</p>}<div className="flex justify-end gap-2"><button onClick={onClose} className="...">取消</button><button onClick={submit} className="...">保存</button></div></div></div></div>;
}
function GistSyncModal({data,onLoad,onClose}){
  const [token,setToken]=useState('');
  const [gistId,setGistId]=useState(()=>{const saved=safeStorage.getItem('zhaofeng_gist_id'); return saved||DEFAULT_GIST_ID;});
  const [status,setStatus]=useState('');
  const [loading,setLoading]=useState(false);
  useEffect(()=>{if(window.location.protocol!=='file:'){const saved=safeStorage.getItem('zhaofeng_gist_id'); if(saved) setGistId(saved);}},[]);
  const showMsg=(msg)=>{setStatus(msg);setTimeout(()=>setStatus(''),4000);};
  const push=async()=>{if(!token){showMsg('请输入 GitHub PAT Token');return;} setLoading(true); try{const body={description:'兆丰渠道周转数据',public:false,files:{'data.json':{content:JSON.stringify(data,null,2)}}}; const url=gistId?`https://api.github.com/gists/${gistId}`:'https://api.github.com/gists'; const method=gistId?'PATCH':'POST'; const res=await fetch(url,{method,headers:{'Authorization':`token ${token}`,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify(body)}); const json=await res.json(); if(!res.ok)throw new Error(json.message||`HTTP ${res.status}`); const newId=json.id; if(newId){setGistId(newId); if(window.location.protocol!=='file:')safeStorage.setItem('zhaofeng_gist_id',newId);} showMsg(gistId?'✅ Gist 更新成功':`✅ Gist 创建成功，ID: ${newId}`);}catch(e){showMsg('❌ 失败: '+e.message);}finally{setLoading(false);}};
  const pull=async()=>{if(!gistId){showMsg('请输入 Gist ID');return;} setLoading(true); try{const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:token?{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}:{}}); const json=await res.json(); if(!res.ok)throw new Error(json.message||`HTTP ${res.status}`); const content=json.files?.['data.json']?.content; if(!content)throw new Error('Gist 中未找到 data.json'); const parsed=JSON.parse(content); onLoad(parsed); if(window.location.protocol!=='file:')safeStorage.setItem('zhaofeng_gist_id',gistId); showMsg('✅ 拉取成功，数据已更新');}catch(e){showMsg('❌ 失败: '+e.message);}finally{setLoading(false);}};
  return <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto"><div className="bg-white rounded-2xl shadow-xl w-full max-w-md my-auto"><div className="flex items-center justify-between px-5 py-4 border-b border-slate-100"><h3 className="font-bold flex items-center gap-2"><Upload className="w-5 h-5 text-indigo-600"/>Gist 同步</h3><button onClick={onClose} className="..."><X className="w-5 h-5"/></button></div><div className="p-5 space-y-4"><div className="rounded-lg bg-amber-50 border border-amber-200 px-3 py-2 text-xs text-amber-700"><p className="font-semibold">首次使用流程：</p><ol className="list-decimal list-inside mt-1 space-y-0.5"><li>生成 Token，勾选 gist 权限</li><li>输入 Token 点击「推送」→ 自动生成 secret Gist</li><li>记录 Gist ID，填入 HTML 中 GIST_ID 常量</li></ol></div><div className="space-y-2"><label className="text-sm text-slate-600">GitHub PAT Token</label><input type="password" value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono"/></div><div className="space-y-2"><label className="text-sm text-slate-600">Gist ID</label><input type="text" value={gistId} onChange={e=>setGistId(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono"/></div>{status&&<p className="text-xs px-3 py-2 rounded-lg bg-slate-50 text-slate-700">{status}</p>}<div className="flex justify-end gap-2"><button onClick={onClose} className="...">关闭</button><button onClick={pull} disabled={loading} className="...">拉取</button><button onClick={push} disabled={loading} className="...">{loading?'推送中...':'推送'}</button></div></div></div></div>;
}

const root = createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><Dashboard/></ErrorBoundary>);
</script>
</body>
</html>
