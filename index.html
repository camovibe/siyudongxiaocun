function expandPeriods(newLabels) {

  const existing = new Set(PERIODS.map(p => p.label));

  const existingNormalized = new Set();

  PERIODS.forEach(p => { existingNormalized.add(normalizePeriodLabel(p.label)); });

  let added = false;

  newLabels.forEach(label => {

    const clean = String(label).trim();

    if (!clean) return;

    if (existing.has(clean)) return;

    const normalized = normalizePeriodLabel(clean);

    if (!existingNormalized.has(normalized)) {

      PERIODS.push({label: normalized, idx: PERIODS.length});

      existing.add(clean);

      existingNormalized.add(normalized);

      added = true;

    }

  });

  return added;

}



function normalizePeriodLabel(label) {

  if (!label) return '';

  const clean = String(label).trim();

  const m1 = clean.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);

  if (m1) return String(parseInt(m1[2],10)) + '/' + String(parseInt(m1[3],10));

  const m2 = clean.match(/^(\d{1,2})[\/\-](\d{1,2})$/);

  if (m2) return String(parseInt(m2[1],10)) + '/' + String(parseInt(m2[2],10));

  const m3 = clean.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);

  if (m3) return String(parseInt(m3[1],10)) + '/' + String(parseInt(m3[2],10));

  const m4 = clean.match(/(\d{1,2})月(\d{1,2})日?/);

  if (m4) return parseInt(m4[1],10) + '/' + parseInt(m4[2],10);

  return clean;

}



function findPeriodIdx(label) {

  if (!label) return -1;

  if (!Array.isArray(PERIODS)) return -1;

  const target = normalizePeriodLabel(label);

  const clean = String(label).trim();

  let idx = PERIODS.findIndex(p => p.label === clean);

  if (idx >= 0) return idx;

  idx = PERIODS.findIndex(p => p.label === target);

  if (idx >= 0) return idx;

  const nums = clean.match(/(\d{1,2})\D+(\d{1,2})/);

  if (nums) {

    idx = PERIODS.findIndex(p => p.label === parseInt(nums[1],10) + '/' + parseInt(nums[2],10));

    if (idx >= 0) return idx;

  }

  return -1;

}

function normalizeImportedActivity(act) {
  if (!act || typeof act !== 'object') return null;
  const n = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
  const legacySubsidy = n(act.activityPriceSubsidy);
  const hasNewFields = act.consumerPriceSubsidy !== undefined || act.distributorRebate !== undefined;
  // 旧数据只有 activityPriceSubsidy 时，兼容归入消费者端补贴，且不得重复扣减
  const consumerPriceSubsidy = hasNewFields ? n(act.consumerPriceSubsidy) : legacySubsidy;
  const distributorRebate = hasNewFields ? n(act.distributorRebate) : 0;
  return {
    ...act,
    activityChannel: act.activityChannel || 'ALL',
    skuMode: act.skuMode || (act.skuCodes && act.skuCodes.length > 0 ? 'custom' : 'all'),
    activityPriceSubsidy: legacySubsidy,
    consumerPriceSubsidy,
    distributorRebate,
    updatedAt: act.updatedAt || act.createdAt || Date.now()
  };
}

function genSkuWeeks(skus, seed=20260616){

  const rng = mulberry32(seed);

  const out = {};

  for (const s of skus) {

    const p = PROFILE[s.profile];

    let stock = s.profile==='dead' ? Math.round(s.demand*50) : Math.round(s.demand*(p.cover+2));

    let demand = s.demand;

    const arr = [];

    for (let i=0;i<PERIODS.length;i++){

      const begin = stock;

      demand = demand*(1+p.trend)*(0.85+rng()*0.3);

      const promo = 0.82 + rng()*0.18;

      const priceElastic = 1 + (1-promo)*1.4;

      const effDemand = demand*priceElastic;

      const sales = Math.max(0, Math.min(begin, Math.round(effDemand)));

      let inbound = 0;

      if (s.profile!=='dead' && begin - sales < s.demand*p.reorder){

        inbound = Math.round(s.demand*p.cover);

      }

      const end = Math.max(0, begin - sales + inbound);

      stock = end;

      const unitPrice = +(s.price*promo).toFixed(2);

      const gmv = Math.round(sales*unitPrice);

      arr.push({ begin, inbound, end, sales, gmv, unitPrice });

    }

    out[s.code] = arr;

  }

  return out;

}

function genChannelWeekly(skus, weeks, seed=987654321){

  const rng = mulberry32(seed);

  const CAT_CH_W = {};

  for (const c of CATS){

    const w = CHANNELS.map(()=>0.3+rng()*rng()*3);

    const sum = w.reduce((a,b)=>a+b,0);

    CAT_CH_W[c.key] = w.map(x=>x/sum);

  }

  return PERIODS.map(p=>{

    const row = { label:p.label };

    CHANNELS.forEach((ch,ci)=>{

      let gmv=0, vol=0;

      for (const s of skus){

        const w = weeks[s.code][p.idx];

        const wt = CAT_CH_W[s.cat][ci]*(0.85+rng()*0.3);

        gmv += w.gmv*wt; vol += w.sales*wt;

      }

      row['g_'+ch]=Math.round(gmv); row['v_'+ch]=Math.round(vol);

    });

    return row;

  });

function Sparkline({ data, dataKey, color, valueFormatter }) {

  const latest = data && data.length > 0 ? data[data.length - 1] : null;

  const latestValue = latest && Number.isFinite(Number(latest[dataKey])) ? Number(latest[dataKey]) : null;
  const points = useMemo(() => {
    if (!data || data.length === 0) return '';
    const rawVals = data.map(d => {
      const v = Number(d?.[dataKey]);
      return Number.isFinite(v) ? v : null;
    });
    const numericVals = rawVals.filter(v => v !== null);
    if (numericVals.length === 0) return '';
    const min = Math.min(...numericVals), max = Math.max(...numericVals);
    const range = (max - min) || 1;
    const W = 120, H = 30, pad = 3;
    const n = rawVals.length;
    return rawVals.map((v, i) => {
      if (!Number.isFinite(v)) return null;
      const x = pad + (n > 1 ? (i / (n - 1)) * (W - 2 * pad) : 0);
      const y = H - pad - ((v - min) / range) * (H - 2 * pad);
      // v3.2（规则二十二）：x/y 二次校验，杜绝 polyline points 出现 NaN
      if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).filter(Boolean).join(' ');
  }, [data, dataKey]);


  return (

    <div className="flex items-center gap-2">

      <svg width={120} height={30} style={{ flexShrink: 0 }}>

        {points ? <polyline points={points} fill="none" stroke={color} strokeWidth={1.5} strokeLinejoin="round" strokeLinecap="round" /> : null}

      </svg>

      <span className="text-xs tabular-nums text-slate-600 text-right" style={{ minWidth: '3rem' }}>

        {latestValue !== null && latestValue !== undefined ? (valueFormatter ? valueFormatter(latestValue) : latestValue.toFixed(2)) : '—'}

      </span>

    </div>

  );

}

function BatchUploadModal({open,onClose,mode,onApply,skuMaster}){
  const isCost=mode==='cost', isPrice=mode==='price', isSku=mode==='sku', isChannel=mode==='channel';
  const [step,setStep]=useState('idle');
  const [fileName,setFileName]=useState('');
  const [uploadMode,setUploadMode]=useState('overwrite');
  const [parsed,setParsed]=useState([]);
  const fileRef=useRef(null);

  const parseCSV=(text)=>{
    const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
    if(lines.length===0) return [];
    const first=lines[0];
    const hasHeader=isSku?(first.includes('商品编码')||first.includes('code')):isChannel?(first.includes('渠道')||first.includes('channel')):isCost?(first.includes('商品编码')||first.includes('成本')||first.includes('cost')||first.includes('供货')):(first.includes('控价')||first.includes('price'));
    const startIdx=hasHeader?1:0;
    const rows=[];
    for(let i=startIdx;i<lines.length;i++){
      const line=lines[i].trim(); if(!line) continue;
      const cols=[]; let cur=''; let inQuote=false;
      for(let j=0;j<line.length;j++){
        const ch=line[j];
        if(ch==='"') inQuote=!inQuote;
        else if(ch===',' && !inQuote){cols.push(cur.trim()); cur='';}
        else cur+=ch;
      }
      cols.push(cur.trim()); rows.push(cols);
    }
    return rows;
  };

  const validateRows=(rawRows)=>{
    if(isSku){
      return rawRows.map(cols=>{
        const [code,period,beginStr,inboundStr,salesStr,gmvStr,endStr]=cols;
        const s=skuMaster.find(x=>x.code===code);
        if(!s) return {code:code||'',name:'',period:period||'',begin:0,inbound:0,sales:0,gmv:0,end:0,status:'err',msg:'商品编码不存在'};
        const begin=parseInt(beginStr.replace(/,/g,''))||0;
        const inbound=parseInt(inboundStr.replace(/,/g,''))||0;
        const sales=parseInt(salesStr.replace(/,/g,''))||0;
        const gmv=parseInt(gmvStr.replace(/,/g,''))||0;
        const end=parseInt(endStr.replace(/,/g,''))||0;
        if([begin,inbound,sales,gmv,end].some(v=>isNaN(v))) return {code:s.code,name:s.name,period:period||'',begin,inbound,sales,gmv,end,status:'err',msg:'数值字段必须为数字'};
        return {code:s.code,name:s.name,period:period||'',begin,inbound,sales,gmv,end,status:'ok',msg:''};
      });
    }
    if(isChannel){
      const firstRow=rawRows[0];
      const isMatrix=firstRow&&firstRow.length>=6;
      if(isMatrix){
        const startRow=firstRow.some(c=>c&&(c.includes('商品编码')||c.includes('周期')||c.includes('code')))?1:0;
        const headers=firstRow.map(h=>(h||'').trim());
        const channels=[];
        for(let i=0;i<headers.length;i++){
          const col=headers[i];
          if(col.endsWith('数量')){
            const chName=col.slice(0,-2);
            let gmvIdx=headers.findIndex((h,hi)=>hi>i&&h===chName+'金额');
            if(gmvIdx<0) gmvIdx=headers.findIndex((h,hi)=>hi>i&&h===col+'金额');
            if(gmvIdx>=0) channels.push({name:chName,volIdx:i,gmvIdx});
          }
        }
        if(channels.length===0) return [{status:'err',msg:'未识别到渠道列。'}];
        const results=[];
        for(let i=startRow;i<rawRows.length;i++){
          const row=rawRows[i]; if(!row||row.length===0) continue;
          const period=(row[0]||'').trim();
          const code=(row[1]||'').trim();
          channels.forEach(ch=>{
            const vol=parseInt((row[ch.volIdx]||'').replace(/,/g,''))||0;
            const gmv=parseInt((row[ch.gmvIdx]||'').replace(/,/g,''))||0;
            results.push({period,code,channel:ch.name,gmv,vol,status:'ok',msg:''});
          });
        }
        if(results.length===0) return [{status:'err',msg:'未找到数据行。'}];
        return results;
      }
      return rawRows.map(cols=>{
        const [period,channel,gmvStr,volStr]=cols;
        if(!CHANNELS.includes(channel)) return {period:period||'',channel:channel||'',gmv:0,vol:0,status:'err',msg:'渠道名称不存在'};
        const gmv=parseInt((gmvStr||'').replace(/,/g,''))||0;
        const vol=parseInt((volStr||'').replace(/,/g,''))||0;
        if(isNaN(gmv)||isNaN(vol)) return {period:period||'',channel,gmv,vol,status:'err',msg:'数值字段必须为数字'};
        return {period:period||'',code:'',channel,gmv,vol,status:'ok',msg:''};
      });
    }
    const dataRows=rawRows.filter(cols=>{const code=(cols[0]||'').trim(); return code!=='商品编码'&&code!=='编码'&&code!=='code'&&code!=='Code'&&code!=='商品';});
    return dataRows.map(cols=>{
      if(isCost){
        const [code,name,cStr,spStr,date]=cols;
        const s=skuMaster.find(x=>x.code===code);
        if(!s) return {code:code||'',name:name||'',c:0,sp:0,date:date||'',status:'err',msg:'商品编码不存在'};
        const c=parseFloat(cStr.replace(/,/g,''))||0;
        const sp=parseFloat(spStr.replace(/,/g,''))||0;
        if(isNaN(c)||isNaN(sp)) return {code:s.code,name:s.name,c,sp,date:date||'',status:'err',msg:'成本/供货价必须为数字'};
        return {code:s.code,name:s.name,c,sp,date:date||'',status:'ok',msg:''};
      }
      const [code,name,cpStr,date]=cols;
      const s=skuMaster.find(x=>x.code===code);
      if(!s) return {code:code||'',name:name||'',cp:0,date:date||'',status:'err',msg:'商品编码不存在'};
      const cp=parseInt(cpStr.replace(/,/g,''))||0;
      if(isNaN(cp)) return {code:s.code,name:s.name,cp,date:date||'',status:'err',msg:'控价必须为数字'};
      return {code:s.code,name:s.name,cp,date:date||'',status:'ok',msg:''};
    });
  };

  const handleFile=(file)=>{
    if(!file) return;
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext==='xlsx'||ext==='xls'){alert('当前仅支持 .csv 格式上传。');return;}
    setFileName(file.name);
    const reader=new FileReader();
    reader.onload=(e)=>{
      const text=e.target.result;
      const rawRows=parseCSV(text);
      const validated=validateRows(rawRows);
      setParsed(validated); setStep('validated');
    };
    reader.readAsText(file);
  };
  const handleSelect=()=>{if(fileRef.current) fileRef.current.click();};
  const handleDrop=(e)=>{e.preventDefault(); const files=e.dataTransfer.files; if(files.length>0) handleFile(files[0]);};
  const handleDragOver=(e)=>{e.preventDefault();};
  if(!open) return null;
  const okRows=parsed.filter(r=>r.status==='ok');
  const errCount=parsed.length-okRows.length;
  const reset=()=>{setStep('idle');setFileName('');setUploadMode('overwrite');setParsed([]);};
  const close=()=>{reset();onClose();};
  const confirm=()=>{onApply(okRows,uploadMode);setStep('done');};
  const titles={sku:'单品周数据上传',channel:'渠道周数据上传',cost:'成本 / 供货价批量上传',price:'公域控价批量上传'};
  const title=titles[mode]||'批量上传';
  const infos={sku:'批量导入各 SKU 的进销存数据。必填字段：商品编码、周期、期初库存、入库数、销售数量、GMV、期末库存。',channel:'批量导入各渠道周度数据。支持矩阵格式（推荐）和纵向格式。',cost:'批量导入各 SKU 的成本与供货价。',price:'批量导入各 SKU 的公域控价。'};
  const info=infos[mode]||'';
  const bgColors={sku:'bg-blue-50',channel:'bg-purple-50',cost:'bg-emerald-50',price:'bg-amber-50'};
  const iconColors={sku:'text-blue-600',channel:'text-purple-600',cost:'text-emerald-600',price:'text-amber-600'};
  const bgColor=bgColors[mode]||'bg-slate-50';
  const iconColor=iconColors[mode]||'text-slate-600';

  const downloadTemplate=()=>{
    const BOM='\uFEFF'; let csv='';
    if(mode==='sku'){csv='商品编码,周期,期初库存,入库数,销售数量,GMV,期末库存\n'; skuMaster.forEach(s=>{csv+=s.code+','+PERIODS[0].label+',100,0,50,6500,50\n';});}
    else if(mode==='channel'){csv='周期,商品编码,商品名称'; CHANNELS.forEach(ch=>{csv+=','+ch+'数量,'+ch+'金额';}); csv+='\n'; skuMaster.slice(0,3).forEach(s=>{csv+=PERIODS[0].label+','+s.code+','+s.name; CHANNELS.forEach(ch=>{csv+=',50,5000';}); csv+='\n';});}
    else if(mode==='cost'){csv='商品编码,商品名称,成本（元）,供货价（元）,生效日期\n'; skuMaster.forEach(s=>{csv+=s.code+','+s.name+','+Math.round(s.price*0.3)+','+Math.round(s.price*0.55)+',2026-06-15\n';});}
    else if(mode==='price'){csv='商品编码,商品名称,公域控价（元）,生效日期\n'; skuMaster.forEach(s=>{csv+=s.code+','+s.name+','+Math.round(s.price*0.92)+',2026-06-15\n';});}
    const blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='模板_'+title+'.csv'; a.click(); URL.revokeObjectURL(url);
  };
  const exportErrors=()=>{
    const errRows=parsed.filter(r=>r.status==='err');
    if(errRows.length===0) return;
    const BOM='\uFEFF'; let csv='';
    if(mode==='sku'){csv='商品编码,周期,期初库存,入库数,销售数量,GMV,期末库存,错误原因\n'; errRows.forEach(r=>{csv+=`${r.code||''},${r.period||''},${r.begin||0},${r.inbound||0},${r.sales||0},${r.gmv||0},${r.end||0},${r.msg||''}\n`;});}
    else if(mode==='channel'){csv='周期,渠道,销售额,销售量,错误原因\n'; errRows.forEach(r=>{csv+=`${r.period||''},${r.channel||''},${r.gmv||0},${r.vol||0},${r.msg||''}\n`;});}
    else if(mode==='cost'){csv='商品编码,商品名称,成本,供货价,生效日期,错误原因\n'; errRows.forEach(r=>{csv+=`${r.code||''},${r.name||''},${r.c||0},${r.sp||0},${r.date||''},${r.msg||''}\n`;});}
    else if(mode==='price'){csv='商品编码,商品名称,公域控价,生效日期,错误原因\n'; errRows.forEach(r=>{csv+=`${r.code||''},${r.name||''},${r.cp||0},${r.date||''},${r.msg||''}\n`;});}
    const blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='错误清单_'+title+'.csv'; a.click(); URL.revokeObjectURL(url);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-3xl my-auto">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100"><h3 className="font-bold flex items-center gap-2"><Upload className="w-5 h-5 text-indigo-600"/>{title}</h3><button onClick={close} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button></div>
        <div className="p-5 space-y-4">
          <div className={`flex items-start gap-3 rounded-lg p-3 ${bgColor}`}><Info className={`w-4 h-4 mt-0.5 shrink-0 ${iconColor}`}/><p className="text-xs text-slate-600 leading-relaxed">{info}<span className="font-medium text-slate-700"> 导入方式：{uploadMode==='overwrite'?'覆盖全部历史数据':'仅追加最新一周'}。</span></p></div>
          {step==='idle' && (
            <div className="space-y-3">
              <button onClick={downloadTemplate} className="inline-flex items-center gap-2 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"><Download className="w-4 h-4"/>下载导入模板</button>
              <input type="file" ref={fileRef} accept=".csv,.xlsx,.xls" className="hidden" onChange={e=>{handleFile(e.target.files[0]);e.target.value='';}}/>
              <div onClick={handleSelect} onDrop={handleDrop} onDragOver={handleDragOver} className="flex w-full flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-slate-300 py-10 hover:border-indigo-400 hover:bg-indigo-50 transition-colors cursor-pointer"><div className="rounded-full bg-slate-100 p-2.5 text-slate-500"><Upload className="w-5 h-5"/></div><p className="text-sm font-medium text-slate-700">点击选择文件 或 拖拽至此</p><p className="text-xs text-slate-400">支持 .csv（UTF-8），单次最多 5000 行</p></div>
            </div>
          )}
          {step==='validated' && (
            <div className="space-y-3">
              <div className="flex items-center justify-between rounded-lg bg-slate-50 px-3 py-2"><div className="flex items-center gap-2 text-sm text-slate-700"><FileSpreadsheet className="w-4 h-4 text-emerald-600"/>{fileName}</div><button onClick={reset} className="text-slate-400 hover:text-slate-600"><X className="w-4 h-4"/></button></div>
              <div className="flex flex-wrap gap-2">
                <span className="inline-flex items-center gap-1 rounded-lg bg-slate-50 px-3 py-1.5 text-sm text-slate-700"><FileSpreadsheet className="w-4 h-4"/>共读取 <b>{parsed.length}</b> 行</span>
                <span className="inline-flex items-center gap-1 rounded-lg bg-emerald-50 px-3 py-1.5 text-sm text-emerald-700"><CheckCircle2 className="w-4 h-4"/>校验通过 <b>{okRows.length}</b> 行</span>
                <span className="inline-flex items-center gap-1 rounded-lg bg-red-50 px-3 py-1.5 text-sm text-red-600"><AlertCircle className="w-4 h-4"/>异常 <b>{errCount}</b> 行</span>
                {errCount>0 && <button onClick={exportErrors} className="inline-flex items-center gap-1 rounded-lg border border-red-200 px-3 py-1.5 text-sm text-red-600 hover:bg-red-50"><Download className="w-3.5 h-3.5"/>导出错误清单</button>}
              </div>
              <div className="overflow-x-auto rounded-lg border border-slate-200">
                <table className="w-full text-sm text-left">
                  <thead className="bg-slate-50 text-slate-500"><tr>
                    {mode==='sku' && (<><th className="px-3 py-2 font-medium">编码</th><th className="px-3 py-2 font-medium">周期</th><th className="px-3 py-2 font-medium text-right">期初</th><th className="px-3 py-2 font-medium text-right">入库</th><th className="px-3 py-2 font-medium text-right">销售</th><th className="px-3 py-2 font-medium text-right">GMV</th><th className="px-3 py-2 font-medium text-right">期末</th><th className="px-3 py-2 font-medium">校验</th></>)}
                    {mode==='channel' && (<><th className="px-3 py-2 font-medium">周期</th><th className="px-3 py-2 font-medium">商品编码</th><th className="px-3 py-2 font-medium">渠道</th><th className="px-3 py-2 font-medium text-right">销售额</th><th className="px-3 py-2 font-medium text-right">销售量</th><th className="px-3 py-2 font-medium">校验</th></>)}
                    {mode==='cost' && (<><th className="px-3 py-2 font-medium">编码</th><th className="px-3 py-2 font-medium">名称</th><th className="px-3 py-2 font-medium text-right">成本</th><th className="px-3 py-2 font-medium text-right">供货价</th><th className="px-3 py-2 font-medium">生效日期</th><th className="px-3 py-2 font-medium">校验</th></>)}
                    {mode==='price' && (<><th className="px-3 py-2 font-medium">编码</th><th className="px-3 py-2 font-medium">名称</th><th className="px-3 py-2 font-medium text-right">公域控价</th><th className="px-3 py-2 font-medium">生效日期</th><th className="px-3 py-2 font-medium">校验</th></>)}
                  </tr></thead>
                  <tbody>
                    {parsed.map((r,i)=>{
                      const isErr=r.status==='err';
                      const rowCls=`border-t border-slate-100 ${isErr?'bg-red-50':''}`;
                      return (
                        <tr key={i} className={rowCls}>
                          {mode==='sku' && (<><td className="px-3 py-2 font-mono text-slate-600">{r.code}</td><td className="px-3 py-2 text-slate-500">{r.period}</td><td className="px-3 py-2 text-right tabular-nums">{r.begin}</td><td className="px-3 py-2 text-right tabular-nums">{r.inbound}</td><td className="px-3 py-2 text-right tabular-nums">{r.sales}</td><td className="px-3 py-2 text-right tabular-nums">¥{r.gmv}</td><td className="px-3 py-2 text-right tabular-nums">{r.end}</td><td className="px-3 py-2">{r.status==='ok'?<span className="inline-flex items-center gap-1 text-emerald-600"><CheckCircle2 className="w-3.5 h-3.5"/>通过</span>:<span className="inline-flex items-center gap-1 text-red-600"><AlertCircle className="w-3.5 h-3.5"/>{r.msg}</span>}</td></>)}
                          {mode==='channel' && (<><td className="px-3 py-2 text-slate-500">{r.period}</td><td className="px-3 py-2 font-mono text-slate-600">{r.code||'—'}</td><td className="px-3 py-2 text-slate-700">{r.channel}</td><td className="px-3 py-2 text-right tabular-nums">¥{r.gmv}</td><td className="px-3 py-2 text-right tabular-nums">{r.vol}</td><td className="px-3 py-2">{r.status==='ok'?<span className="inline-flex items-center gap-1 text-emerald-600"><CheckCircle2 className="w-3.5 h-3.5"/>通过</span>:<span className="inline-flex items-center gap-1 text-red-600"><AlertCircle className="w-3.5 h-3.5"/>{r.msg}</span>}</td></>)}
                          {mode==='cost' && (<><td className="px-3 py-2 font-mono text-slate-600">{r.code}</td><td className="px-3 py-2 text-slate-700">{r.name}</td><td className="px-3 py-2 text-right tabular-nums">¥{r.c.toFixed(2)}</td><td className="px-3 py-2 text-right tabular-nums">¥{r.sp.toFixed(2)}</td><td className="px-3 py-2 text-slate-500">{r.date||'—'}</td><td className="px-3 py-2">{r.status==='ok'?<span className="inline-flex items-center gap-1 text-emerald-600"><CheckCircle2 className="w-3.5 h-3.5"/>通过</span>:<span className="inline-flex items-center gap-1 text-red-600"><AlertCircle className="w-3.5 h-3.5"/>{r.msg}</span>}</td></>)}
                          {mode==='price' && (<><td className="px-3 py-2 font-mono text-slate-600">{r.code}</td><td className="px-3 py-2 text-slate-700">{r.name}</td><td className="px-3 py-2 text-right tabular-nums">¥{r.cp}</td><td className="px-3 py-2 text-slate-500">{r.date||'—'}</td><td className="px-3 py-2">{r.status==='ok'?<span className="inline-flex items-center gap-1 text-emerald-600"><CheckCircle2 className="w-3.5 h-3.5"/>通过</span>:<span className="inline-flex items-center gap-1 text-red-600"><AlertCircle className="w-3.5 h-3.5"/>{r.msg}</span>}</td></>)}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div className="flex items-center gap-2 rounded-lg bg-slate-50 px-3 py-2 text-sm"><span className="text-slate-500">导入方式：</span><button onClick={()=>setUploadMode('overwrite')} className={`inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs font-medium ${uploadMode==='overwrite'?'bg-indigo-100 text-indigo-700':'text-slate-600 hover:bg-slate-100'}`}>覆盖全部历史数据</button><button onClick={()=>setUploadMode('append')} className={`inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs font-medium ${uploadMode==='append'?'bg-indigo-100 text-indigo-700':'text-slate-600 hover:bg-slate-100'}`}>仅追加最新一周</button></div>
              <div className="flex justify-end gap-2"><button onClick={reset} className="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">取消</button><button onClick={confirm} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">确认导入 {okRows.length} 行</button></div>
            </div>
          )}
          {step==='done' && (
            <div className="flex flex-col items-center justify-center gap-2 py-8"><CheckCircle2 className="w-12 h-12 text-emerald-500"/><p className="text-lg font-semibold">导入成功</p><p className="text-sm text-slate-500">{okRows.length===0&&errCount===0?'未检测到可导入数据。':`已${uploadMode==='overwrite'?'覆盖更新':'追加最新'} ${okRows.length} 行，跳过异常 ${errCount} 行`}</p><button onClick={close} className="mt-2 rounded-lg bg-indigo-600 px-5 py-2 text-sm font-medium text-white hover:bg-indigo-700">完成</button></div>
          )}
        </div>
      </div>
    </div>
  );
}

function TotalTrendModal({data,mode,onClose}){

  const label = isGmv ? '总体GMV趋势' : '总体件数趋势';

  return (

    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto">

      <div className="bg-white rounded-2xl shadow-xl w-full max-w-3xl my-auto">

        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">

          <h3 className="font-bold flex items-center gap-2"><BarChart3 className="w-5 h-5 text-indigo-600"/>{label}</h3>

                <Area dataKey={dataKey} stroke={color} strokeWidth={2} fill="url(#gTotal)"/>

              </AreaChart>

            </ResponsiveContainer>

          </div>

        </div>

    </div>

  );

}





function ChannelView({channelWeekly,onUpload,isReadOnly}){

  const [metric,setMetric] = useState('g');

  const prefix = metric==='g'?'g_':'v_';

  const data = channelWeekly;



  const allChannels = useMemo(()=>{

    const chSet = new Set();

    data.forEach(row=>{

      Object.keys(row).forEach(k=>{

        if(k.startsWith('g_')) chSet.add(k.slice(2));

      });

    });

    return Array.from(chSet);

  },[data]);



  const [active,setActive] = useState([]);

  useEffect(()=>{

    if(allChannels.length>0 && active.length===0){

      setActive(allChannels.slice(0,6));

    }

  },[allChannels]);

  const toggle = ch => setActive(p=>p.includes(ch)?p.filter(x=>x!==ch):[...p,ch]);

  const chColor = ch => CH_COLOR[allChannels.indexOf(ch) % CH_COLOR.length];



  const last = data.length>0 ? data[data.length-1] : {};

  const lastLabel = last.label || '—';

  const rankRaw = allChannels.map(ch=>({name:ch,val:last[prefix+ch]||0})).filter(r=>r.val>0).sort((a,b)=>b.val-a.val);

  const weekTotal = rankRaw.reduce((sum,r)=>sum+r.val,0);

  const rank = rankRaw.slice(0,10).map(r=>({...r, pct: weekTotal>0 ? +((r.val/weekTotal)*100).toFixed(1) : 0}));

  const top10Total = rank.reduce((sum,r)=>sum+r.val,0);

  const top10Share = weekTotal>0 ? +(top10Total/weekTotal*100).toFixed(1) : 0;



  const histRaw = allChannels.map(ch=>{

    const total = data.reduce((sum,row)=>sum+(row[prefix+ch]||0),0);

    return {name:ch,val:total};

  }).filter(r=>r.val>0).sort((a,b)=>b.val-a.val);

  const histTotal = histRaw.reduce((sum,r)=>sum+r.val,0);

  const histRank = histRaw.slice(0,10).map(r=>({...r, pct: histTotal>0 ? +((r.val/histTotal)*100).toFixed(1) : 0}));

  const histTop10Total = histRank.reduce((sum,r)=>sum+r.val,0);

  const histTop10Share = histTotal>0 ? +(histTop10Total/histTotal*100).toFixed(1) : 0;



  const shareSeries = useMemo(()=> data.map(row=>{

    const total = allChannels.reduce((a,ch)=>a+(row['g_'+ch]||0),0);

    const o = { label:row.label };

    allChannels.forEach(ch=>{ o[ch] = total>0 ? +((row['g_'+ch]||0)/total*100).toFixed(2) : 0; });

    return o;

  }),[data,allChannels]);

  const lastShare = shareSeries.length>0 ? shareSeries[shareSeries.length-1] : {};

  const prevShare = shareSeries.length>1 ? shareSeries[shareSeries.length-2] : {};

  const shareDeltas = allChannels.map((ch)=>({

    name:ch, color:chColor(ch),

    cur:lastShare[ch]||0, delta:+((lastShare[ch]||0)-(prevShare[ch]||0)).toFixed(2),

  }));



  const cumData = useMemo(()=>{

    const acc = {};

    return data.map(row=>{

      const out = { label: row.label };

      allChannels.forEach(ch=>{

        const k = prefix+ch;

        acc[k] = (acc[k]||0) + (row[k]||0);

        out[k] = acc[k];

      });

      return out;

    });

  },[data,allChannels,prefix]);



  const cumShareSeries = useMemo(()=> cumData.map(row=>{

    const total = allChannels.reduce((a,ch)=>a+(row[prefix+ch]||0),0);

    const o = { label: row.label };

    allChannels.forEach(ch=>{ o[ch] = total>0 ? +((row[prefix+ch]||0)/total*100).toFixed(2) : 0; });

    return o;

  }),[cumData,allChannels,prefix]);



  return (

    <div className="space-y-5">

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-3 flex flex-wrap items-center gap-2">

        <span className="text-sm text-slate-500 mr-1">渠道</span>

        {allChannels.map((ch)=>{

          const on=active.includes(ch);

          return <button key={ch} onClick={()=>toggle(ch)} className="text-xs px-2.5 py-1 rounded-full border"

            style={{borderColor:on?chColor(ch):'#e2e8f0',background:on?chColor(ch):'#fff',color:on?'#fff':'#64748b'}}>{ch}</button>;

        })}

        <div className="flex-1"/>
        {!isReadOnly && (<button onClick={onUpload}
          className="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">
          <Upload className="w-3.5 h-3.5"/>上传渠道周数据
        </button>)}
        <div className="flex rounded-lg overflow-hidden border border-slate-200">

          {[['g','销售额'],['v','销售量']].map(([k,l])=>(

            <button key={k} onClick={()=>setMetric(k)} className={`text-sm px-4 py-1.5 font-medium ${metric===k?'bg-indigo-600 text-white':'bg-white text-slate-500'}`}>{l}</button>

          ))}

        </div>

      </div>



      <Card title={`各渠道周度${metric==='g'?'销售额':'销售量'}趋势`} subtitle={`已选 ${active.length} 个渠道 · 全 ${data.length} 周`}>

        <div className="h-80 w-full">

          <ResponsiveContainer>

            <LineChart data={data} margin={{top:5,right:10,left:0,bottom:0}}>

              <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/>

              <XAxis dataKey="label" tick={{fontSize:12,fill:'#94a3b8'}}/>

              <YAxis tick={{fontSize:12,fill:'#94a3b8'}} tickFormatter={v=>metric==='g'?(v/10000).toFixed(0)+'万':v}/>

              <Tooltip formatter={v=>metric==='g'?'¥'+fmtMoney(v):fmtNum(v)+' 件'}/>

              <Legend/>

              {active.map(ch=>{const i=allChannels.indexOf(ch);return (

                <Line key={ch} name={ch} dataKey={prefix+ch} stroke={CH_COLOR[i % CH_COLOR.length]} strokeWidth={2} dot={false}/>

              );})}

            </LineChart>

          </ResponsiveContainer>

        </div>

      </Card>



      <Card title="各渠道销售额占比变化（每周）" subtitle="以销售额(GMV)为基数 · 卡片数值=当周占比，pp=环比上周百分点变化 · 折线为占比趋势">

        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-4">

          {shareDeltas.filter(d=>active.includes(d.name)).map(d=>{

            const up=d.delta>=0;

            return (

              <div key={d.name} className="rounded-lg border border-slate-200 p-2.5">

                <div className="flex items-center gap-1.5">

                  <span className="inline-block w-2.5 h-2.5 rounded-full" style={{background:d.color}}/>

                  <span className="text-xs text-slate-500 truncate">{d.name}</span>

                </div>

                <div className="mt-1 text-lg font-bold tabular-nums">{d.cur}%</div>

                <div className={`text-xs flex items-center gap-0.5 ${up?'text-green-600':'text-red-500'}`}>

                  {up?<TrendingUp className="w-3 h-3"/>:<TrendingDown className="w-3 h-3"/>}

                  {up?'+':''}{d.delta} pp

                </div>

              </div>

            );

          })}

        </div>

        <div className="h-72 w-full">

          <ResponsiveContainer>

            <LineChart data={shareSeries} margin={{top:5,right:10,left:0,bottom:0}}>

              <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/>

              <XAxis dataKey="label" tick={{fontSize:12,fill:'#94a3b8'}}/>

              <YAxis tick={{fontSize:12,fill:'#94a3b8'}} tickFormatter={v=>v+'%'}/>

              <Tooltip formatter={v=>v+'%'}/>

              <Legend/>

              {active.map(ch=>{const i=allChannels.indexOf(ch);return (

                <Line key={ch} name={ch} dataKey={ch} stroke={CH_COLOR[i % CH_COLOR.length]} strokeWidth={2} dot={false}/>

              );})}

            </LineChart>

          </ResponsiveContainer>

        </div>

      </Card>



      <Card title={`各渠道历史滚动累积${metric==='g'?'销售额':'销售量'}趋势`} subtitle={`已选 ${active.length} 个渠道 · 全 ${data.length} 周滚动累加`}>

        <div className="h-80 w-full">

/* ================= 机会洞察（增强版 v3）辅助函数与计算 ================= */

function pearson(xs, ys){

  const n = xs.length;

  if(n<2) return 0;

  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;

  let sxy=0,sxx=0,syy=0;

  for(let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }

  const d = Math.sqrt(sxx*syy);

  return d>0 ? +(sxy/d).toFixed(2) : 0;

}

function Chip({tone,children}){

  const map = {

    good:'bg-emerald-50 text-emerald-700 border-emerald-200',

    warn:'bg-amber-50 text-amber-700 border-amber-200',

    bad:'bg-red-50 text-red-600 border-red-200',

    info:'bg-indigo-50 text-indigo-700 border-indigo-200',

    mute:'bg-slate-50 text-slate-500 border-slate-200',

  };

  return <span className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full border ${map[tone]||map.mute}`}>{children}</span>;

}

function TrendArrow({slope}){

  if(slope>0.01) return <TrendingUp className="w-3.5 h-3.5 text-emerald-600 inline"/>;

  if(slope<-0.01) return <TrendingDown className="w-3.5 h-3.5 text-red-500 inline"/>;

  return <span className="text-slate-300">—</span>;

}

function downloadFile(filename, content, mime){

  const blob = new Blob(['\uFEFF'+content], {type:mime});

  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');

  a.href = url; a.download = filename; a.click();

  URL.revokeObjectURL(url);

}



function InsightView({ skuMaster, skuWeeks, skuMetrics, channelWeekly, channelSkuWeekly, isReadOnly }){

  const [win,setWin] = useState(3);

  const [spikeTh,setSpikeTh] = useState(25);

  const [restockDays,setRestockDays] = useState(30);

  const [forecastWeeks,setForecastWeeks] = useState(4);

  const [scope,setScope] = useState('ALL');

  const [skuFilter,setSkuFilter] = useState('');

  const [priceFilter,setPriceFilter] = useState('');

  const lastIdx = PERIODS.length - 1;



  const safeChannelSkuWeekly = channelSkuWeekly || {};

  const channels = useMemo(()=>{

    try {

      const set = new Set();

      if (Array.isArray(channelWeekly)) {

        channelWeekly.forEach(r => Object.keys(r||{}).forEach(k => { if(k.startsWith('g_')) set.add(k.slice(2)); }));

      }

      return Array.from(set);

    } catch(e) { return []; }

  },[channelWeekly]);

  const chColor = (ch)=> CH_COLOR[channels.indexOf(ch) % CH_COLOR.length] || '#64748b';

  const hasCSW = Object.keys(safeChannelSkuWeekly).length > 0;

  const effScope = (scope!=='ALL' && hasCSW) ? scope : 'ALL';

  const scopeLabel = effScope==='ALL' ? '全渠道' : effScope;



  const A = useMemo(()=>{

    try {

      const gmvOf = (code,i)=> effScope==='ALL' ? (skuWeeks?.[code]?.[i]?.gmv || 0) : (safeChannelSkuWeekly?.[code]?.[effScope]?.[i]?.gmv || 0);

      const salesOf = (code,i)=> effScope==='ALL' ? (skuWeeks?.[code]?.[i]?.sales || 0) : (safeChannelSkuWeekly?.[code]?.[effScope]?.[i]?.vol || 0);



      const analyze = (vals)=>{

        const n = vals.length;

        if(!n) return {latest:0,baseline:0,short:0,shortPct:0,slope:0,isSpike:false,prev:0, growthPct:0};

        const latest = vals[n-1]||0;

        const prev = n>1?(vals[n-2]||0):latest;

        const w = Math.max(1, Math.min(win,n));

        const base = vals.slice(n-w).reduce((a,b)=>a+b,0)/w;

        const short = latest-base;

        const shortPct = base!==0 ? short/Math.abs(base)*100 : 0;

        const k = Math.min(4,n);

        const seg = vals.slice(n-k);

        let sx=0,sy=0,sxy=0,sxx=0;

        seg.forEach((y,i)=>{sx+=i;sy+=y;sxy+=i*y;sxx+=i*i;});

        const den = k*sxx-sx*sx;

        const slope = den!==0 ? (k*sxy-sx*sy)/den : 0;

        const growthPct = base!==0 ? (slope/base)*100 : 0;

        return {latest,baseline:base,short,shortPct,slope,isSpike:Math.abs(shortPct)>=spikeTh,prev, growthPct};

      };



      const totalGmvW = PERIODS.map((_,i)=> skuMaster.reduce((a,s)=>a+gmvOf(s.code,i),0));

      const totalSalesW = PERIODS.map((_,i)=> skuMaster.reduce((a,s)=>a+salesOf(s.code,i),0));



      // SKU 占比与销售额

      const skuShare = skuMaster.map(s=>{

        const shares = PERIODS.map((_,i)=> totalGmvW[i]>0 ? +(gmvOf(s.code,i)/totalGmvW[i]*100).toFixed(2) : 0);

        const gmvs = PERIODS.map((_,i)=> gmvOf(s.code,i));

        const a = analyze(shares);

        const gmvA = analyze(gmvs);

        return {...s, shares, a, gmvs, gmvA};

      }).filter(s=> s.shares.some(v=>v>0) || s.gmvs.some(v=>v>0));

      

      // 品类占比与销售额

      const catShare = CATS.map(c=>{

        const shares = PERIODS.map((_,i)=>{

          const g = skuMaster.filter(s=>s.cat===c.key).reduce((x,s)=>x+gmvOf(s.code,i),0);

          return totalGmvW[i]>0 ? +(g/totalGmvW[i]*100).toFixed(2) : 0;

        });

        const gmvs = PERIODS.map((_,i)=> skuMaster.filter(s=>s.cat===c.key).reduce((x,s)=>x+gmvOf(s.code,i),0));

        return {key:c.key, color:c.color, shares, a:analyze(shares), gmvs, gmvA:analyze(gmvs)};

      }).filter(c=>c.shares.some(v=>v>0) || c.gmvs.some(v=>v>0));

      

      const catShareSeries = PERIODS.map((p,i)=>{ const o={label:p.label}; catShare.forEach(c=>o[c.key]=c.shares[i]); return o; });

      const shareMedian = (()=>{ const b=skuShare.map(s=>s.a.baseline).sort((x,y)=>x-y); return b.length?b[Math.floor(b.length/2)]:0; })();



      // 价格×动销

      const priceDyn = skuMaster.map(s=>{

        const prices=[],sales=[];

        PERIODS.forEach((_,i)=>{ const q=salesOf(s.code,i), g=gmvOf(s.code,i); prices.push(q>0?g/q:0); sales.push(q); });

        const paired = prices.map((p,i)=>({p,q:sales[i]})).filter(o=>o.p>0 && o.q>0);

        const corr = paired.length < 6 ? null : pearson(paired.map(o=>o.p),paired.map(o=>o.q));

        const pa=analyze(prices), qa=analyze(sales);

        const ratioNet = effScope==='ALL' ? (skuMetrics?.[s.code]?.[lastIdx]?.ratioNet ?? 99) : null;

        return {...s, corr, pa, qa, ratioNet};

      }).filter(s=> (s.qa.baseline>0 || s.qa.latest>0));



      // 停止动销

      const stoppedSku = [];

      skuMaster.forEach(s=>{

        const arr = skuWeeks?.[s.code] || [];

        const latest = arr[lastIdx] || {};

        if(!arr.some(w=>(w?.sales||0)>0)) return;

        if((latest.sales||0)!==0) return;

        let li=-1; for(let i=lastIdx;i>=0;i--){ if((arr[i]?.sales||0)>0){li=i;break;} }

        const active = li>=0?arr[li]:{};

        const preDaily = (active.sales||0)/7;

        const preTurn = skuMetrics?.[s.code]?.[li]?.turnover || 0;

        const end = latest.end || 0;

        const lowStock = end <= Math.max(1, preDaily);

        stoppedSku.push({...s, end, preDaily:+preDaily.toFixed(2), preTurn, lowStock,

          weeksStopped:lastIdx-li, suggestRestock:Math.round(preDaily*restockDays)});

      });

      const stoppedCh = channels.map(ch=>{

        const g = channelWeekly.map(r=>r['g_'+ch]||0);

        if(!(g.some(v=>v>0) && (g[lastIdx]||0)===0)) return null;

        let li=-1; for(let i=lastIdx;i>=0;i--){ if((g[i]||0)>0){li=i;break;} }

        return {ch, lastGmv: li>=0?g[li]:0, weeksStopped:lastIdx-li};

      }).filter(Boolean);



      // 渠道价值

      const chVal = channels.map(ch=>{

        const g = channelWeekly.map(r=>r['g_'+ch]||0);

        const cum = g.reduce((a,b)=>a+b,0);

        const a = analyze(g);

        const growth = a.baseline>0 ? a.slope/a.baseline*100 : 0;

        const future = Math.max(0, a.baseline + a.slope*forecastWeeks);

        return {ch, cum, latest:a.latest, baseline:a.baseline, slope:a.slope, growth, future, isSpike:a.isSpike, gmvs:g, gmvA:a};

      }).filter(c=>c.cum>0);

      const cm = chVal.map(c=>c.cum).sort((x,y)=>x-y);

      const medianCum = cm.length? cm[Math.floor(cm.length/2)] : 0;

      chVal.forEach(c=>{ const hv=c.cum>=medianCum, gr=c.growth>0;

        c.quad = hv&&gr?'star':hv&&!gr?'cow':!hv&&gr?'potential':'dog'; });

      chVal.sort((a,b)=>b.future-a.future);

      const chValTotals = chVal.reduce((acc,c)=>({

        cum: acc.cum + c.cum,

        baseline: acc.baseline + c.baseline,

        future: acc.future + c.future,

      }), {cum:0, baseline:0, future:0});



      // Top10 差异

      const curWeek = channelWeekly[lastIdx] || {};

      const curTotal = channels.reduce((a,ch)=>a+(curWeek['g_'+ch]||0),0);

      const histAll = channels.reduce((a,ch)=>a+channelWeekly.reduce((x,r)=>x+(r['g_'+ch]||0),0),0);

      const top = channels.map(ch=>{

        const gmvs = channelWeekly.map(r=>r['g_'+ch]||0);

        const cum = gmvs.reduce((x,r)=>x+r,0);

        const curShare = curTotal>0?(curWeek['g_'+ch]||0)/curTotal*100:0;

        const histShare = histAll>0?cum/histAll*100:0;

        const gmvA = analyze(gmvs);

        return {ch, gmvs, gmvA, curShare:+curShare.toFixed(1), histShare:+histShare.toFixed(1), delta:+(curShare-histShare).toFixed(1), cum};

      });

      const curTop = [...top].filter(t=>t.curShare>0).sort((a,b)=>b.curShare-a.curShare).slice(0,10);

      const histTop = [...top].filter(t=>t.histShare>0).sort((a,b)=>b.histShare-a.histShare).slice(0,10);

      const histTopSet = new Set(histTop.map(t=>t.ch));

      const newEntrants = curTop.filter(t=>!histTopSet.has(t.ch));

      const rising = [...top].filter(t=>t.delta>0.1).sort((a,b)=>b.delta-a.delta);

      const falling = [...top].filter(t=>t.delta<-0.1).sort((a,b)=>a.delta-b.delta);



      return {totalGmvW, totalSalesW, skuShare, catShare, catShareSeries, shareMedian, priceDyn,

        stoppedSku, stoppedCh, chVal, chValTotals, curTop, histTop, newEntrants, rising, falling, top};

    } catch(e) {

      console.error('InsightView A计算失败', e);

      return {

        totalGmvW: [], totalSalesW: [], skuShare: [], catShare: [], catShareSeries: [], shareMedian: 0,

        priceDyn: [], stoppedSku: [], stoppedCh: [], chVal: [], chValTotals: {cum:0,baseline:0,future:0},

        curTop: [], histTop: [], newEntrants: [], rising: [], falling: [], top: []

      };

    }

  },[skuMaster, skuWeeks, skuMetrics, channelWeekly, safeChannelSkuWeekly, channels, win, spikeTh, restockDays, forecastWeeks, effScope, lastIdx]);

  const recommendedParams = useMemo(()=>{

    const totalGmv = A.totalGmvW;

    if (totalGmv.length < 6) return { win: 3, spikeTh: 25 };

    const weekChanges = [];

    for (let i=1;i<totalGmv.length;i++) {

      const prev = totalGmv[i-1];

      if (prev === 0) continue;

      weekChanges.push(Math.abs((totalGmv[i]-prev)/prev));

    }

    if (weekChanges.length === 0) return { win: 3, spikeTh: 25 };

    const meanChange = weekChanges.reduce((a,b)=>a+b,0)/weekChanges.length;

    const stdChange = Math.sqrt(weekChanges.reduce((a,b)=>a+(b-meanChange)**2,0)/weekChanges.length);

    const recommendedTh = Math.max(15, Math.min(60, Math.round((meanChange + stdChange) * 100)));

    const recommendedWin = meanChange > 0.4 ? 5 : (meanChange > 0.25 ? 4 : 3);

    return { win: recommendedWin, spikeTh: recommendedTh, meanChange, stdChange };

  }, [A.totalGmvW]);



  const applyRecommend = () => {

    setWin(recommendedParams.win);

    setSpikeTh(recommendedParams.spikeTh);

  };



  const filterSku = (item) => {

    if (!skuFilter) return true;

    const q = skuFilter.toLowerCase();

    return item.name.toLowerCase().includes(q) || item.code.includes(q) || item.cat.includes(q);

  };

  const filterPrice = (item) => {

    if (!priceFilter) return true;

    const q = priceFilter.toLowerCase();

    const advice = priceAdvice(item).text;

    return item.name.toLowerCase().includes(q) || item.code.includes(q) || advice.includes(q);

  };



  const shareAdvice = (a, isTop)=>{

    if(a.isSpike && a.slope<=0) return {tone:'warn', text:'当周占比含短期波动，勿据此追单'};

    if(a.slope>0.05) return {tone:'good', text:'占比稳步上升，可加投/扩铺'};

    if(a.slope<-0.05 && isTop) return {tone:'bad', text:'头部份额下滑，需巩固防守'};

    if(a.slope<-0.05) return {tone:'warn', text:'占比走弱，排查动销/铺市'};

    return {tone:'mute', text:'占比平稳'};

  };

  const priceAdvice = (s)=>{

    const spike = s.qa.isSpike ? '（当周动销含短期波动）' : '';

    if(s.corr === null) return {tone:'mute', text:'样本不足：无法判断价格与动销关系'};

    if(s.corr<=-0.3){

      if(s.ratioNet!=null && s.ratioNet>3) return {tone:'bad', text:'价格与动销呈负相关信号+库存积压：阶段性降价去库存'+spike};

      return {tone:'good', text:'价格与动销呈负相关信号：守价即可'+spike};

    }

    if(s.corr>=0.3) return {tone:'info', text:'价格与动销呈正相关信号：可小幅提价试探'+spike};

    return {tone:'mute', text:'价格非主驱动：聚焦渠道/内容'+spike};

  };

  const quadMeta = {

    star:{tone:'good', label:'明星（高现值·高增长）', act:'重点加码，保供保价'},

    cow:{tone:'info', label:'现金牛（高现值·增长放缓）', act:'维持投入，提利润率'},

    potential:{tone:'warn', label:'潜力（低现值·高增长）', act:'加大铺市与资源倾斜'},

    dog:{tone:'mute', label:'瘦狗（低现值·低增长）', act:'控投入或择机收缩'},

  };



  const buildMarkdown = ()=>{

    const L = [];

    L.push(`# 兆丰机会洞察深度报告（口径：${scopeLabel}）`);

    L.push(`生成时间：${new Date().toLocaleString()}`);

    L.push(`参数：平滑窗口 ${win} 周 · 波动阈值 ${spikeTh}% · 补货天数 ${restockDays} 天 · 未来价值预测 ${forecastWeeks} 周`);

    L.push(`推荐参数：平滑窗口 ${recommendedParams.win} 周 · 波动阈值 ${recommendedParams.spikeTh}%`);

    L.push(`\n## ① 品 / 品类 占比与机会点`);

    A.skuShare.slice().sort((a,b)=>b.a.baseline-a.a.baseline).forEach(s=>{

      const adv = shareAdvice(s.a, s.a.baseline>=A.shareMedian);

      const gmvTrend = s.gmvs.length ? `当周GMV ¥${fmtMoney(s.gmvs[s.gmvs.length-1])} · 增长率 ${s.gmvA.growthPct>=0?'+':''}${s.gmvA.growthPct.toFixed(1)}%/周` : '无销售';

      L.push(`- **${s.name}**(${s.code}·${s.cat})：占比 ${s.a.latest.toFixed(2)}%（基线 ${s.a.baseline.toFixed(2)}%）· ${gmvTrend} · 短期波动 ${(s.a.short>=0?'+':'')+s.a.short.toFixed(2)}pp${s.a.isSpike?'⚡':''} → ${adv.text}`);

    });

    L.push(`### 品类汇总（含销售额及逐周增长率）`);

    A.catShare.forEach(c=>{

      const gmvTrend = c.gmvs.length ? `当周GMV ¥${fmtMoney(c.gmvs[c.gmvs.length-1])} · 增长率 ${c.gmvA.growthPct>=0?'+':''}${c.gmvA.growthPct.toFixed(1)}%/周` : '无销售';

      L.push(`- **${c.key}**：占比 ${c.a.latest.toFixed(2)}%（基线 ${c.a.baseline.toFixed(2)}%）· ${gmvTrend} → ${shareAdvice(c.a, c.a.baseline>=A.shareMedian).text}`);

    });

    L.push(`\n## ② 价格 × 动销 机会点`);

    A.priceDyn.slice().sort((a,b)=>a.corr-b.corr).forEach(s=>{

      const adv = priceAdvice(s);

      L.push(`- **${s.name}**(${s.code})：价·量相关 ${s.corr>=0?'+':''}${s.corr} / 基线均价 ¥${s.pa.baseline.toFixed(2)} / 基线周销 ${s.qa.baseline.toFixed(1)}${s.ratioNet!=null?` / 库销比(净) ${s.ratioNet>=99?'∞':s.ratioNet.toFixed(2)}`:''} → ${adv.text}`);

    });

    L.push(`\n## ③ 停止动销预警`);

    if(!A.stoppedSku.length && !A.stoppedCh.length){ L.push('- 无停销 SKU / 渠道'); }

    A.stoppedSku.forEach(s=>{

      L.push(`- [SKU] ${s.name}(${s.code})：已停 ${s.weeksStopped} 周 · 期末库存 ${fmtNum(s.end)} · 断货前日均 ${s.preDaily} 件 · ${s.lowStock?`低库存断货，建议补货约 ${fmtNum(s.suggestRestock)} 件（${restockDays}天）`:'尚有库存但零动销，核查价格/渠道/需求'}`);

    });

    L.push(`\n## ④ 渠道价值矩阵（现有 / 未来）`);

    A.chVal.forEach(c=>{

    });

    L.push(`\n## ⑤ 当周 Top10 vs 历史 Top10 动态差异`);

    if(A.newEntrants.length) L.push(`- 【新晋机会渠道】${A.newEntrants.map(t=>`${t.ch}(当周${t.curShare}%,+${t.delta}pp)`).join('、')}`);

    A.rising.slice(0,8).forEach(t=>{

    A.falling.slice(0,8).forEach(t=>{

    L.push(`\n## 深度问题提炼（供LLM分析）`);

    L.push(`1. 哪些SKU虽占比高但增长率下滑，可能面临份额萎缩？`);

    L.push(`4. 停销SKU中哪些是因低库存导致，应优先补货？哪些是需求消失，应停止投入？`);

    L.push(`5. 渠道价值矩阵中哪些“潜力”渠道值得加大投入？哪些“瘦狗”渠道应收缩？`);

    L.push(`6. 新晋Top10渠道是否有可持续性？其增长是由活动驱动还是自然增长？`);

    L.push(`7. 结合品类占比变化，未来应重点发展哪个品类？`);

    L.push(`8. 全渠道中哪些渠道贡献了主要增长？哪些渠道拖累整体？`);

    L.push(`9. 针对当前渠道结构，如何优化资源分配以提升整体GMV和利润率？`);

    return L.join('\n');

  };

                <div key={t.ch} className="flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2 text-sm">

                  <span className="font-medium text-slate-700">{t.ch}</span>

                  <span className="text-xs text-slate-500">当周 {t.curShare}% ← 历史 {t.histShare}% <span className="text-red-500 font-semibold">{t.delta}pp</span> · GMV ¥{fmtMoney(t.gmvs[t.gmvs.length-1])} · <span style={{color:t.gmvA.growthPct>=0?'#16a34a':'#dc2626'}}>{t.gmvA.growthPct>=0?'+':''}{t.gmvA.growthPct.toFixed(1)}%/周</span></span>

                </div>

              ))}

              {A.falling.length===0 && <p className="text-xs text-slate-400">无下滑渠道</p>}

      </Card>



      <div className="flex items-start gap-2 text-xs text-slate-400 px-1">

        <Info className="w-3.5 h-3.5 mt-0.5 shrink-0"/>

        <span>①② 支持切换"全渠道 / 单渠道"口径（需矩阵格式渠道数据含商品编码）；③④⑤ 为全量渠道口径。所有结论可一键导出 Markdown/JSON 直接喂给 AI agent。导出 Markdown 已包含深度问题提炼。</span>

      </div>

    </div>

  );

}



function ProfitView({cost,setCost,supply,setSupply,skuWeeks,skuMaster,isReadOnly,opRate:opRateProp,setOpRate:setOpRateProp}){

  const [showUpload,setShowUpload]=useState(false);

  const [profitSkuCode,setProfitSkuCode]=useState(skuMaster[0]?.code||'');

  // opRate 由 Dashboard 统一持有（与 Activity Economics 共用同一口径）；未传入时本地兜底
  const [opRateLocal,setOpRateLocal]=useState(12);
  const opRate = Number.isFinite(Number(opRateProp)) ? Number(opRateProp) : opRateLocal;
  const setOpRate = typeof setOpRateProp === 'function' ? setOpRateProp : setOpRateLocal;

  const [flt,setFlt]=useState({});

  const [showSupplyDetail,setShowSupplyDetail]=useState(false);

  const distTopRef=useRef(null);

  const distBotRef=useRef(null);

  const distTopInnerRef=useRef(null);

  const distSyncing=useRef(false);

  const textMatch=(field,expr)=>{if(!expr) return true; return String(field).toLowerCase().includes(expr.toLowerCase());};

  const matchNum=(v,expr)=>{

    if(!expr) return true;

    const val=(v===Infinity)?1e15:(v==null?NaN:Number(v));

    let e=String(expr).replace(/\s/g,'').replace(/％/g,'%').replace(/＞/g,'>').replace(/＜/g,'<').replace(/＝/g,'=').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/[~～–—]/g,'-');

    e=e.replace(/(-?\d*\.?\d+)%/g,'$1');

    let m;

    if(m=e.match(/^(-?\d*\.?\d+)-(-?\d*\.?\d+)$/)) return !isNaN(val)&&val>=+m[1]-1e-9&&val<=+m[2]+1e-9;

    if(m=e.match(/^(>=|<=|==|>|<|=)(-?\d*\.?\d+)$/)){

      if(isNaN(val)) return false;

      const n=+m[2];

      switch(m[1]){case'>':return val>n;case'<':return val<n;case'>=':return val>=n-1e-9;case'<=':return val<=n+1e-9;default:return Math.abs(val-n)<0.005;}

    }

    if(m=e.match(/^(-?\d*\.?\d+)$/)) return (!isNaN(val)&&Math.abs(val-+m[1])<0.005)||String(v).includes(e);

    return true;

  };

  const clearDistFilters=()=>setFlt({});

  const syncDistScroll=(src)=>{if(distSyncing.current)return;distSyncing.current=true;requestAnimationFrame(()=>{if(src==='top'&&distTopRef.current&&distBotRef.current){distBotRef.current.scrollLeft=distTopRef.current.scrollLeft;}else if(src==='bot'&&distTopRef.current&&distBotRef.current){distTopRef.current.scrollLeft=distBotRef.current.scrollLeft;}distSyncing.current=false;});};

  const [sortKey,setSortKey]=useState(null);

  const [sortDir,setSortDir]=useState('desc');

  const cycleSort=(key)=>{if(sortKey===key){if(sortDir==='desc'){setSortDir('asc');}else{setSortKey(null);setSortDir('desc');}}else{setSortKey(key);setSortDir('desc');}};

  const applyUpload=rows=>{

    setCost(p=>{const n={...p};rows.forEach(r=>{n[r.code]=r.c;});return n;});

    setSupply(p=>{const n={...p};rows.forEach(r=>{n[r.code]=r.sp;});return n;});

  };



  const last=PERIODS.length-1;

  const rows=skuMaster.map(s=>{

    const c=+cost[s.code]||0,sp=+supply[s.code]||0;

    const unit=sp-c,margin=sp>0?unit/sp*100:0;

    const wkSales=skuWeeks[s.code]?.[last]?.sales||0;

    const wkGmv=skuWeeks[s.code]?.[last]?.gmv||0;

    const actualPrice=wkSales>0?wkGmv/wkSales:0;

    const dUnit=actualPrice-sp;

    const dProfit=actualPrice>0?wkGmv-sp*wkSales:0;

    const dMargin=wkGmv>0?dProfit/wkGmv*100:0;

    const bePrice=actualPrice>0?actualPrice*(1-opRate/100):0;

    const supplyRoom=actualPrice>0?bePrice-sp:0;

    const cumGmv=PERIODS.reduce((sum,p,i)=>sum+(skuWeeks[s.code]?.[i]?.gmv||0),0);

    const cumSales=PERIODS.reduce((sum,p,i)=>sum+(skuWeeks[s.code]?.[i]?.sales||0),0);

    const cumNet=cumGmv*(1-opRate/100)-sp*cumSales;

    const cumNetR=cumGmv>0?cumNet/cumGmv*100:0;

    const wkNet=wkGmv*(1-opRate/100)-sp*wkSales;

    const wkNetR=wkGmv>0?wkNet/wkGmv*100:0;

    const dNetUnit=actualPrice>0?dUnit-sp*opRate/100:0;

    const dNetMargin=actualPrice>0?dMargin-opRate:0;

    const endStock=skuWeeks[s.code]?.[last]?.end||0;

    const inboundStock=skuWeeks[s.code]?.[last]?.inbound||0;

    const stockSalesRatio=wkSales>0?Math.max(0,(endStock-inboundStock))/(wkSales/7*30):0;

    return {...s,c,sp,unit,margin,wkSales,wkGmv,wkProfit:unit*wkSales,actualPrice,dUnit,dProfit,dMargin,supplyRoom,cumNet,cumNetR,wkNet,wkNetR,dNetUnit,dNetMargin,bePrice,endStock,stockSalesRatio};

  });

  const displayRows=useMemo(()=>{if(!sortKey)return rows;return[...rows].sort((a,b)=>{let av=a[sortKey]??-Infinity,bv=b[sortKey]??-Infinity;if(av===bv)return 0;return sortDir==='asc'?(av>bv?1:-1):(av>bv?-1:1);});},[rows,sortKey,sortDir]);

  const {distFiltered,distShown}=useMemo(()=>{let shown=0;const filtered=displayRows.filter(r=>{const pass=textMatch(r.name+' '+r.code,flt.name)&&matchNum(r.endStock,flt.endStock)&&matchNum(r.stockSalesRatio,flt.stockSalesRatio)&&matchNum(r.sp,flt.sp)&&matchNum(r.actualPrice,flt.actualPrice)&&matchNum(r.dUnit,flt.dUnit)&&matchNum(r.dMargin,flt.dMargin)&&matchNum(r.dNetUnit,flt.dNetUnit)&&matchNum(r.dNetMargin,flt.dNetMargin)&&matchNum(r.bePrice,flt.bePrice)&&matchNum(r.supplyRoom,flt.supplyRoom)&&matchNum(r.wkSales,flt.wkSales)&&matchNum(r.dProfit,flt.dProfit)&&matchNum(r.wkNet,flt.wkNet)&&matchNum(r.wkNetR,flt.wkNetR)&&matchNum(r.cumNet,flt.cumNet)&&matchNum(r.cumNetR,flt.cumNetR);if(pass)shown++;return pass;});return{distFiltered:filtered,distShown:shown};},[displayRows,flt]);

  useEffect(()=>{const setWidth=()=>{if(distBotRef.current&&distTopInnerRef.current){distTopInnerRef.current.style.width=distBotRef.current.scrollWidth+'px';}};setWidth();window.addEventListener('resize',setWidth);return()=>window.removeEventListener('resize',setWidth);},[displayRows]);

  const totalProfit=rows.reduce((a,r)=>a+r.wkProfit,0);

  const totalRev=rows.reduce((a,r)=>a+r.sp*r.wkSales,0);

  const avgMargin=totalRev>0?totalProfit/totalRev*100:0;

  const totalCumProfit=skuMaster.reduce((sum,s)=>{const arr=skuWeeks[s.code]||[];const u=(+supply[s.code]||0)-(+cost[s.code]||0);return sum+arr.reduce((a,w)=>a+u*(w.sales||0),0);},0);

  const stockPotentialProfit=skuMaster.reduce((sum,s)=>{const end=skuWeeks[s.code]?.[last]?.end||0;const u=(+supply[s.code]||0)-(+cost[s.code]||0);return sum+u*end;},0);

  const totalStockProfit=totalCumProfit+stockPotentialProfit;

  const totalWeekGmv=skuMaster.reduce((sum,s)=>sum+(skuWeeks[s.code]?.[last]?.gmv||0),0);

  const totalCumGmv=skuMaster.reduce((sum,s)=>{const arr=skuWeeks[s.code]||[];return sum+arr.reduce((a,w)=>a+(w.gmv||0),0);},0);

  const totalCumSales=skuMaster.reduce((sum,s)=>{const arr=skuWeeks[s.code]||[];return sum+arr.reduce((a,w)=>a+(w.sales||0),0);},0);

  const totalEndStock=skuMaster.reduce((sum,s)=>sum+(skuWeeks[s.code]?.[last]?.end||0),0);

  const totalStockQty=totalCumSales+totalEndStock;

  const stockPotentialGmv=skuMaster.reduce((sum,s)=>{const end=skuWeeks[s.code]?.[last]?.end||0;const arr=skuWeeks[s.code]||[];const cumSales=arr.reduce((a,w)=>a+(w.sales||0),0);const cumGmv=arr.reduce((a,w)=>a+(w.gmv||0),0);const actualPrice=cumSales>0?cumGmv/cumSales:0;return sum+actualPrice*end;},0);

  const totalStockGmv=totalCumGmv+stockPotentialGmv;

  const realizedSupplyAmount=skuMaster.reduce((sum,s)=>{const arr=skuWeeks[s.code]||[];const cumSales=arr.reduce((a,w)=>a+(w.sales||0),0);return sum+(+supply[s.code]||0)*cumSales;},0);

  const potentialSupplyAmount=skuMaster.reduce((sum,s)=>{const end=skuWeeks[s.code]?.[last]?.end||0;return sum+(+supply[s.code]||0)*end;},0);

  const totalSupplyAmount=realizedSupplyAmount+potentialSupplyAmount;

  const avgSupplyPrice=totalStockQty>0?totalSupplyAmount/totalStockQty:0;

  const avgSellPrice=totalStockQty>0?totalStockGmv/totalStockQty:0;

  const totalWeekSales=skuMaster.reduce((sum,s)=>sum+(skuWeeks[s.code]?.[last]?.sales||0),0);

  const prevWeekGmv=skuMaster.reduce((sum,s)=>sum+(skuWeeks[s.code]?.[last>0?last-1:0]?.gmv||0),0);

  const prevWeekSales=skuMaster.reduce((sum,s)=>sum+(skuWeeks[s.code]?.[last>0?last-1:0]?.sales||0),0);

  const gmvChg=prevWeekGmv>0?((totalWeekGmv-prevWeekGmv)/prevWeekGmv)*100:0;

  const salesChg=prevWeekSales>0?((totalWeekSales-prevWeekSales)/prevWeekSales)*100:0;



  const totalDistProfit=rows.reduce((a,r)=>a+r.dProfit,0);

  const distAvgMargin=totalWeekGmv>0?totalDistProfit/totalWeekGmv*100:0;

  const validRoomRows=rows.filter(r=>r.wkSales>0&&r.actualPrice>0);

  const avgSupplyRoom=validRoomRows.length>0?validRoomRows.reduce((a,r)=>a+r.supplyRoom,0)/validRoomRows.length:0;



  const trend=PERIODS.map((p,i)=>{let profit=0;for(const s of skuMaster){const u=(+supply[s.code]||0)-(+cost[s.code]||0);profit+=u*(skuWeeks[s.code]?.[i]?.sales||0);}return{label:p.label,profit:Math.round(profit)};});

  const distTrend=PERIODS.map((p,i)=>{let profit=0;for(const s of skuMaster){const sp=+supply[s.code]||0;const g=skuWeeks[s.code]?.[i]?.gmv||0;const sl=skuWeeks[s.code]?.[i]?.sales||0;profit+=g-sp*sl;}return{label:p.label,profit:Math.round(profit)};});

  const distNetTrend=PERIODS.map((p,i)=>{let gross=0,net=0;for(const s of skuMaster){const sp=+supply[s.code]||0;const g=skuWeeks[s.code]?.[i]?.gmv||0;const sl=skuWeeks[s.code]?.[i]?.sales||0;gross+=g-sp*sl;net+=g*(1-opRate/100)-sp*sl;}return{label:p.label,gross:Math.round(gross),net:Math.round(net)};});

  const distSummary=(()=>{let wGmv=0,wCost=0,cGmv=0,cCost=0;for(const s of skuMaster){const sp=+supply[s.code]||0;const wg=skuWeeks[s.code]?.[last]?.gmv||0;const ws=skuWeeks[s.code]?.[last]?.sales||0;wGmv+=wg;wCost+=sp*ws;for(let i=0;i<PERIODS.length;i++){const g=skuWeeks[s.code]?.[i]?.gmv||0;const sl=skuWeeks[s.code]?.[i]?.sales||0;cGmv+=g;cCost+=sp*sl;}}const wGross=wGmv-wCost,cGross=cGmv-cCost;const wNet=wGmv*(1-opRate/100)-wCost,cNet=cGmv*(1-opRate/100)-cCost;const pct=(n,d)=>d>0?(n/d*100):0;return{wGross:Math.round(wGross),cGross:Math.round(cGross),wNet:Math.round(wNet),cNet:Math.round(cNet),wGrossR:pct(wGross,wGmv),cGrossR:pct(cGross,cGmv),wNetR:pct(wNet,wGmv),cNetR:pct(cNet,cGmv),priceRoom:cCost>0?(cGmv*(1-opRate/100)/cCost-1)*100:0};})();



  const masterCodeSet=new Set(skuMaster.map(s=>s.code));

  const unknownCodes=[];

  for(const code of Object.keys(skuWeeks)){if(!masterCodeSet.has(code)){const totalSales=skuWeeks[code].reduce((sum,w)=>sum+(w.sales||0),0);if(totalSales>0)unknownCodes.push({code,totalSales});}}

  const missingBoth=rows.filter(r=>r.c<=0&&r.sp<=0&&r.wkSales>0);

  const missingCostOnly=rows.filter(r=>r.c<=0&&r.sp>0&&r.wkSales>0);

  const missingSupplyOnly=rows.filter(r=>r.c>0&&r.sp<=0&&r.wkSales>0);



  const pSku=skuMaster.find(s=>s.code===profitSkuCode);

  const pSeries=pSku?PERIODS.map((p,i)=>{const s=pSku;const u=(+supply[s.code]||0)-(+cost[s.code]||0);const profit=u*(skuWeeks[s.code]?.[i]?.sales||0);return{label:p.label,profit:Math.round(profit),unit:u};}):[];



  return (

    <div className="space-y-5">

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">

        <Kpi icon={<CircleDollarSign className="w-5 h-5"/>} tint="#6366f1" label="本周总GMV" value={'¥'+fmtMoney(totalWeekGmv)} sub={`较上周 ${gmvChg>=0?'+':''}${gmvChg.toFixed(1)}%`}/>

        <Kpi icon={<PackageSearch className="w-5 h-5"/>} tint="#06b6d4" label="本周件数" value={fmtNum(totalWeekSales)} sub={`较上周 ${salesChg>=0?'+':''}${salesChg.toFixed(1)}%`}/>

        <Kpi icon={<BarChart3 className="w-5 h-5"/>} tint="#0d9488" label="我方总库存GMV" value={'¥'+fmtMoney(totalStockGmv)} sub={`已实现 ¥${fmtMoney(totalCumGmv)} · 库存潜在 ¥${fmtMoney(stockPotentialGmv)}`}/>

        <Kpi icon={<Store className="w-5 h-5"/>} tint="#8b5cf6" label="我方总供货额" value={'¥'+fmtMoney(totalSupplyAmount)} sub={`整体转化 ...`} onClick={()=>setShowSupplyDetail(true)} />

      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">

        <Kpi icon={<Boxes className="w-5 h-5"/>} tint="#f59e0b" label="我方总库存件数" value={fmtNum(totalStockQty)} sub={`已售 ${fmtNum(totalCumSales)} · 期末 ${fmtNum(totalEndStock)}`}/>

        <Kpi icon={<TrendingUp className="w-5 h-5"/>} tint="#16a34a" label="我方总库存毛利" value={'¥'+fmtMoney(totalStockProfit)} sub={`已实现 ¥${fmtMoney(totalCumProfit)} · 库存潜在 ¥${fmtMoney(stockPotentialProfit)}`}/>

        <Kpi icon={<Tag className="w-5 h-5"/>} tint="#ec4899" label="我方总库存供货均价" value={'¥'+avgSupplyPrice.toFixed(2)} sub={`供货价口径`}/>

        <Kpi icon={<Activity className="w-5 h-5"/>} tint="#06b6d4" label="对方总库存销售均价" value={'¥'+avgSellPrice.toFixed(2)} sub={`实际售价口径`}/>

      </div>



      {(unknownCodes.length>0||missingBoth.length>0||missingCostOnly.length>0||missingSupplyOnly.length>0)&&(

        </div>

          <Kpi icon={<CircleDollarSign className="w-5 h-5"/>} tint="#16a34a" label="我方本周总毛利" value={'¥'+fmtMoney(totalProfit)}/>

          <Kpi icon={<BarChart3 className="w-5 h-5"/>} tint="#16a34a" label="我方本周供货收入" value={'¥'+fmtMoney(totalRev)}/>

          <Kpi icon={<Gauge className="w-5 h-5"/>} tint="#16a34a" label="我方综合毛利率" value={avgMargin.toFixed(2)+'%'}/>

          <Kpi icon={<TrendingUp className="w-5 h-5"/>} tint="#16a34a" label="我方总库存毛利" value={'¥'+fmtMoney(totalStockProfit)} sub={`已实现 ¥${fmtMoney(totalCumProfit)} · 库存潜在 ¥${fmtMoney(stockPotentialProfit)}`}/>

        </div>

        <Card title="我方周度毛利趋势" subtitle="(供货价−成本) × 周销量 求和"><div className="h-56 w-full"><ResponsiveContainer><AreaChart data={trend}><defs><linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#16a34a" stopOpacity={0.35}/><stop offset="100%" stopColor="#16a34a" stopOpacity={0}/></linearGradient></defs><CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/><XAxis dataKey="label" tick={{fontSize:12,fill:'#94a3b8'}}/><YAxis tick={{fontSize:12,fill:'#94a3b8'}} tickFormatter={v=>(v/10000).toFixed(0)+'万'}/><Tooltip formatter={v=>'¥'+fmtMoney(v)}/><Area dataKey="profit" stroke="#16a34a" strokeWidth={2} fill="url(#gP)"/></AreaChart></ResponsiveContainer></div></Card>

        {pSku&&(<Card title={`${pSku.name} 我方单品毛利趋势`} subtitle={`商品编码 ${pSku.code} · 单件毛利 ¥${pSeries[pSeries.length-1]?.unit?.toFixed(2)||'-'}`}><div className="h-56 w-full"><ResponsiveContainer><AreaChart data={pSeries}><defs><linearGradient id="gP2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#6366f1" stopOpacity={0.35}/><stop offset="100%" stopColor="#6366f1" stopOpacity={0}/></linearGradient></defs><CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9"/><XAxis dataKey="label" tick={{fontSize:12,fill:'#94a3b8'}}/><YAxis tick={{fontSize:12,fill:'#94a3b8'}} tickFormatter={v=>(v/10000).toFixed(0)+'万'}/><Tooltip formatter={v=>'¥'+fmtMoney(v)}/><Area dataKey="profit" stroke="#6366f1" strokeWidth={2} fill="url(#gP2)"/></AreaChart></ResponsiveContainer></div></Card>)}

etR')} className="px-3 py-2 text-right font-medium cursor-pointer select-none">累积净利率</th></tr><tr className="bg-amber-50/50"><th className="px-2 py-1"><input id="flt_name" value={flt.name||''} onChange={e=>setFlt(p=>({...p,name:e.target.value}))} className="flt" readOnly placeholder="筛选商品"/></th><th className="px-2 py-1"><input id="flt_endStock" value={flt.endStock||''} onChange={e=>setFlt(p=>({...p,endStock:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_stockSalesRatio" value={flt.stockSalesRatio||''} onChange={e=>setFlt(p=>({...p,stockSalesRatio:e.target.value}))} className="flt" readOnly placeholder="1-3"/></th><th className="px-2 py-1"><input id="flt_sp" value={flt.sp||''} onChange={e=>setFlt(p=>({...p,sp:e.target.value}))} className="flt" readOnly placeholder=">50"/></th><th className="px-2 py-1"><input id="flt_actualPrice" value={flt.actualPrice||''} onChange={e=>setFlt(p=>({...p,actualPrice:e.target.value}))} className="flt" readOnly placeholder=">100"/></th><th className="px-2 py-1"><input id="flt_dUnit" value={flt.dUnit||''} onChange={e=>setFlt(p=>({...p,dUnit:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_dMargin" value={flt.dMargin||''} onChange={e=>setFlt(p=>({...p,dMargin:e.target.value}))} className="flt" readOnly placeholder=">15%"/></th><th className="px-2 py-1"><input id="flt_dNetUnit" value={flt.dNetUnit||''} onChange={e=>setFlt(p=>({...p,dNetUnit:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_dNetMargin" value={flt.dNetMargin||''} onChange={e=>setFlt(p=>({...p,dNetMargin:e.target.value}))} className="flt" readOnly placeholder=">0%"/></th><th className="px-2 py-1"><input id="flt_bePrice" value={flt.bePrice||''} onChange={e=>setFlt(p=>({...p,bePrice:e.target.value}))} className="flt" readOnly placeholder="<200"/></th><th className="px-2 py-1"><input id="flt_supplyRoom" value={flt.supplyRoom||''} onChange={e=>setFlt(p=>({...p,supplyRoom:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_wkSales" value={flt.wkSales||''} onChange={e=>setFlt(p=>({...p,wkSales:e.target.value}))} className="flt" readOnly placeholder=">10"/></th><th className="px-2 py-1"><input id="flt_dProfit" value={flt.dProfit||''} onChange={e=>setFlt(p=>({...p,dProfit:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_wkNet" value={flt.wkNet||''} onChange={e=>setFlt(p=>({...p,wkNet:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_wkNetR" value={flt.wkNetR||''} onChange={e=>setFlt(p=>({...p,wkNetR:e.target.value}))} className="flt" readOnly placeholder=">0%"/></th><th className="px-2 py-1"><input id="flt_cumNet" value={flt.cumNet||''} onChange={e=>setFlt(p=>({...p,cumNet:e.target.value}))} className="flt" readOnly placeholder=">0"/></th><th className="px-2 py-1"><input id="flt_cumNetR" value={flt.cumNetR||''} onChange={e=>setFlt(p=>({...p,cumNetR:e.target.value}))} className="flt" readOnly placeholder=">0%"/></th></tr></thead>

ney(r.dProfit)}</td><td className="px-3 py-2 text-right tabular-nums font-semibold" style={{color:noSale?'#94a3b8':r.wkNet>=0?'#16a34a':'#dc2626'}}>{noSale?'-':'¥'+fmtMoney(Math.round(r.wkNet))}</td><td className="px-3 py-2 text-right tabular-nums" style={{color:noSale?'#94a3b8':r.wkNetR>=0?'#16a34a':'#dc2626'}}>{noSale?'-':r.wkNetR.toFixed(2)+'%'}</td><td className="px-3 py-2 text-right tabular-nums font-semibold" style={{color:noSale?'#94a3b8':r.cumNet>=0?'#16a34a':'#dc2626'}}>{noSale?'-':'¥'+fmtMoney(Math.round(r.cumNet))}</td><td className="px-3 py-2 text-right tabular-nums" style={{color:noSale?'#94a3b8':r.cumNetR>=0?'#16a34a':'#dc2626'}}>{noSale?'-':r.cumNetR.toFixed(2)+'%'}</td></tr>);})}</tbody>

function SupplyDetailModal({ skuMaster, skuWeeks, supply, onClose }) {

  const rows = useMemo(() => {

    const lastIdx = PERIODS.length - 1;

    const result = skuMaster.map(s => {

      const weeks = skuWeeks[s.code] || [];

      const totalSales = weeks.reduce((sum, w) => sum + (w.sales || 0), 0);

      const endStock = weeks[lastIdx]?.end || 0;

      const unitSupply = +supply[s.code] || 0;

      const totalQty = totalSales + endStock;

      const realizedSupply = totalSales * unitSupply;

      const potentialSupply = endStock * unitSupply;

      const totalSupply = realizedSupply + potentialSupply;

      return { code: s.code, name: s.name, cat: s.cat, totalQty, realizedSupply, potentialSupply, totalSupply, unitSupply };

    });

    return result.sort((a, b) => b.totalSupply - a.totalSupply);

  }, [skuMaster, skuWeeks, supply]);



  const totalSum = rows.reduce((acc, r) => ({

    totalQty: acc.totalQty + r.totalQty,

    realizedSupply: acc.realizedSupply + r.realizedSupply,

    potentialSupply: acc.potentialSupply + r.potentialSupply,

    totalSupply: acc.totalSupply + r.totalSupply,

  }), { totalQty: 0, realizedSupply: 0, potentialSupply: 0, totalSupply: 0 });



  return (

    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto">

      <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl my-auto">

        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">

          <h3 className="font-bold flex items-center gap-2"><Store className="w-5 h-5 text-indigo-600"/> 我方总供货额明细（按总供货额降序）</h3>

          <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>

        </div>

        <div className="p-5">

          <div className="overflow-x-auto rounded-lg border border-slate-200">

            <table className="w-full text-sm">

              <thead className="bg-slate-50 text-slate-500">

                <tr>

                  <th className="px-3 py-2 text-left font-medium">商品</th>

                  <th className="px-3 py-2 text-right font-medium">件数（总货量）</th>

                  <th className="px-3 py-2 text-right font-medium">已实现供货额</th>

                  <th className="px-3 py-2 text-right font-medium">库存潜在供货额</th>

                  <th className="px-3 py-2 text-right font-medium">总供货额</th>

                </tr>

              </thead>

              <tbody>

                {rows.map(r => (

                  <tr key={r.code} className="border-b border-slate-50 hover:bg-slate-50">

                    <td className="px-3 py-2"><div className="font-medium text-slate-700">{r.name}</div><div className="text-xs text-slate-400">{r.code} · {r.cat}</div></td>

                    <td className="px-3 py-2 text-right tabular-nums">{fmtNum(r.totalQty)}</td>

                    <td className="px-3 py-2 text-right tabular-nums text-slate-600">¥{fmtMoney(r.realizedSupply)}</td>

                    <td className="px-3 py-2 text-right tabular-nums text-slate-600">¥{fmtMoney(r.potentialSupply)}</td>

                    <td className="px-3 py-2 text-right tabular-nums font-semibold">¥{fmtMoney(r.totalSupply)}</td>

                  </tr>

                ))}

                <tr className="border-t-2 border-slate-200 bg-slate-50 font-semibold">

                  <td className="px-3 py-2">总计</td>

                  <td className="px-3 py-2 text-right tabular-nums">{fmtNum(totalSum.totalQty)}</td>

                  <td className="px-3 py-2 text-right tabular-nums">¥{fmtMoney(totalSum.realizedSupply)}</td>

                  <td className="px-3 py-2 text-right tabular-nums">¥{fmtMoney(totalSum.potentialSupply)}</td>

                  <td className="px-3 py-2 text-right tabular-nums">¥{fmtMoney(totalSum.totalSupply)}</td>

                </tr>

              </tbody>

            </table>

          </div>

/* ================= Activity ROI Engine V3 ================= */

const safePct = (v, digits = 1) => {
  const n = Number(v);
  if (!Number.isFinite(n)) return '—';
  return (n * 100).toFixed(digits) + '%';
};

const fmtROI = (v, digits = 2) => {
  if (v === Infinity) return '∞';
  const n = Number(v);
  if (!Number.isFinite(n)) return '—';
  return n.toFixed(digits) + 'x';
};

const ROI_CONFIG = {
  baselinePeriods: 8,
  postPeriods: 4,
  // 罗盘内部管理规则：有效增量 = 活动窗口增量 × (50% + 50% × 持续性)
  baseEffectiveFactor: 0.50,
  persistenceWeight: 0.50,
  // 管理评级阈值，仅用于内部决策，不代表行业标准
  gradeThresholds: { S: 5, A: 3, B: 2, C: 1 }
};

// v3.2（规则十五）：兆丰罗盘内部经营阈值，仅用于内部经营判断，不代表中国跨境保健品行业统一标准
const ACTIVITY_ECONOMIC_CONFIG = {
  brandIncrementalNetMargin: { loss: 0, weak: 0.05, acceptable: 0.10, good: 0.15 },
  incrementalProfitInvestment: { loss: 0, low: 0.20, acceptable: 0.50, good: 1.00 },
  distributorIncrementalNetMargin: { loss: 0, low: 0.02, acceptable: 0.05, good: 0.08 }
};
const ECON_TIER_LABELS = {
  brandIncrementalNetMargin: ['亏损', '盈利很弱', '可接受', '良好', '优秀'],
  incrementalProfitInvestment: ['亏损', '低效', '可接受', '良好', '优秀'],
  distributorIncrementalNetMargin: ['亏损', '极低', '可接受', '良好', '优秀']
};
const ECON_TIER_COLORS = ['#dc2626', '#ea580c', '#ca8a04', '#0d9488', '#16a34a'];
// 返回 { idx, label, color }；value 非有限数时返回 null（null-safe，规则二十一）
function econTier(configKey, value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return null;
  const th = ACTIVITY_ECONOMIC_CONFIG[configKey];
  if (!th) return null;
  const cut1 = th.weak !== undefined ? th.weak : th.low;
  let idx;
  if (n < th.loss) idx = 0;
  else if (n < cut1) idx = 1;
  else if (n < th.acceptable) idx = 2;
  else if (n < th.good) idx = 3;
  else idx = 4;
  return { idx, label: ECON_TIER_LABELS[configKey][idx], color: ECON_TIER_COLORS[idx] };
}

function sumArr(arr) {
  return (arr || []).reduce((total, value) => total + Number(value || 0), 0);
}
function avgArr(arr) {
  if (!arr || arr.length === 0) return 0;
  return sumArr(arr) / arr.length;
}
function safeDiv(a, b) {
  if (!b || b === 0) return Infinity;
  return a / b;
}
function r2(v, d = 2) {
  const n = Number(v);
  if (n === Infinity) return Infinity;
  if (!Number.isFinite(n)) return 0;
  const decimals = Number.isFinite(Number(d)) ? Number(d) : 2;
  const factor = Math.pow(10, decimals);
  return Math.round(n * factor) / factor;
}

/**
 * 活动 ROI 核心口径：
 * GMV = 托盘商卖给 C 端用户的终端纯销 GMV
 * Sell-in 不进入此函数。
 */
function calculateActivityROI(activityGmv) {
  const {
    baselineSales,
    activityWeekSellOut,
    activityWindowSellOut,
    windowPeriods,
    postActivitySales,
    postPeriodsRequired = ROI_CONFIG.postPeriods,
    brandInvestment,
    activityPriceSubsidy = 0,
    consumerPriceSubsidy,
    distributorRebate
  } = activityGmv;

  /* ---------- 1. Baseline ---------- */
  const validBaseline = (baselineSales || []).map(Number).filter(v => Number.isFinite(v));
  const baselineWeekly = r2(avgArr(validBaseline), 2);

  /* ---------- 2. 活动周 ---------- */
  const actualWeek = Number(activityWeekSellOut || 0);
  const weekIncremental = Math.max(0, actualWeek - baselineWeekly);
  const weekLift = safeDiv(actualWeek, baselineWeekly);
  const weekIncRate = safeDiv(weekIncremental, baselineWeekly);

  /* ---------- 3. 活动窗口 ---------- */
  const winPeriods = Math.max(1, Number(windowPeriods || 1));
  const winBaseline = baselineWeekly * winPeriods;
  const winActual = Number(activityWindowSellOut || 0);
  const winIncremental = Math.max(0, winActual - winBaseline);
  const winLift = safeDiv(winActual, winBaseline);
  const winIncRate = safeDiv(winIncremental, winBaseline);
  const windowWeeklyIncremental = safeDiv(winIncremental, winPeriods);

  /* ---------- 4. 活动后持续性（时间标准化） ---------- */
  const postSales = (postActivitySales || []).map(Number).filter(v => Number.isFinite(v));
  const postBaselineVal = baselineWeekly * postSales.length;
  const postActual = sumArr(postSales);

  // 允许负增量，反映活动透支
  const postNetIncremental = postSales.reduce((total, sale) => total + (sale - baselineWeekly), 0);
  const postWeeklyIncremental = postSales.length > 0 ? postNetIncremental / postSales.length : 0;

  let persistenceRate = 0;
  if (windowWeeklyIncremental > 0) {
    persistenceRate = postWeeklyIncremental / windowWeeklyIncremental;
  }
  persistenceRate = Math.min(1, Math.max(-1, persistenceRate));

  /* ---------- 5. 有效增量（管理规则） ---------- */
  const effectiveFactor = ROI_CONFIG.baseEffectiveFactor + ROI_CONFIG.persistenceWeight * Math.max(0, persistenceRate);
  const effectiveIncremental = winIncremental * effectiveFactor;

  /* ---------- 6. 品牌真实投入（消费者补贴与托盘商返利拆开；旧 activityPriceSubsidy 兼容归入消费者补贴，不重复计算） ---------- */
  const baseInvestment = Math.max(0, Number(brandInvestment || 0));
  const legacySubsidy = Math.max(0, Number(activityPriceSubsidy || 0));
  const hasNewSubsidyFields = consumerPriceSubsidy !== undefined || distributorRebate !== undefined;
  const consumerSubsidyVal = hasNewSubsidyFields ? Math.max(0, toSafeNum(consumerPriceSubsidy, 0)) : legacySubsidy;
  const rebateVal = hasNewSubsidyFields ? Math.max(0, toSafeNum(distributorRebate, 0)) : 0;
  const totalBrandInvestment = baseInvestment + consumerSubsidyVal + rebateVal;

  /* ---------- 7. ROI ---------- */
  const roi = totalBrandInvestment > 0 ? effectiveIncremental / totalBrandInvestment : Infinity;
  const costRate = effectiveIncremental > 0 ? totalBrandInvestment / effectiveIncremental : 0;
  const costRatePct = costRate * 100;

  /* ---------- 8. 观察期完整性 ---------- */
  const requiredPostPeriods = Math.max(1, Number(postPeriodsRequired || ROI_CONFIG.postPeriods));
  const observationComplete = postSales.length >= requiredPostPeriods;

  /* ---------- 9. 评级（仅根据 ROI） ---------- */
  let grade = 'D', label = '无效', recommendation = '原则上停止品牌投入';

  if (!observationComplete) {
    grade = '—'; label = '观察不足'; recommendation = `活动后仅观察 ${postSales.length}/${requiredPostPeriods} 周，暂不进行最终评级`;
  } else if (roi >= ROI_CONFIG.gradeThresholds.S) {
    grade = 'S'; label = '优秀'; recommendation = '建议加大同类活动投入';
  } else if (roi >= ROI_CONFIG.gradeThresholds.A) {
    grade = 'A'; label = '良好'; recommendation = '建议保持合作并复制活动机制';
  } else if (roi >= ROI_CONFIG.gradeThresholds.B) {
    grade = 'B'; label = '一般'; recommendation = '可以继续，但要求优化活动成本与执行';
  } else if (roi >= ROI_CONFIG.gradeThresholds.C) {
    grade = 'C'; label = '偏弱'; recommendation = '限制品牌投入，要求提升终端纯销效率';
  }

  return {
    baseline: { weeklySellOut: baselineWeekly, periods: validBaseline.length },
    activityWeek: { activityWeekSellOut: r2(actualWeek), activityWeekBaseline: r2(baselineWeekly), activityWeekIncremental: r2(weekIncremental), activityWeekLift: r2(weekLift, 3), activityWeekIncrementalRate: r2(weekIncRate, 4) },
    activityWindow: { windowPeriods: winPeriods, windowActualSellOut: r2(winActual), windowBaselineSellOut: r2(winBaseline), windowIncrementalSellOut: r2(winIncremental), windowWeeklyIncremental: r2(windowWeeklyIncremental), windowLift: r2(winLift, 3), windowIncrementalRate: r2(winIncRate, 4) },
    postActivity: { postPeriods: postSales.length, postPeriodsRequired: requiredPostPeriods, postActualSellOut: r2(postActual), postBaselineSellOut: r2(postBaselineVal), postNetIncrementalSellOut: r2(postNetIncremental), postWeeklyIncremental: r2(postWeeklyIncremental), persistenceRate: r2(persistenceRate, 4), observationComplete },
    effectiveIncremental: { persistenceRate: r2(persistenceRate, 4), effectiveFactor: r2(effectiveFactor, 4), effectiveIncrementalSellOut: r2(effectiveIncremental) },
    investment: { brandInvestment: r2(baseInvestment), activityPriceSubsidy: r2(legacySubsidy), consumerPriceSubsidy: r2(consumerSubsidyVal), distributorRebate: r2(rebateVal), totalBrandInvestment: r2(totalBrandInvestment) },
    return: { incrementalSellOutROI: roi === Infinity ? Infinity : r2(roi), incrementalCostRate: r2(costRate, 4), incrementalCostRatePercent: r2(costRatePct, 2) },
    evaluation: { grade, label, recommendation }
  };
}
