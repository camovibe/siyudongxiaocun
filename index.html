/* ================= Activity ROI Engine V3 ================= */

const safePct = (value, digits = 1) => {
  const n = toMetricNumber(value);
  return n === null ? '—' : (n * 100).toFixed(digits) + '%';
};

// v3.5：保留 Infinity→'∞'（活动 ROI 的 safeDiv 语义），缺失显示 —
const fmtROI = (value, digits = 2) => {
  if (value === Infinity) return '∞';
  const n = toMetricNumber(value);
  return n === null ? '—' : n.toFixed(digits) + 'x';
};

const ROI_CONFIG = {
  baselinePeriods: 8,
  postPeriods: 4,
  // 罗盘内部管理规则：有效增量 = 活动窗口增量 × (50% + 50% × 持续性)
  baseEffectiveFactor: 0.50,
  persistenceWeight: 0.50,
  // 管理评级阈值，仅用于内部决策，不代表行业标准
  gradeThresholds: { S: 5, A: 3, B: 2, C: 1 }
};

// v3.2（规则十五）：兆丰罗盘内部经营阈值，仅用于内部经营判断，不代表中国跨境保健品行业统一标准
const ACTIVITY_ECONOMIC_CONFIG = {
  brandIncrementalNetMargin: { loss: 0, weak: 0.05, acceptable: 0.10, good: 0.15 },
  incrementalProfitInvestment: { loss: 0, low: 0.20, acceptable: 0.50, good: 1.00 },
  distributorIncrementalNetMargin: { loss: 0, low: 0.02, acceptable: 0.05, good: 0.08 }
};
const ECON_TIER_LABELS = {
  brandIncrementalNetMargin: ['亏损', '盈利很弱', '可接受', '良好', '优秀'],
  incrementalProfitInvestment: ['亏损', '低效', '可接受', '良好', '优秀'],
  distributorIncrementalNetMargin: ['亏损', '极低', '可接受', '良好', '优秀']
};
const ECON_TIER_COLORS = ['#dc2626', '#ea580c', '#ca8a04', '#0d9488', '#16a34a'];
// 返回 { idx, label, color }；value 非有限数时返回 null（null-safe，规则二十一）
function econTier(configKey, value) {
  const n = toMetricNumber(value);
  if (n === null) return null;
  const th = ACTIVITY_ECONOMIC_CONFIG[configKey];
  if (!th) return null;
  const cut1 = th.weak !== undefined ? th.weak : th.low;
  let idx;
  if (n < th.loss) idx = 0;
  else if (n < cut1) idx = 1;
  else if (n < th.acceptable) idx = 2;
  else if (n < th.good) idx = 3;
  else idx = 4;
  return { idx, label: ECON_TIER_LABELS[configKey][idx], color: ECON_TIER_COLORS[idx] };
}

function sumArr(arr) {
  return (arr || []).reduce((total, value) => total + Number(value || 0), 0);
}
function avgArr(arr) {
  if (!arr || arr.length === 0) return 0;
  return sumArr(arr) / arr.length;
}
// v3.6：有限分子 + 有限且 >0 分母才计算比率，否则 null；零分母不再返回 Infinity
function safeDiv(a, b) {
  const x = Number(a), y = Number(b);
  if (!Number.isFinite(x) || !Number.isFinite(y) || y <= 0) return null;
  return x / y;
}
// v3.6：null/NaN 不再被压成 0；内部计算保留精度，仅在展示时取小数
function r2(v, d = 2) {
  if (v === null || v === undefined) return null;
  const n = Number(v);
  if (n === Infinity) return Infinity;
  if (!Number.isFinite(n)) return null;
  const decimals = Number.isFinite(Number(d)) ? Number(d) : 2;
  const factor = Math.pow(10, decimals);
  return Math.round(n * factor) / factor;
}

/**
 * 活动 ROI 核心口径（v3.6 数学边界修正版）：
 * GMV = 托盘商卖给 C 端用户的终端纯销 GMV；Sell-in 不进入此函数。
 * 边界规则：
 * - 零基线：Lift / 相对增长率 = null，绝对增量仍可算，调用侧标记 baseline_zero；
 * - 投入 ≤0：ROI = null，Grade = '—'，状态 investment_not_applicable，不得得到 Infinity 或 S；
 * - 有投入但有效正增量 = 0：ROI = 0，incrementalCostRate = null，状态 no_positive_increment；
 * - 无可用 Post：persistenceRate = null，有效因子退回基础值给暂估 ROI，标记 provisional；
 * - 窗口完整观察但无正增量：persistenceRate = null（分母无正增量），ROI 可以为 0；
 * - 窗口未满：只按已观察周与Baseline同口径对比，标记暂估，不出最终结论。
 */
function calculateActivityROI(input) {
  const {
    baselineSales,
    activityWeekSellOut,
    activityWindowSellOut,
    windowObservedWeeks,
    windowPeriods,
    postActivitySales,
    postPeriodsRequired = ROI_CONFIG.postPeriods,
    postCalendarAvailable,
    postMissingWeeks = 0,
    brandInvestment,
    activityPriceSubsidy = 0,
    consumerPriceSubsidy,
    distributorRebate
  } = input;

  /* ---------- 1. Baseline ---------- */
  const validBaseline = (baselineSales || []).map(Number).filter(v => Number.isFinite(v));
  const baselineWeekly = validBaseline.length > 0 ? r2(avgArr(validBaseline), 2) : null;
  const baselineZero = baselineWeekly !== null && baselineWeekly <= 0;
  const bw = baselineWeekly || 0;

  /* ---------- 2. 活动周 ---------- */
  const actualWeek = Number.isFinite(Number(activityWeekSellOut)) ? Number(activityWeekSellOut) : 0;
  const weekNetIncremental = actualWeek - bw;
  const weekIncremental = Math.max(0, weekNetIncremental);
  const weekLift = (baselineWeekly === null || baselineZero) ? null : safeDiv(actualWeek, baselineWeekly);
  const weekIncRate = (baselineWeekly === null || baselineZero) ? null : safeDiv(weekIncremental, baselineWeekly);

  /* ---------- 3. 活动窗口（只按已观察周与 Baseline 同口径对比；窗口未满 = 暂估） ---------- */
  const winPeriods = Math.max(1, Number(windowPeriods || 1));
  const observedW = Math.max(0, Math.min(winPeriods, Number.isFinite(Number(windowObservedWeeks)) ? Number(windowObservedWeeks) : winPeriods));
  const winActual = Number.isFinite(Number(activityWindowSellOut)) ? Number(activityWindowSellOut) : 0;
  const winBaselineFull = bw * winPeriods;
  const winBaselineMatched = bw * observedW;
  const windowFullyObserved = observedW >= winPeriods;
  const winNetIncremental = winActual - winBaselineMatched;   // 有符号净增量（同口径已观察周）
  const winIncremental = Math.max(0, winNetIncremental);      // 正增量（管理规则）
  const winLift = (baselineWeekly === null || baselineZero || observedW === 0) ? null : safeDiv(winActual, winBaselineMatched);
  const winIncRate = (baselineWeekly === null || baselineZero) ? null : safeDiv(winIncremental, winBaselineMatched);
  const windowWeeklyIncremental = observedW > 0 ? winIncremental / observedW : null;

  /* ---------- 4. 活动后持续性（时间标准化；缺失周不按 0 计入，真实 0 销量周计入） ---------- */
  const postSales = (postActivitySales || []).map(Number).filter(v => Number.isFinite(v));
  const postBaselineVal = bw * postSales.length;
  const postActual = sumArr(postSales);
  // 允许负增量，反映活动透支
  const postNetIncremental = postSales.reduce((total, sale) => total + (sale - bw), 0);
  const postWeeklyIncremental = postSales.length > 0 ? postNetIncremental / postSales.length : null;

  let persistenceRate = null;
  if (postSales.length > 0 && windowWeeklyIncremental !== null && windowWeeklyIncremental > 0) {
    persistenceRate = postWeeklyIncremental / windowWeeklyIncremental;
    persistenceRate = Math.min(1, Math.max(-1, persistenceRate));
  }
  // 无可用 Post / 窗口无正增量 → persistenceRate 保持 null，不以 0 冒充已观察结果

  /* ---------- 5. 有效增量（管理规则；无 Post 时退回基础有效因子，给出暂估 ROI 并标记 provisional） ---------- */
  const roiProvisional = persistenceRate === null;
  const effectiveFactor = persistenceRate === null
    ? ROI_CONFIG.baseEffectiveFactor
    : ROI_CONFIG.baseEffectiveFactor + ROI_CONFIG.persistenceWeight * Math.max(0, persistenceRate);
  const effectiveIncremental = winIncremental * effectiveFactor;

  /* ---------- 6. 品牌真实投入（消费者补贴与托盘商返利拆开；旧 activityPriceSubsidy 兼容归入消费者补贴，不重复计算） ---------- */
  const baseInvestment = Math.max(0, Number(brandInvestment || 0));
  const legacySubsidy = Math.max(0, Number(activityPriceSubsidy || 0));
  const hasNewSubsidyFields = consumerPriceSubsidy !== undefined || distributorRebate !== undefined;
  const consumerSubsidyVal = hasNewSubsidyFields ? Math.max(0, toSafeNum(consumerPriceSubsidy, 0)) : legacySubsidy;
  const rebateVal = hasNewSubsidyFields ? Math.max(0, toSafeNum(distributorRebate, 0)) : 0;
  const totalBrandInvestment = baseInvestment + consumerSubsidyVal + rebateVal;

  /* ---------- 7. ROI 与状态 ---------- */
  let roi = null, costRate = null, roiStatus = 'ok';
  if (totalBrandInvestment <= 0) {
    roiStatus = 'investment_not_applicable';          // 无有效投入，ROI 不适用，不得 Infinity 或 S
  } else if (effectiveIncremental <= 0) {
    roi = 0; roiStatus = 'no_positive_increment';     // 有投入但无正增量：ROI=0，成本率不可计算
  } else {
    roi = effectiveIncremental / totalBrandInvestment;
    costRate = totalBrandInvestment / effectiveIncremental;
  }

  /* ---------- 8. 观察期完整性（日历有周 ≠ 数据已上传；缺周不得显示已完成） ---------- */
  const requiredPostPeriods = Math.max(1, Number(postPeriodsRequired || ROI_CONFIG.postPeriods));
  const calendarAvail = postCalendarAvailable !== undefined ? Number(postCalendarAvailable) : postSales.length;
  const observationComplete = calendarAvail >= requiredPostPeriods
    && postSales.length >= requiredPostPeriods
    && Number(postMissingWeeks || 0) === 0;

  /* ---------- 9. 评级（仅最终态给级；暂估/无投入一律 '—'，不得仅凭无限 Lift 给好评级） ---------- */
  let grade = 'D', label = '无效', recommendation = '原则上停止品牌投入';

  if (roiStatus === 'investment_not_applicable') {
    grade = '—'; label = '无有效投入'; recommendation = '无有效投入，ROI 不适用';
  } else if (roiStatus === 'no_positive_increment') {
    grade = 'D'; label = '无效'; recommendation = '活动未产生有效正增量，原则上停止品牌投入';
  } else if (!observationComplete) {
    grade = '—'; label = '观察不足'; recommendation = `活动后仅观察 ${postSales.length}/${requiredPostPeriods} 周，暂不进行最终评级`;
  } else if (roi >= ROI_CONFIG.gradeThresholds.S) {
    grade = 'S'; label = '优秀'; recommendation = '建议加大同类活动投入';
  } else if (roi >= ROI_CONFIG.gradeThresholds.A) {
    grade = 'A'; label = '良好'; recommendation = '建议保持合作并复制活动机制';
  } else if (roi >= ROI_CONFIG.gradeThresholds.B) {
    grade = 'B'; label = '一般'; recommendation = '可以继续，但要求优化活动成本与执行';
  } else if (roi >= ROI_CONFIG.gradeThresholds.C) {
    grade = 'C'; label = '偏弱'; recommendation = '限制品牌投入，要求提升终端纯销效率';
  }

  return {
    baseline: { weeklySellOut: baselineWeekly, periods: validBaseline.length, zero: baselineZero },
    activityWeek: { activityWeekSellOut: r2(actualWeek), activityWeekBaseline: baselineWeekly, activityWeekIncremental: r2(weekIncremental), activityWeekNetIncremental: r2(weekNetIncremental), activityWeekLift: weekLift === null ? null : r2(weekLift, 3), activityWeekIncrementalRate: weekIncRate === null ? null : r2(weekIncRate, 4) },
    activityWindow: { windowPeriods: winPeriods, observedWeeks: observedW, fullyObserved: windowFullyObserved, windowActualSellOut: r2(winActual), windowBaselineSellOut: r2(winBaselineMatched), windowBaselineFullSellOut: r2(winBaselineFull), windowIncrementalSellOut: r2(winIncremental), windowNetIncrementalSellOut: r2(winNetIncremental), windowWeeklyIncremental: windowWeeklyIncremental === null ? null : r2(windowWeeklyIncremental), windowLift: winLift === null ? null : r2(winLift, 3), windowIncrementalRate: winIncRate === null ? null : r2(winIncRate, 4) },
    postActivity: { postPeriods: postSales.length, postPeriodsRequired: requiredPostPeriods, postActualSellOut: r2(postActual), postBaselineSellOut: r2(postBaselineVal), postNetIncrementalSellOut: r2(postNetIncremental), postWeeklyIncremental: postWeeklyIncremental === null ? null : r2(postWeeklyIncremental), persistenceRate: persistenceRate === null ? null : r2(persistenceRate, 4), observationComplete, missingWeeks: Number(postMissingWeeks || 0) },
    effectiveIncremental: { persistenceRate: persistenceRate === null ? null : r2(persistenceRate, 4), effectiveFactor: r2(effectiveFactor, 4), effectiveIncrementalSellOut: r2(effectiveIncremental), provisional: roiProvisional },
    investment: { brandInvestment: r2(baseInvestment), activityPriceSubsidy: r2(legacySubsidy), consumerPriceSubsidy: r2(consumerSubsidyVal), distributorRebate: r2(rebateVal), totalBrandInvestment: r2(totalBrandInvestment) },
    return: { incrementalSellOutROI: roi === null ? null : (roi === Infinity ? Infinity : r2(roi)), incrementalCostRate: costRate === null ? null : r2(costRate, 4), incrementalCostRatePercent: costRate === null ? null : r2(costRate * 100, 2), status: roiStatus, provisional: roiProvisional },
    evaluation: { grade, label, recommendation }
  };
}

/* ================= v3.6：经营质量 / 风险 / 结论（全局，供核心与 UI 同源使用） ================= */

// 经营质量分类：X=Incremental ROI（1x 增量销售效率参考线，非利润回本线），Y=Persistence（0 为界）
const classifyQuality = (roiVal, persistVal) => {
  if (persistVal === null || persistVal === undefined) return null;
  const p = Number(persistVal);
  if (!Number.isFinite(p)) return null;
  if (toMetricNumber(roiVal) === null) return null;
  const roiHigh = Number(roiVal) >= 1;
  const persistHigh = p >= 0;
  if (roiHigh && persistHigh) return 'strategic';
  if (roiHigh && !persistHigh) return 'explosive';
  if (!roiHigh && persistHigh) return 'cultivation';
  return 'consumptive';
};
const QUALITY_META = {
  strategic: { label: '战略型活动', desc: '当期增量效率高，活动结束后仍能保留增量', color: '#16a34a' },
  explosive: { label: '爆发型活动', desc: '活动期间有效，但持续性弱，可能为一次性促销/节点驱动', color: '#ea580c' },
  cultivation: { label: '培育型活动', desc: '当期投放效率一般，但对渠道/用户/销售持续性存在价值', color: '#0d9488' },
  consumptive: { label: '消耗型活动', desc: '既没有明显增量效率，也没有形成持续增长', color: '#dc2626' }
};
// v3.6（规则五）：风险与状态多标签并存，不压缩成单一字段
const RISK_META = {
  normal: { label: '正常', color: '#16a34a' },
  brand_total_loss: { label: '风险：品牌整体贡献为负', color: '#dc2626' },
  brand_incremental_loss: { label: '风险：品牌增量贡献为负', color: '#dc2626' },
  baseline_insufficient: { label: 'Baseline不足', color: '#d97706' },
  baseline_zero: { label: '零基线/新渠道参考', color: '#d97706' },
  window_incomplete: { label: '窗口未满', color: '#d97706' },
  window_data_missing: { label: '窗口数据缺失', color: '#d97706' },
  post_data_missing: { label: '观察期缺周', color: '#d97706' },
  observing: { label: '观察中', color: '#2563eb' },
  price_missing: { label: '价格缺失', color: '#d97706' },
  coverage_unknown: { label: '完整性未确认', color: '#9333ea' },
  attribution_overlap: { label: '归因重叠', color: '#dc2626' },
  investment_not_applicable: { label: '无有效投入', color: '#94a3b8' },
  no_positive_increment: { label: '无正增量', color: '#dc2626' }
};

// 自动经营结论（规则六）：最终结论必须满足 窗口完整 + Baseline可用 + Post完成 + 数据完整性已确认 + 引用利润字段可靠；
// 不满足时只给「暂估/待补数据」，不得给「可复制」「持续性强」
const buildConclusion = ({ roiVal, persistVal, brandNet, distEconNet, finalAllowed, caveat }) => {
  if (!finalAllowed) {
    return (caveat ? caveat + '。' : '') + '暂估/待补数据：窗口、Baseline、观察期或数据完整性未全部确认，暂不出具最终经营结论。';
  }
  const roiKnown = toMetricNumber(roiVal) !== null;
  const p = (persistVal === null || persistVal === undefined) ? null : Number(persistVal);
  if (!roiKnown && p === null) return null;
  const roiHigh = roiKnown && Number(roiVal) >= 1;
  const persistHigh = p !== null && p > 0;
  const persistNeg = p !== null && p < 0;
  const brandOk = Number(brandNet) > 0;
  const distOk = Number(distEconNet) > 0;
  if (p === null) return '效率与利润已测算，但持续性不可计算（观察期无有效数据或窗口无正增量），不出具持续性结论。';
  if (roiHigh && persistHigh && brandOk && distOk) return '优质活动：增量效率高、活动结束后保留正向增量，且品牌与托盘商均保持正向经济收益，具备复制价值。';
  if (roiHigh && persistHigh && !brandOk) return '高效率但低经济质量：活动带来了明显增量与持续性，但品牌最终净利为负，应优先检查活动投入及补贴结构。';
  if (roiHigh && !persistHigh && brandOk) return '爆发型活动：活动期增量效率较高，但活动后回到 Baseline 附近或更低，更适合节点型活动，不宜直接判断为长期增长引擎。';
  if (!roiHigh && persistHigh && brandOk) return '培育型活动：短期效率一般，但活动后的销售保持较好，建议从长期渠道价值而非单场ROI判断。';
  if (!roiHigh && persistNeg && !brandOk) return '消耗型活动：短期没有形成有效增量，活动后低于 Baseline 存在透支信号，同时品牌净利为负，应考虑停止或重构。';
  if (!roiHigh && !persistHigh) return '短期增量效率与活动后持续性均偏弱，建议复盘活动机制与投入结构后再决定是否继续。';
  if (!roiHigh && persistHigh) return '培育型活动：短期效率一般，活动后保持一定增量，但需关注品牌净利水平，避免以补贴维持表面持续性。';
  return '效率与经济结果不完全同向：建议结合增量利润与双方净利结构进一步复盘。';
};

/**
 * v3.6：活动分析纯计算核心（无 React 依赖，可单测）。
 * 数据状态规则（规则一）：
 * - 显式合法 gmv:0 / sales:0 / vol:0 为真实 0；null / undefined / 空对象 / 空字符串为缺失；
 * - GMV 与销量分别判断，存在其一不代表另一个也存在；
 * - 缺失 SKU 行只有在 dataCoverage 元数据 complete + 覆盖该 SKU + missingMeansZero=true 时才解释为 0；
 * - 不用「整周任意一个 SKU 有行」直接证明完整；旧数据无元数据 → unknown，不自动盖章 complete；
 * - 元数据不完整但所有选中 SKU 必要字段均有显式合法记录时，按该选定范围判定完整（规则八）；
 * - 稀疏假设测算结果一律 reliability='assumed'，标注「按稀疏数据假设测算，完整性未确认」，
 *   不进最终评级、最终质量分类与正式汇总。
 */
function calculateActivityCore(input) {
  const { act, PERIODS, skuMaster, skuWeeks, channelSkuWeekly, cost, supply, opRate, dataCoverage, activities, hasChannelSkuData } = input;
  let startIdx = act.startPeriodId ? PERIODS.findIndex(p => p.id === act.startPeriodId) : -1;
  if (startIdx < 0) startIdx = PERIODS.findIndex(p => p.label === act.startWeek); // 旧活动 label 兜底
  if (startIdx < 0) return { error: `起始周 "${act.startWeek}" 不在时间轴中，当前可用周期：${PERIODS.map(p => p.label).join('、')}`, status: 'invalid' };

  const activityChannel = act.activityChannel || 'ALL';
  const isAllChannels = !activityChannel || activityChannel === 'ALL';
  const cov = dataCoverage || {};

  const validSkus = (act.skuMode === 'all' ? skuMaster.map(s => s.code) : (act.skuCodes || []))
    .filter(code => skuMaster.some(s => s.code === code));
  if (validSkus.length === 0) return { error: '未选择有效 SKU', status: 'invalid' };
  const skuScopeNote = act.skuMode === 'all' ? 'skuMode=all 按活动保存时的 SKU 范围处理；历史无快照，按当前主数据展开' : null;

  if (!isAllChannels && hasChannelSkuData) {
    let hasAnyData = false;
    for (const code of validSkus) {
      for (let i = 0; i < PERIODS.length; i++) {
        const cell = channelSkuWeekly?.[code]?.[activityChannel]?.[i];
        if (cell && typeof cell === 'object') { hasAnyData = true; break; }
      }
      if (hasAnyData) break;
    }
    if (!hasAnyData) {
      return {
        error: `该平台（${activityChannel}）暂无 SKU 周度终端纯销数据，无法计算该活动 ROI。请先上传该平台的 SKU×周度数据。`,
        status: 'invalid',
        diagnosis: { startWeek: act.startWeek, startIdx, activityChannel, validSkuCount: validSkus.length, baselineAvailable: 0, baselineRequired: act.baselinePeriods, actualBaselinePeriods: 0, windowAvailable: 0, windowRequired: act.windowPeriods, postAvailable: 0, postRequired: act.postPeriods, baselineWeeks: [], baselineSkipped: [], windowWeeks: [], postWeeks: [], missingPeriods: [], overlapWarnings: [], pollutionWarnings: [] }
      };
    }
  }

  /* ---------- 统一周对象（规则二）：baseline / window / post 同一构造器、同一有效周定义 ---------- */
  const cellOf = (code, idx) => isAllChannels ? skuWeeks?.[code]?.[idx] : channelSkuWeekly?.[code]?.[activityChannel]?.[idx];
  const covMetaAt = (idx) => {
    const p = PERIODS[idx];
    if (!p) return null;
    const pid = p.id, label = p.label;
    return isAllChannels
      ? ((pid && cov.skuWeeks?.[pid]) || cov.skuWeeks?.[label] || null)
      : ((pid && cov.channelSkuWeekly?.[activityChannel]?.[pid]) || cov.channelSkuWeekly?.[activityChannel]?.[label] || null);
  };
  const buildWeek = (idx) => {
    const label = PERIODS[idx]?.label;
    const meta = covMetaAt(idx);
    const metaSanctioned = !!(meta && meta.status === 'complete' && meta.missingMeansZero === true);
    let gmv = 0, sales = 0, distCOGS = 0, brandCOGS = 0, anyRecord = false;
    let gmvComplete = true, salesComplete = true;
    const missingSkus = [], missingFields = [], missingPrices = [];
    validSkus.forEach(code => {
      const cell = cellOf(code, idx);
      const hasCell = !!(cell && typeof cell === 'object');
      const sanctioned = !hasCell && metaSanctioned && Array.isArray(meta.coveredSkuCodes) && meta.coveredSkuCodes.includes(code);
      if (!hasCell && !sanctioned) {
        missingSkus.push(code); gmvComplete = false; salesComplete = false;
        return; // 缺失 ≠ 0：未盖章的缺失行不贡献数值
      }
      const g = hasCell ? toMetricNumber(cell.gmv) : 0;
      const sv = hasCell ? toMetricNumber(isAllChannels ? cell.sales : (cell.vol !== undefined ? cell.vol : cell.sales)) : 0;
      if (hasCell) anyRecord = true;
      if (g === null) { missingFields.push(code + ':gmv'); gmvComplete = false; } else gmv += g;
      if (sv === null) { missingFields.push(code + ':sales'); salesComplete = false; } else {
        sales += sv;
        const sp = toMetricNumber(supply?.[code]);
        const cp = toMetricNumber(cost?.[code]);
        if (sp === null) { if (sv > 0) missingPrices.push(code + ':supply'); } else distCOGS += sp * sv;
        if (cp === null) { if (sv > 0) missingPrices.push(code + ':cost'); } else brandCOGS += cp * sv;
      }
    });
    // 经济性完整性（规则三）：有销量 SKU 的价格必须齐全，缺失不以 0 或估算价代替
    const salesFieldMissing = missingFields.some(f => f.endsWith(':sales'));
    const distEconComplete = !salesFieldMissing && !missingPrices.some(p => p.endsWith(':supply'));
    const brandEconComplete = distEconComplete && !missingPrices.some(p => p.endsWith(':cost'));
    let status;
    if (!anyRecord && !metaSanctioned) status = 'unknown';        // 完整性未知（整周无记录且未盖章）
    else if (!anyRecord && metaSanctioned) status = 'zero';       // 明确零销量（元数据确认）
    else if (!gmvComplete || !salesComplete) status = 'partial';  // 部分缺失
    else status = (gmv === 0 && sales === 0) ? 'zero' : 'complete'; // 完整（规则八：显式记录齐全）
    return { periodId: label, idx, gmv, sales, distCOGS, brandCOGS,
      gmvComplete, salesComplete, distEconComplete, brandEconComplete,
      economicsComplete: distEconComplete && brandEconComplete,
      missingSkus, missingFields, missingPrices, anyRecord, status,
      usable: anyRecord || metaSanctioned };
  };

  const winP = Math.max(1, Number(act.windowPeriods) || 1);
  const postP = Math.max(1, Number(act.postPeriods) || 1);

  /* ---------- Baseline：向前寻找最近 N 个有效周，返回实际使用与跳过的周期（规则二） ---------- */
  const actualBaselinePeriods = Math.min(Number(act.baselinePeriods) || ROI_CONFIG.baselinePeriods, startIdx);
  const baselineWeeks = [], baselineSkipped = [];
  for (let i = startIdx - 1; i >= 0 && baselineWeeks.length < actualBaselinePeriods; i--) {
    const w = buildWeek(i);
    if (w.usable) baselineWeeks.push(w); else baselineSkipped.push(w);
  }
  baselineWeeks.reverse(); // 时间正序
  const baselineSales = baselineWeeks.map(w => w.gmv);
  const blN = baselineWeeks.length;
  const baselineReliable = blN >= 2; // 少于 2 个有效周不计算可靠增量指标

  /* ---------- Activity Window：区分日历窗口未满与已有周期数据缺失 ---------- */
  const windowWeeks = [];
  let windowCalendarMissing = 0;
  for (let i = startIdx; i < startIdx + winP; i++) {
    if (i >= PERIODS.length) { windowCalendarMissing++; continue; }
    windowWeeks.push(buildWeek(i));
  }
  const windowObserved = windowWeeks.filter(w => w.usable);
  const windowDataMissingWeeks = windowWeeks.filter(w => !w.usable);
  const windowFullyObserved = windowCalendarMissing === 0 && windowDataMissingWeeks.length === 0;
  const windowVal = windowObserved.reduce((t, w) => t + w.gmv, 0);
  const activityWeekSellOut = (windowWeeks.length > 0 && windowWeeks[0].usable) ? windowWeeks[0].gmv : 0;

  /* ---------- Post：时间轴有该周 ≠ 数据已上传；缺失周不按 0 加入，真实 0 销量周必须加入 ---------- */
  const postWeeks = [];
  let postCalendarMissing = 0;
  for (let i = startIdx + winP; i < startIdx + winP + postP; i++) {
    if (i >= PERIODS.length) { postCalendarMissing++; continue; }
    postWeeks.push(buildWeek(i));
  }
  const postObserved = postWeeks.filter(w => w.usable);
  const postMissingWeeks = postWeeks.filter(w => !w.usable);
  const postActivitySales = postObserved.map(w => w.gmv);
  const postCalendarAvailable = postWeeks.length;
  const postCompleteNow = postCalendarMissing === 0 && postObserved.length >= postP && postMissingWeeks.length === 0;

  /* ---------- 经济链聚合（规则三）：GMV 增量不依赖价格；利润按价格可用性分侧返回 null + 原因 ---------- */
  const op = Math.min(90, Math.max(0, toSafeNum(opRate, 0))) / 100;
  const sumAgg = (arr, k) => arr.reduce((t, w) => t + (Number.isFinite(w?.[k]) ? w[k] : 0), 0);
  const wGmv = sumAgg(windowObserved, 'gmv'), wSales = sumAgg(windowObserved, 'sales');
  const wDistCOGS = sumAgg(windowObserved, 'distCOGS'), wBrandCOGS = sumAgg(windowObserved, 'brandCOGS');
  const wSalesMissing = [...new Set(windowObserved.flatMap(w => w.missingFields.filter(f => f.endsWith(':sales'))))];
  const distPriceMissing = [...new Set(windowObserved.flatMap(w => w.missingPrices.filter(p => p.endsWith(':supply'))))];
  const brandPriceMissing = [...new Set(windowObserved.flatMap(w => w.missingPrices))];
  const distEconOK = wSalesMissing.length === 0 && distPriceMissing.length === 0;
  const brandEconOK = distEconOK && brandPriceMissing.length === 0;

  const invest = Math.max(0, toSafeNum(act.brandInvestment, 0));
  const consumerSub = Math.max(0, toSafeNum(act.consumerPriceSubsidy, 0));
  const rebate = Math.max(0, toSafeNum(act.distributorRebate, 0));
  const totalInvest = invest + consumerSub + rebate;

  const marginOf = (p, r) => (Number.isFinite(p) && Number.isFinite(r) && r > 0 ? p / r : null);
  const wDistGross = distEconOK ? wGmv - wDistCOGS : null;
  const wDistNet = distEconOK ? wGmv * (1 - op) - wDistCOGS : null;
  const wDistEconNet = wDistNet === null ? null : wDistNet + rebate;
  const wBrandRevenue = distEconOK ? wDistCOGS : null;
  const wBrandGross = brandEconOK ? wDistCOGS - wBrandCOGS : null;
  const wBrandNet = wBrandGross === null ? null : wBrandGross - invest - consumerSub - rebate;

  // Baseline 周均利润（Baseline 不扣活动投入，规则十四）
  const blGmvW = blN > 0 ? sumAgg(baselineWeeks, 'gmv') / blN : null;
  const blSalesW = blN > 0 ? sumAgg(baselineWeeks, 'sales') / blN : null;
  const blDistCOGSW = blN > 0 ? sumAgg(baselineWeeks, 'distCOGS') / blN : null;
  const blBrandCOGSW = blN > 0 ? sumAgg(baselineWeeks, 'brandCOGS') / blN : null;
  const blDistGrossW = (blN > 0 && distEconOK) ? blGmvW - blDistCOGSW : null;
  const blDistNetW = (blN > 0 && distEconOK) ? blGmvW * (1 - op) - blDistCOGSW : null;
  const blBrandGrossW = (blN > 0 && brandEconOK) ? blDistCOGSW - blBrandCOGSW : null;
  const blBrandNetW = blBrandGrossW;

  // 增量利润：Baseline 周均 × 已观察窗口周数（同口径对比；窗口未满 = 暂估）；Baseline < 2 周不计算
  const canIncremental = baselineReliable;
  const obsN = Math.max(1, windowObserved.length);
  const incDistGross = (canIncremental && wDistGross !== null) ? wDistGross - blDistGrossW * obsN : null;
  const incDistNet = (canIncremental && wDistNet !== null) ? wDistNet - blDistNetW * obsN : null;
  const incDistEconNet = (canIncremental && wDistEconNet !== null) ? wDistEconNet - blDistNetW * obsN : null;
  const incBrandGross = (canIncremental && wBrandGross !== null) ? wBrandGross - blBrandGrossW * obsN : null;
  const incBrandNet = (canIncremental && wBrandNet !== null) ? wBrandNet - blBrandNetW * obsN : null;
  // 增量净利率分母保持现状（不擅自换分母）：品牌=活动供货测算收入；托盘商=活动终端GMV
  const incBrandNetRate = canIncremental ? marginOf(incBrandNet, wBrandRevenue) : null;
  const incDistNetRate = canIncremental ? marginOf(incDistEconNet, wGmv) : null;
  const profitInvestment = (canIncremental && incBrandNet !== null && totalInvest > 0) ? incBrandNet / totalInvest : null;

  // Post Observation 经济：投入只归属活动窗口，Post 不重复扣减
  const pGmv = sumAgg(postObserved, 'gmv'), pSales = sumAgg(postObserved, 'sales');
  const pDistCOGS = sumAgg(postObserved, 'distCOGS'), pBrandCOGS = sumAgg(postObserved, 'brandCOGS');
  const postDistGross = distEconOK ? pGmv - pDistCOGS : null;
  const postDistNet = distEconOK ? pGmv * (1 - op) - pDistCOGS : null;
  const postBrandGross = brandEconOK ? pDistCOGS - pBrandCOGS : null;
  const postBrandNet = postBrandGross;
  const postIncGmv = canIncremental ? pGmv - blGmvW * postObserved.length : null;

  /* ---------- 数据可靠性（规则一.7/八）：完整确认 vs 稀疏假设 ---------- */
  const usedWeeks = [...baselineWeeks, ...windowObserved, ...postObserved];
  const hasUnconfirmedGaps = baselineSkipped.length > 0 || windowDataMissingWeeks.length > 0 || postMissingWeeks.length > 0;
  const allConfirmed = usedWeeks.length > 0 && usedWeeks.every(w => w.status === 'complete' || w.status === 'zero') && !hasUnconfirmedGaps;
  const reliability = allConfirmed ? 'confirmed' : 'assumed';

  /* ---------- 最终结论门控（规则六） ---------- */
  const finalAllowed = reliability === 'confirmed' && windowFullyObserved && baselineReliable && postCompleteNow
    && (wBrandNet !== null || !brandEconOK);

  /* ---------- 风险与状态标签（规则五）：多标签并存，不压缩成单一字段 ---------- */
  const economicRisk = [];
  if (!baselineReliable) economicRisk.push('baseline_insufficient');
  if (blN > 0 && blGmvW !== null && blGmvW <= 0) economicRisk.push('baseline_zero');
  if (windowCalendarMissing > 0) economicRisk.push('window_incomplete');
  if (windowDataMissingWeeks.length > 0) economicRisk.push('window_data_missing');
  if (postCalendarMissing > 0) economicRisk.push('observing');
  if (postMissingWeeks.length > 0) economicRisk.push('post_data_missing');
  if (reliability === 'assumed') economicRisk.push('coverage_unknown');
  if (brandPriceMissing.length > 0) economicRisk.push('price_missing');
  if (totalInvest <= 0) economicRisk.push('investment_not_applicable');
  // 拆分 brand_loss：整体贡献净额 <0 与增量贡献净额 <0 独立判定（验收 G）
  if (wBrandNet !== null && wBrandNet < 0) economicRisk.push('brand_total_loss');
  if (canIncremental && incBrandNet !== null && incBrandNet < 0) economicRisk.push('brand_incremental_loss');

  /* ---------- 活动重叠（规则八）：时间窗口 × 渠道范围 × SKU 范围三项同时重叠才算直接归因重叠 ---------- */
  const thisRange = { s: startIdx, e: startIdx + winP };
  const baselineRange = { s: startIdx - blN, e: startIdx };
  const postRange = { s: startIdx + winP, e: startIdx + winP + postP };
  const rangesOverlap = (a, b) => Math.max(a.s, b.s) < Math.min(a.e, b.e);
  const thisSkuSet = new Set(validSkus);
  const overlapWarnings = [], pollutionWarnings = [];
  let attributionOverlap = false;
  (activities || []).forEach(other => {
    if (!other || other.id === act.id) return;
    let oStart = other.startPeriodId ? PERIODS.findIndex(p => p.id === other.startPeriodId) : -1;
  if (oStart < 0) oStart = PERIODS.findIndex(p => p.label === other.startWeek);
    if (oStart < 0) return;
    const oRange = { s: oStart, e: oStart + Math.max(1, Number(other.windowPeriods) || 1) };
    const oChannel = other.activityChannel || 'ALL';
    // ALL 渠道与任意渠道有交集
    const channelHit = isAllChannels || oChannel === 'ALL' || oChannel === activityChannel;
    // skuMode=all 按活动保存的 SKU 范围处理；历史无快照按当前主数据展开
    const oSkus = (other.skuMode === 'all' ? skuMaster.map(s => s.code) : (other.skuCodes || [])).filter(c => skuMaster.some(s => s.code === c));
    const skuHit = oSkus.some(c => thisSkuSet.has(c));
    if (rangesOverlap(thisRange, oRange) && channelHit && skuHit) {
      attributionOverlap = true;
      overlapWarnings.push(`⚠ 与「${other.name}」时间窗口、渠道、SKU 三项均重叠，存在直接归因重叠；两活动增量为活动口径合计，可能重复归因，不可直接相加。`);
    }
    // 检查其他活动是否污染本活动 Baseline / Post（先提示，不自动分摊、不假装已消除归因偏差）
    if ((rangesOverlap(baselineRange, oRange) || rangesOverlap(postRange, oRange)) && channelHit && skuHit) {
      pollutionWarnings.push(`⚠「${other.name}」的活动窗口落入本活动的 Baseline/观察期范围，可能影响基准与持续性测算（未自动分摊）。`);
    }
  });
  if (attributionOverlap) economicRisk.push('attribution_overlap');
  if (economicRisk.length === 0) economicRisk.push('normal');

  /* ---------- 诊断（规则九）：每周按真实状态展示；整周完全缺失也进入 missingPeriods ---------- */
  const diagnosis = {
    startWeek: act.startWeek, startIdx,
    activityChannel: isAllChannels ? 'ALL（全渠道兼容）' : activityChannel,
    validSkuCount: validSkus.length,
    baselineAvailable: blN, baselineRequired: act.baselinePeriods, actualBaselinePeriods,
    windowAvailable: windowObserved.length, windowRequired: winP, windowCalendarMissing,
    postAvailable: postObserved.length, postRequired: postP, postCalendarMissing,
    baselineWeeks, baselineSkipped, windowWeeks, postWeeks,
    missingPeriods: [], overlapWarnings, pollutionWarnings, skuScopeNote, reliability
  };
  const stageOf = (w) => baselineWeeks.includes(w) || baselineSkipped.includes(w) ? 'Baseline' : (windowWeeks.includes(w) ? 'Activity Window' : 'Post Observation');
  [...baselineSkipped, ...windowDataMissingWeeks, ...postMissingWeeks].forEach(w => {
    diagnosis.missingPeriods.push({ stage: stageOf(w), period: w.periodId, wholeWeek: true, missingSkus: [] });
  });
  usedWeeks.forEach(w => {
    if (w.missingSkus.length > 0) {
      diagnosis.missingPeriods.push({ stage: stageOf(w), period: w.periodId, wholeWeek: false, missingSkus: w.missingSkus.slice() });
    }
  });

  /* ---------- economics（增量命名区分：净增量=有符号，正增量=管理规则） ---------- */
  const matchedBaselineGmv = canIncremental ? blGmvW * obsN : null;
  const economics = {
    terminal: {
      gmv: r2(wGmv), sales: r2(wSales),
      avgSellPrice: wSales > 0 ? r2(wGmv / wSales) : null,
      baselineWeeklyGmv: blGmvW === null ? null : r2(blGmvW),
      baselineWindowGmv: matchedBaselineGmv === null ? null : r2(matchedBaselineGmv),
      incrementalSellout: canIncremental ? r2(Math.max(0, wGmv - matchedBaselineGmv)) : null,
      netIncrementalSellout: canIncremental ? r2(wGmv - matchedBaselineGmv) : null
    },
    distributor: distEconOK ? {
      revenue: r2(wGmv),
      grossProfit: r2(wDistGross), grossMargin: marginOf(wDistGross, wGmv),
      netProfit: r2(wDistNet), netMargin: marginOf(wDistNet, wGmv),
      economicNetProfit: r2(wDistEconNet),
      incrementalGrossProfit: incDistGross === null ? null : r2(incDistGross),
      incrementalNetProfit: incDistNet === null ? null : r2(incDistNet),
      incrementalEconomicNetProfit: incDistEconNet === null ? null : r2(incDistEconNet),
      incrementalNetProfitRate: incDistNetRate
    } : {
      revenue: r2(wGmv), grossProfit: null, grossMargin: null, netProfit: null, netMargin: null,
      economicNetProfit: null, incrementalGrossProfit: null, incrementalNetProfit: null,
      incrementalEconomicNetProfit: null, incrementalNetProfitRate: null,
      missingReason: '缺少供货价或销量，托盘商利润不可用（不以 0 成本或估算价代替真实价格）'
    },
    brand: brandEconOK ? {
      revenue: r2(wBrandRevenue),
      grossProfit: r2(wBrandGross), grossMargin: marginOf(wBrandGross, wBrandRevenue),
      netProfit: r2(wBrandNet), netMargin: marginOf(wBrandNet, wBrandRevenue),
      incrementalGrossProfit: incBrandGross === null ? null : r2(incBrandGross),
      incrementalNetProfit: incBrandNet === null ? null : r2(incBrandNet),
      incrementalNetProfitRate: incBrandNetRate
    } : {
      revenue: distEconOK ? r2(wBrandRevenue) : null, grossProfit: null, grossMargin: null,
      netProfit: null, netMargin: null, incrementalGrossProfit: null, incrementalNetProfit: null,
      incrementalNetProfitRate: null,
      missingReason: '缺少成本价，品牌利润不可用（不影响 GMV 增量与已有供价支持的托盘商利润）'
    },
    investment: { brandInvestment: r2(invest), consumerPriceSubsidy: r2(consumerSub), distributorRebate: r2(rebate), legacyActivityPriceSubsidy: r2(act.activityPriceSubsidy), totalBrandInvestment: r2(totalInvest) },
    baseline: {
      weeks: blN, configured: act.baselinePeriods,
      usedPeriods: baselineWeeks.map(w => w.periodId), skippedPeriods: baselineSkipped.map(w => w.periodId),
      weekly: blN > 0 ? {
        gmv: r2(blGmvW), sales: r2(blSalesW),
        distGross: blDistGrossW === null ? null : r2(blDistGrossW),
        distNet: blDistNetW === null ? null : r2(blDistNetW),
        brandGross: blBrandGrossW === null ? null : r2(blBrandGrossW),
        brandNet: blBrandNetW === null ? null : r2(blBrandNetW)
      } : null
    },
    post: {
      observedWeeks: postObserved.length, expectedWeeks: postP,
      calendarAvailable: postCalendarAvailable, missingWeeks: postMissingWeeks.length,
      complete: postCompleteNow,
      gmv: r2(pGmv), sales: r2(pSales),
      distGross: postDistGross === null ? null : r2(postDistGross),
      distNet: postDistNet === null ? null : r2(postDistNet),
      brandGross: postBrandGross === null ? null : r2(postBrandGross),
      brandNet: postBrandNet === null ? null : r2(postBrandNet),
      incrementalGmv: postIncGmv === null ? null : r2(postIncGmv)
    },
    profitInvestment: profitInvestment === null ? null : r2(profitInvestment, 4)
  };

  /* ---------- Baseline 不足降级（规则二十二）：参考展示，绝不冒充 Incremental ROI ---------- */
  if (!baselineReliable) {
    return {
      error: `Baseline不足，无法计算可靠增量ROI及增量利润（实际仅 ${blN} 个有效 Baseline 周）`,
      status: 'baseline_insufficient',
      baselineInfo: { configured: act.baselinePeriods, actual: blN },
      activityGmvRatio: totalInvest > 0 ? windowVal / totalInvest : null,
      economics, economicRisk, reliability, attributionOverlap, finalAllowed: false,
      diagnosis: { ...diagnosis, dataCompleteness: 'baseline不足' }
    };
  }

  const result = calculateActivityROI({
    baselineSales, activityWeekSellOut, activityWindowSellOut: windowVal,
    windowObservedWeeks: windowObserved.length, windowPeriods: winP,
    postActivitySales, postPeriodsRequired: postP,
    postCalendarAvailable, postMissingWeeks: postMissingWeeks.length,
    brandInvestment: act.brandInvestment, activityPriceSubsidy: act.activityPriceSubsidy,
    consumerPriceSubsidy: act.consumerPriceSubsidy, distributorRebate: act.distributorRebate
  });

  /* ---------- 暂估门控：窗口未满 / 观察期未满 / 完整性未确认 → 不给最终评级、最终质量分类 ---------- */
  if (!windowFullyObserved && result.evaluation) {
    result.evaluation.grade = '—';
    result.evaluation.label = '观察中';
    result.evaluation.recommendation = `活动窗口未完整观察（${windowObserved.length}/${winP}周），暂估对比按已观察 ${windowObserved.length} 周与 Baseline 同口径计算，数据补齐后自动转正常定级`;
    result.evaluation.provisional = true;
  }
  if (result.postActivity && !result.postActivity.observationComplete && result.evaluation && result.evaluation.grade !== '—') {
    result.evaluation.grade = '—';
    result.evaluation.label = '观察中';
    result.evaluation.recommendation = '活动后观察期未满或存在缺周，暂不定级';
    result.evaluation.provisional = true;
  }
  if (reliability === 'assumed' && result.evaluation) {
    result.evaluation.grade = '—';
    result.evaluation.label = '暂估';
    result.evaluation.recommendation = '按稀疏数据假设测算，完整性未确认；重新上传对应周数据写入覆盖元数据后可转最终评级';
    result.evaluation.provisional = true;
  }
  if (result.return?.status === 'no_positive_increment') economicRisk.push('no_positive_increment');

  const roiVal = result.return?.incrementalSellOutROI;
  const persistVal = result.postActivity?.persistenceRate;
  const quality = finalAllowed ? classifyQuality(roiVal, persistVal) : null;
  const conclusion = buildConclusion({
    roiVal, persistVal, brandNet: wBrandNet, distEconNet: wDistEconNet,
    finalAllowed,
    caveat: reliability === 'assumed' ? '按稀疏数据假设测算，完整性未确认' : null
  });

  // 增量价值覆盖判断（可多条同时成立）
  const coverageNotes = [];
  if (canIncremental) {
    if (incBrandGross !== null && incBrandGross > 0 && incBrandNet !== null && incBrandNet < 0) coverageNotes.push({ type: 'warn', text: '增量毛利为正，但未覆盖活动投入' });
    if (incBrandNet !== null && incBrandNet >= 0) coverageNotes.push({ type: 'ok', text: '增量价值已覆盖活动投入' });
    if (incBrandNet !== null && incBrandNet > 0 && profitInvestment !== null && profitInvestment >= 0.5) coverageNotes.push({ type: 'ok', text: '增量利润具备较好投入回报' });
    if (profitInvestment !== null && profitInvestment >= 1) coverageNotes.push({ type: 'ok', text: '每投入 ¥1 活动成本，额外产生 ≥ ¥1 增量净利' });
  }

  // 「怎么看这场活动？」经营解释（规则六：文案按数据真实状态生成）
  const interpretNotes = [];
  if (canIncremental) {
    if (incBrandNet !== null && incBrandNet < 0) {
      const netG = economics.terminal.netIncrementalSellout;
      // 只有实际净增量GMV > 0 时才能写「虽然产生增量销售」
      interpretNotes.push((netG !== null && netG > 0 ? '活动虽然产生了增量销售，但' : '') + '相对 Baseline，新增经营收益未覆盖投入，或整体经营贡献低于 Baseline。');
    }
    if (incBrandNet !== null && incBrandNet >= 0 && profitInvestment !== null && profitInvestment >= 1) interpretNotes.push('活动新增利润已经覆盖全部活动投入，具备较强经济价值。');
    const roiHigh = toMetricNumber(roiVal) !== null && Number(roiVal) >= 1;
    if (roiHigh && profitInvestment !== null && profitInvestment < 0.5) interpretNotes.push('销售效率较高，但利润转化效率偏低，需检查折扣、补贴、返利及产品毛利结构。');
  }
  // 持续性文案：null / 0 / >0 / <0 四态分明，不把所有 >=0 写成「较强持续性」
  if (persistVal === null || persistVal === undefined) {
    interpretNotes.push('持续性待观察或不可计算。');
  } else {
    const pNum = Number(persistVal);
    if (Number.isFinite(pNum)) {
      if (Math.abs(pNum) < 0.005) interpretNotes.push('观察期回到 Baseline 附近，未保留正向增量。');
      else if (pNum > 0) interpretNotes.push(`活动结束后保留正向增量（持续性 ${(pNum * 100).toFixed(1)}%）。`);
      else interpretNotes.push('活动后低于 Baseline，存在透支信号。');
    }
  }

  // 互斥主状态（规则五）：completed / observing / insufficient / invalid 之和必须等于活动总数
  let primaryStatus = 'observing';
  if (result.return?.status === 'investment_not_applicable') primaryStatus = 'invalid';
  else if (finalAllowed) primaryStatus = 'completed';

  return { ...result, economics, economicRisk, quality, conclusion, coverageNotes, interpretNotes, diagnosis, reliability, finalAllowed, attributionOverlap, primaryStatus, status: 'ok' };
}

function SkuPicker({ skuMaster, selectedCodes, onChange, mode }) {
  const [search, setSearch] = useState('');
  const isAll = mode === 'all';

  const filtered = useMemo(() => {
    if (!search.trim()) return skuMaster;
    const q = search.trim().toLowerCase();
    return skuMaster.filter(s => s.name.toLowerCase().includes(q) || s.code.includes(q));
  }, [skuMaster, search]);

  const selectedSet = new Set(selectedCodes || []);

  return (
    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 space-y-3">
      <div className="flex items-center gap-2 flex-wrap">
        <label className="inline-flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked={isAll} onChange={e => onChange({ mode: e.target.checked ? 'all' : 'custom', codes: [] })} className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"/>
          <span className="text-sm font-medium text-slate-700">全部 SKU</span>
        </label>
        {!isAll && (
          <>
            <span className="text-xs text-slate-400">已选 {selectedCodes.length} 个</span>
            {selectedCodes.length > 0 && <button onClick={() => onChange({ mode: 'custom', codes: [] })} className="text-xs text-red-500 hover:text-red-600">清空</button>}
          </>
        )}
      </div>

      {!isAll && (
        <>
          <div className="flex flex-wrap gap-1.5 min-h-[1.5rem]">
            {selectedCodes.map(code => {
              const s = skuMaster.find(x => x.code === code);
              if (!s) return null;
              return (
                <span key={code} className="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100">
                  {s.name}
                  <button onClick={() => onChange({ mode: 'custom', codes: selectedCodes.filter(c => c !== code) })} className="hover:text-red-500">×</button>
                </span>
              );
            })}
          </div>
          <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="搜索 SKU 名称或编码..." className="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm"/>
          <div className="max-h-40 overflow-y-auto border border-slate-100 rounded-lg">
            {filtered.map(s => {
              const checked = selectedSet.has(s.code);
              return (
                <label key={s.code} className={`flex items-center gap-2 px-3 py-1.5 text-sm cursor-pointer hover:bg-slate-50 ${checked ? 'bg-indigo-50/50' : ''}`}>
                  <input type="checkbox" checked={checked} onChange={e => {
                    const next = e.target.checked ? [...selectedCodes, s.code] : selectedCodes.filter(c => c !== s.code);
                    onChange({ mode: 'custom', codes: next });
                  }} className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"/>
                  <span className="font-mono text-xs text-slate-400 w-16">{s.code}</span>
                  <span className="text-slate-700">{s.name}</span>
                  <span className="text-xs px-1.5 py-0.5 rounded-full ml-auto" style={{background: CAT_COLOR[s.cat]+'1a', color: CAT_COLOR[s.cat]}}>{s.cat}</span>
                </label>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

function ActivityView({ skuWeeks, skuMaster, channelSkuWeekly, channelWeekly, activities, setActivities, cost, supply, opRate, isReadOnly, dataCoverage }) {
  const [selectedId, setSelectedId] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);

  const [fName, setFName] = useState('');
  const [fActivityChannel, setFActivityChannel] = useState('');
  const [fWindow, setFWindow] = useState(3);
  const [fStartWeek, setFStartWeek] = useState(() => { const w = fWindow; const idx = Math.max(0, PERIODS.length - w); return PERIODS[idx]?.label || ''; });

  const [fBaseline, setFBaseline] = useState(8);
  const [fPost, setFPost] = useState(4);
  const [fInvestment, setFInvestment] = useState('');
  const [fConsumerSubsidy, setFConsumerSubsidy] = useState('');
  const [fRebate, setFRebate] = useState('');
  const [fSkuMode, setFSkuMode] = useState('all');
  const [fSkus, setFSkus] = useState([]);
  const [showDiagnosis, setShowDiagnosis] = useState(false);
  const [matrixHover, setMatrixHover] = useState(null);

  const hasChannelSkuData = Object.keys(channelSkuWeekly || {}).length > 0;

  const channels = useMemo(() => {
    const set = new Set();
    if (Array.isArray(channelWeekly)) {
      channelWeekly.forEach(r => Object.keys(r || {}).forEach(k => { if (k.startsWith('g_')) set.add(k.slice(2)); }));
    }
    if (channelSkuWeekly && typeof channelSkuWeekly === 'object') {
      Object.values(channelSkuWeekly).forEach(codeData => {
        if (codeData && typeof codeData === 'object') {
          Object.keys(codeData).forEach(ch => { if (ch && ch !== 'ALL') set.add(ch); });
        }
      });
    }
    return Array.from(set).filter(Boolean).sort();
  }, [channelWeekly, channelSkuWeekly]);

  const getPeriodIdx = (label) => PERIODS.findIndex(p => p.label === label);

  const normalizeActivity = (act) => {
    const skuMode = act.skuMode || (act.skuCodes && act.skuCodes.length > 0 ? 'custom' : 'all');
    const activityChannel = act.activityChannel || 'ALL';
    const legacySubsidy = Math.max(0, toSafeNum(act.activityPriceSubsidy, 0));
    const hasNewFields = act.consumerPriceSubsidy !== undefined || act.distributorRebate !== undefined;
    // 历史数据兼容：旧活动只有 activityPriceSubsidy 时归入消费者端补贴，不重复扣减
    const consumerPriceSubsidy = hasNewFields ? Math.max(0, toSafeNum(act.consumerPriceSubsidy, 0)) : legacySubsidy;
    const distributorRebate = hasNewFields ? Math.max(0, toSafeNum(act.distributorRebate, 0)) : 0;
    return { ...act, skuMode, activityChannel, activityPriceSubsidy: legacySubsidy, consumerPriceSubsidy, distributorRebate };
  };

  const getGradeFromROI = (roi, observationComplete) => {
    if (!observationComplete) return '—';
    if (roi >= ROI_CONFIG.gradeThresholds.S) return 'S';
    if (roi >= ROI_CONFIG.gradeThresholds.A) return 'A';
    if (roi >= ROI_CONFIG.gradeThresholds.B) return 'B';
    if (roi >= ROI_CONFIG.gradeThresholds.C) return 'C';
    return 'D';
  };

  // v3.6：薄封装——所有计算下沉到全局纯函数 calculateActivityCore（同源单次计算，可单测）
  const calculateForActivity = (rawAct) => calculateActivityCore({
    act: normalizeActivity(rawAct),
    PERIODS, skuMaster, skuWeeks, channelSkuWeekly, cost, supply, opRate,
    dataCoverage, activities, hasChannelSkuData
  });


  // v3.6（规则十）：每个活动在一轮数据变化后只计算一次；汇总/统计/矩阵/按钮/详情全部读取同一结果
  const activityResultMap = useMemo(() => {
    const m = {};
    activities.forEach(act => { m[act.id] = calculateForActivity(act); });
    return m;
  }, [activities, skuWeeks, channelSkuWeekly, skuMaster, cost, supply, opRate, dataCoverage]);

  const platformSummary = useMemo(() => {
    const map = {};
    activities.forEach(act => {
      const ch = act.activityChannel || 'ALL';
      const res = activityResultMap[act.id];
      if (res?.error || !res?.activityWindow) return;
      if (!map[ch]) {
        map[ch] = { channel: ch, channelLabel: ch === 'ALL' ? '全渠道兼容' : ch, count: 0, totalInvestment: 0, includedInvestment: 0, totalWindowIncremental: 0, totalEffectiveIncremental: 0, included: 0, excluded: 0, hasOverlap: false };
      }
      const row = map[ch];
      row.count++;
      row.totalInvestment += (res.investment?.totalBrandInvestment || 0);
      if (res.attributionOverlap) row.hasOverlap = true;
      // 正式汇总只纳入完整性已确认的活动（规则一.7）；已确认投入仍全额计入平台投入
      if (res.reliability === 'confirmed') {
        row.includedInvestment += (res.investment?.totalBrandInvestment || 0);
        row.totalWindowIncremental += (res.activityWindow?.windowIncrementalSellOut || 0);
        row.totalEffectiveIncremental += (res.effectiveIncremental?.effectiveIncrementalSellOut || 0);
        row.included++;
      } else row.excluded++;
    });
    return Object.values(map).map(p => {
      const roi = (p.included > 0 && p.includedInvestment > 0) ? p.totalEffectiveIncremental / p.includedInvestment : null;
      const allFinal = activities.filter(a => (a.activityChannel || 'ALL') === p.channel).every(act => {
        const res = activityResultMap[act.id];
        return res && !res.error && res.finalAllowed;
      });
      return { ...p, roi, grade: (roi === null || !allFinal) ? '—' : getGradeFromROI(roi, true) };
    });
  }, [activities, activityResultMap]);

  const activityStats = useMemo(() => {
    // 互斥主状态：completed / observing / insufficient / invalid，数量之和 = total（规则五）
    let completed = 0, observing = 0, insufficient = 0, invalid = 0;
    let validRoiCount = 0, totalROI = 0, validPersistCount = 0, totalPersistence = 0;
    let totalInvestmentAll = 0, totalInvestmentRoi = 0, totalEffective = 0, effectiveCount = 0;
    // 利润聚合：无有效样本 → null（不补 0）；每个聚合记录纳入活动数（规则五）
    const mkBucket = () => ({ sum: 0, included: 0 });
    const incBrandGP = mkBucket(), incBrandNP = mkBucket(), incDistNP = mkBucket(), incDistEconNP = mkBucket();
    const addProfit = (bucket, v) => { const n = toMetricNumber(v); if (n !== null) { bucket.sum += n; bucket.included++; } };
    let overlapAny = false;
    activities.forEach(act => {
      const res = activityResultMap[act.id];
      // 已确认投入全部计入「全部已录入投入」，含 Baseline 不足的活动（验收 H）
      const inv = toMetricNumber(res?.investment?.totalBrandInvestment ?? res?.economics?.investment?.totalBrandInvestment);
      if (inv !== null) totalInvestmentAll += inv;
      if (!res || res.error) {
        if (res?.status === 'baseline_insufficient') insufficient++; else invalid++;
        return;
      }
      if (res.attributionOverlap) overlapAny = true;
      if (res.primaryStatus === 'completed') completed++;
      else if (res.primaryStatus === 'invalid') invalid++;
      else observing++;
      const persist = toMetricNumber(res.postActivity?.persistenceRate);
      // 正式汇总只纳入完整性已确认的活动（规则一.7）：平均 ROI/Persistence、增量、利润合计均不含暂估活动
      if (res.reliability === 'confirmed') {
        if (persist !== null) { totalPersistence += persist; validPersistCount++; }
        const roi = res.return?.incrementalSellOutROI;
        // ROI 平均值只统计有效 ROI：null / NaN / Infinity 一律不进入
        if (Number.isFinite(roi)) { totalROI += roi; validRoiCount++; if (inv !== null) totalInvestmentRoi += inv; }
        const eff = toMetricNumber(res.effectiveIncremental?.effectiveIncrementalSellOut);
        if (eff !== null) { totalEffective += eff; effectiveCount++; }
        const E = res.economics;
        if (E) {
          addProfit(incBrandGP, E.brand?.incrementalGrossProfit);
          addProfit(incBrandNP, E.brand?.incrementalNetProfit);
          addProfit(incDistNP, E.distributor?.incrementalNetProfit);
          addProfit(incDistEconNP, E.distributor?.incrementalEconomicNetProfit);
        }
      }
    });
    // 增量净利润投入比 = 品牌增量净利合计 / ROI 可计算活动的投入（总/总口径）
    const incrementalProfitInvestment = (incBrandNP.included > 0 && totalInvestmentRoi > 0) ? incBrandNP.sum / totalInvestmentRoi : null;
    return {
      total: activities.length, completed, observing, insufficient, invalid,
      avgROI: validRoiCount > 0 ? totalROI / validRoiCount : null,
      roiIncluded: validRoiCount, roiExcluded: activities.length - validRoiCount,
      avgPersistence: validPersistCount > 0 ? totalPersistence / validPersistCount : null,
      totalEffective, effectiveIncluded: effectiveCount,
      totalInvestment: totalInvestmentAll, totalInvestmentAll, totalInvestmentRoi,
      totalIncrementalBrandGrossProfit: incBrandGP.included > 0 ? incBrandGP.sum : null,
      totalIncrementalBrandNetProfit: incBrandNP.included > 0 ? incBrandNP.sum : null,
      totalIncrementalDistributorNetProfit: incDistNP.included > 0 ? incDistNP.sum : null,
      totalIncrementalDistributorEconomicNetProfit: incDistEconNP.included > 0 ? incDistEconNP.sum : null,
      profitIncluded: incBrandNP.included, profitExcluded: activities.length - incBrandNP.included,
      overlapAny,
      incrementalProfitInvestment
    };
  }, [activities, activityResultMap]);

  // 经营质量矩阵数据：仅最终态（finalAllowed）活动进入；暂估/无正增量不强行生成矩阵象限；空数组安全
  const matrixPoints = useMemo(() => {
    const pts = [];
    activities.forEach(act => {
      const res = activityResultMap[act.id];
      if (!res || res.error || !res.finalAllowed) return;
      const roi = res.return?.incrementalSellOutROI;
      const persist = res.postActivity?.persistenceRate;
      if (toMetricNumber(roi) === null || toMetricNumber(persist) === null) return;
      pts.push({
        id: act.id, name: act.name || act.id,
        roi: Number(roi), persistence: Number(persist),
        gmv: res.economics?.terminal?.gmv ?? null,
        incrementalSellout: res.activityWindow?.windowIncrementalSellOut ?? null,
        brandGross: res.economics?.brand?.grossProfit ?? null,
        brandNet: res.economics?.brand?.netProfit ?? null,
        brandNetMargin: res.economics?.brand?.netMargin ?? null,
        distGross: res.economics?.distributor?.grossProfit ?? null,
        distNet: res.economics?.distributor?.netProfit ?? null,
        distNetMargin: res.economics?.distributor?.netMargin ?? null,
        incBrandGross: res.economics?.brand?.incrementalGrossProfit ?? null,
        incBrandNet: res.economics?.brand?.incrementalNetProfit ?? null,
        incDistNet: res.economics?.distributor?.incrementalNetProfit ?? null,
        profitInvestment: res.economics?.profitInvestment ?? null,
        brandLoss: (() => { const _np = toMetricNumber(res.economics?.brand?.netProfit); return _np !== null && _np < 0; })(),
        observing: false,
        economicRisk: res.economicRisk || ['normal'],
        quality: res.quality || classifyQuality(roi, persist)
      });
    });
    return pts;
  }, [activities, activityResultMap]);

  const resetForm = () => {
    setFName(''); setFActivityChannel(''); setFInvestment(''); setFConsumerSubsidy(''); setFRebate(''); setFSkus([]); setFSkuMode('all'); setEditingId(null);
  };

  const handleEdit = (act) => {
    const normalized = normalizeActivity(act);
    setEditingId(act.id);
    setFName(act.name);
    setFActivityChannel(normalized.activityChannel === 'ALL' ? '' : normalized.activityChannel);
    setFStartWeek(act.startWeek);
    setFWindow(act.windowPeriods);
    setFBaseline(act.baselinePeriods);
    setFPost(act.postPeriods);
    setFInvestment(act.brandInvestment);
    // 旧活动只有 activityPriceSubsidy 时，编辑界面兼容归入消费者端补贴（规则八）
    const actHasNewFields = act.consumerPriceSubsidy !== undefined || act.distributorRebate !== undefined;
    setFConsumerSubsidy(actHasNewFields ? (act.consumerPriceSubsidy ?? 0) : (act.activityPriceSubsidy || 0));
    setFRebate(actHasNewFields ? (act.distributorRebate ?? 0) : 0);
    setFSkuMode(normalized.skuMode);
    setFSkus(normalized.skuMode === 'custom' ? [...(act.skuCodes || [])] : []);
    setShowForm(true);
  };

  const handleSave = () => {
    // 金额字段：空白 = 未填写（按 0 处理），但非法金额不得被静默改成 0（规则三）
    const illegal = [['品牌基础投入', fInvestment], ['消费者端价格补贴', fConsumerSubsidy], ['托盘商返利 / 补贴', fRebate]]
      .filter(([, v]) => v !== '' && v !== null && v !== undefined && !Number.isFinite(Number(v)))
      .map(([n]) => n);
    if (illegal.length > 0) { alert('金额格式非法：' + illegal.join('、') + '，请修正后再保存（不会自动按 0 处理）'); return; }
    const investment = Math.max(0, toSafeNum(fInvestment, 0));
    const consumerSub = Math.max(0, toSafeNum(fConsumerSubsidy, 0));
    const rebateVal = Math.max(0, toSafeNum(fRebate, 0));
    if (!fName || !fStartWeek || (investment + consumerSub + rebateVal) <= 0) { alert('请填写活动名称、起始周和品牌投入'); return; }
    if (!editingId && hasChannelSkuData && !fActivityChannel) { alert('请选择活动平台'); return; }
    const startIdx = PERIODS.findIndex(p => p.label === fStartWeek);
    const w = Number(fWindow || 3);
    if (startIdx < 0) { alert('起始周无效'); return; }
    const newAct = {
      id: editingId || Date.now().toString(), name: fName,
      activityChannel: fActivityChannel || 'ALL', startWeek: fStartWeek, startPeriodId: PERIODS[startIdx]?.id || null,
      windowPeriods: Number(fWindow) || 3, baselinePeriods: Number(fBaseline) || 8, postPeriods: Number(fPost) || 4,
      brandInvestment: investment,
      consumerPriceSubsidy: consumerSub, distributorRebate: rebateVal,
      // 旧字段保持为两者之和，作为历史 Brand True Investment 的兼容来源，不重复扣减
      activityPriceSubsidy: consumerSub + rebateVal,
      skuMode: fSkuMode,
      skuCodes: fSkuMode === 'all' ? [] : [...fSkus],
      createdAt: editingId ? (activities.find(a => a.id === editingId)?.createdAt || Date.now()) : Date.now(), updatedAt: Date.now()
    };
    if (editingId) { setActivities(prev => prev.map(a => a.id === editingId ? newAct : a)); setSelectedId(editingId); }
    else { setActivities(prev => [...prev, newAct]); setSelectedId(newAct.id); }
    setEditingId(null); setShowForm(false); resetForm();
  };

  const handleDelete = (id) => { if (!confirm('确定删除该活动？')) return; setActivities(prev => prev.filter(a => a.id !== id)); if (selectedId === id) setSelectedId(null); };

  const selectedActivity = activities.find(a => a.id === selectedId);
  const rawResult = selectedActivity ? activityResultMap[selectedActivity.id] : null;
  const hasError = rawResult && rawResult.error;
  const result = hasError ? null : rawResult;
  const diagnosis = rawResult?.diagnosis || null;

  const gradeColors = { S: '#16a34a', A: '#0d9488', B: '#ca8a04', C: '#ea580c', D: '#dc2626', '—': '#94a3b8' };
  const gradeBg = { S: 'bg-green-50 border-green-200', A: 'bg-teal-50 border-teal-200', B: 'bg-yellow-50 border-yellow-200', C: 'bg-orange-50 border-orange-200', D: 'bg-red-50 border-red-200', '—': 'bg-slate-50 border-slate-200' };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <h2 className="text-lg font-bold text-slate-800">活动 ROI 分析</h2>
          <span className="text-xs text-slate-500">基于终端纯销 GMV · 多 SKU 聚合 · 平台维度</span>
        </div>
        {!isReadOnly && (
        <button onClick={() => { setShowForm(!showForm); if (showForm) { resetForm(); } }} className="inline-flex items-center gap-1.5 text-sm font-medium px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
          <Target className="w-4 h-4"/>{showForm ? '取消' : '新增活动'}
        </button>
        )}
      </div>

      <div className="text-xs text-slate-400 flex items-center gap-1">
        <Info className="w-3.5 h-3.5"/>
        <span>评级阈值为罗盘内部管理规则，不代表行业标准。</span>
      </div>

      <div className="text-xs text-slate-400 flex items-center gap-1">
        <Info className="w-3.5 h-3.5"/>
        <span>活动配置已纳入罗盘总数据 JSON；导入/导出罗盘数据时将同步恢复活动配置，ROI 结果根据最新经营数据自动重新计算。</span>
      </div>

      {activityStats.total > 0 && (
        <div className="grid grid-cols-2 lg:grid-cols-6 gap-3">
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">活动总数</div><div className="text-xl font-bold text-slate-800">{activityStats.total}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">已完成观察</div><div className="text-xl font-bold text-green-600">{activityStats.completed}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">观察中/暂估</div><div className="text-xl font-bold text-amber-600">{activityStats.observing}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">Baseline不足</div><div className="text-xl font-bold text-amber-700">{activityStats.insufficient}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">无效</div><div className="text-xl font-bold text-slate-400">{activityStats.invalid}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">全部已录入投入</div><div className="text-xl font-bold text-slate-800">¥{fmtMoney(activityStats.totalInvestmentAll)}</div><div className="text-[10px] text-slate-400 mt-0.5">其中 ROI 可计算 {activityStats.roiIncluded > 0 ? '¥' + fmtMoney(activityStats.totalInvestmentRoi) : '—'}</div></div>
        </div>
      )}

      {/* 增量价值聚合统计（规则五）：正式汇总只纳入完整性已确认的活动；每个聚合显示纳入/排除活动数 */}
      {activityStats.total > 0 && (() => {
        const tierPI = econTier('incrementalProfitInvestment', activityStats.incrementalProfitInvestment);
        return (
        <div className="grid grid-cols-2 lg:grid-cols-6 gap-3">
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">平均 Incremental ROI</div><div className="text-xl font-bold text-indigo-600">{fmtROI(activityStats.avgROI)}</div><div className="text-[10px] text-slate-400 mt-0.5">纳入 {activityStats.roiIncluded} · 排除 {activityStats.roiExcluded}（暂估活动不进入正式汇总）</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4" title="活动口径合计，可能重复归因；存在归因重叠时不代表去重总增量"><div className="text-xs text-slate-500">有效增量纯销合计</div><div className="text-xl font-bold text-slate-800">{activityStats.effectiveIncluded > 0 ? '¥' + fmtMoney(activityStats.totalEffective) : '—'}</div><div className="text-[10px] text-slate-400 mt-0.5">{activityStats.effectiveIncluded > 0 ? '活动口径合计' : '暂无完整性已确认样本'}{activityStats.overlapAny ? ' · ⚠存在归因重叠' : (activityStats.effectiveIncluded > 0 ? ' · 可能重复归因' : '')}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">品牌增量净利合计 <span className="text-slate-300">vs Baseline</span></div><div className={`text-xl font-bold ${(activityStats.totalIncrementalBrandNetProfit ?? 0) < 0 ? 'text-red-600' : 'text-slate-800'}`}>{activityStats.totalIncrementalBrandNetProfit === null ? '—' : fmtSignedMoney(activityStats.totalIncrementalBrandNetProfit)}</div><div className="text-[10px] text-slate-400 mt-0.5">毛利 {activityStats.totalIncrementalBrandGrossProfit === null ? '—' : fmtSignedMoney(activityStats.totalIncrementalBrandGrossProfit)} · 纳入 {activityStats.profitIncluded} · 排除 {activityStats.profitExcluded}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4" title="扣运营、不含返利（incrementalNetProfit 口径）"><div className="text-xs text-slate-500">托盘商增量净利合计·不含返利</div><div className={`text-xl font-bold ${(activityStats.totalIncrementalDistributorNetProfit ?? 0) < 0 ? 'text-red-600' : 'text-slate-800'}`}>{activityStats.totalIncrementalDistributorNetProfit === null ? '—' : fmtSignedMoney(activityStats.totalIncrementalDistributorNetProfit)}</div><div className="text-[10px] text-slate-400 mt-0.5">扣运营·不含返利口径</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">增量净利润投入比（总/总）</div><div className="text-xl font-bold text-indigo-600">{activityStats.incrementalProfitInvestment === null ? '—' : safePct(activityStats.incrementalProfitInvestment, 1)}</div>{tierPI && <span className="text-xs px-1.5 py-0.5 rounded-full font-medium" style={{background: tierPI.color + '1a', color: tierPI.color}}>{tierPI.label}</span>}</div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">平均 Persistence</div><div className="text-xl font-bold text-slate-800">{safePct(activityStats.avgPersistence, 1)}</div></div>
        </div>
        );
      })()}

      {showForm && (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 space-y-4">
          <h3 className="font-semibold text-slate-700">{editingId ? '编辑活动' : '录入活动'}</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div><label className="text-xs text-slate-500 mb-1 block">活动名称</label><input type="text" value={fName} onChange={e => setFName(e.target.value)} placeholder="例如：618大促" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            {hasChannelSkuData && (
              <div>
                <label className="text-xs text-slate-500 mb-1 block">活动平台 {!editingId && <span className="text-red-500">*</span>}</label>
                <select value={fActivityChannel} onChange={e => setFActivityChannel(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                  <option value="">{editingId ? '保持当前（全渠道兼容）' : '请选择平台'}</option>
                  {channels.map(ch => <option key={ch} value={ch}>{ch}</option>)}
                </select>
                {channels.length === 0 && <p className="text-xs text-amber-600 mt-1">暂无平台数据，请先上传渠道 SKU 周度数据</p>}
              </div>
            )}
            <div><label className="text-xs text-slate-500 mb-1 block">活动起始周</label><select value={fStartWeek} onChange={e => setFStartWeek(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                  {(() => {
                    // v3.2（规则二十四）：只允许选择能完整覆盖 Activity Window 的起始周；
                    // 编辑历史活动时保留原起始周选项，不强制改写
                    const w = Math.max(1, Number(fWindow) || 3);
                    const validOpts = PERIODS.filter((p, i) => i + w <= PERIODS.length);
                    const curIdx = PERIODS.findIndex(p => p.label === fStartWeek);
                    const keepCurrent = !!editingId && curIdx >= 0 && !validOpts.some(p => p.label === fStartWeek);
                    const opts = keepCurrent ? [...validOpts, PERIODS[curIdx]] : validOpts;
                    return opts.slice().reverse().map(p => <option key={p.idx} value={p.label}>{p.label}{keepCurrent && p.label === fStartWeek ? '（当前·窗口未满）' : ''}</option>);
                  })()}
                </select>
                {(() => {
                  const w = Number(fWindow || 3);
                  const idx = PERIODS.findIndex(p => p.label === fStartWeek);
                  if (idx >= 0 && idx + w > PERIODS.length) {
                    return <p className="text-xs text-amber-500 mt-1">窗口超出已有数据 {idx + w - PERIODS.length} 周：保存后活动按可用周数计算，标记「观察中 · 窗口未满」，数据补齐后自动转正常定级</p>;
                  }
                  return null;
                })()}</div>
            <div><label className="text-xs text-slate-500 mb-1 block">活动窗口（周）</label><input type="number" min={1} max={8} value={fWindow} onChange={e => {
              const nw = Math.max(1, Number(e.target.value) || 1);
              setFWindow(nw);
              // v3.2（规则二十四）：窗口变化后，起始周可选范围动态变化；新建时自动校正到最近的可完整覆盖起始周
              if (!editingId) {
                const idx = PERIODS.findIndex(p => p.label === fStartWeek);
                if (idx >= 0 && idx + nw > PERIODS.length) {
                  const ni = Math.max(0, PERIODS.length - nw);
                  setFStartWeek(PERIODS[ni]?.label || '');
                }
              }
            }} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">Baseline 周数</label><input type="number" min={2} max={12} value={fBaseline} onChange={e => setFBaseline(Number(e.target.value))} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">活动后观察（周）</label><input type="number" min={1} max={8} value={fPost} onChange={e => setFPost(Number(e.target.value))} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">品牌基础投入（元）</label><input type="number" min={0} value={fInvestment} onChange={e => setFInvestment(e.target.value)} placeholder="现金+赠品+物料..." className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">消费者端价格补贴（元）</label><input type="number" min={0} value={fConsumerSubsidy} onChange={e => setFConsumerSubsidy(e.target.value)} placeholder="品牌为消费者承担的补贴" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">托盘商返利 / 补贴（元）</label><input type="number" min={0} value={fRebate} onChange={e => setFRebate(e.target.value)} placeholder="品牌额外支付给托盘商" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block">参与 SKU</label>
            <SkuPicker skuMaster={skuMaster} selectedCodes={fSkus} mode={fSkuMode} onChange={({mode, codes}) => { setFSkuMode(mode); setFSkus(codes); }}/>
          </div>
          <div className="flex justify-end gap-2">
            {editingId && <button onClick={() => { setShowForm(false); resetForm(); }} className="px-4 py-2 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50">取消</button>}
            <button onClick={handleSave} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">{editingId ? '保存修改' : '保存并计算'}</button>
          </div>
        </div>
      )}

      {platformSummary.length > 0 && (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div className="px-4 py-3 border-b border-slate-100"><h3 className="font-semibold">平台 ROI 分析</h3><p className="text-xs text-slate-400 mt-0.5">按活动平台聚合已录入活动；窗口/有效增量为活动口径合计，可能重复归因{platformSummary.some(p => p.excluded > 0) ? '；含完整性未确认活动的平台，其增量不计入合计（已确认投入仍全额计入平台投入）' : ''}{platformSummary.some(p => p.hasOverlap) ? '；⚠ 存在归因重叠，已暂停输出整体 ROI 等级' : ''}</p></div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 border-b border-slate-100"><tr className="text-slate-500">
                <th className="px-3 py-2 text-left font-medium">平台</th>
                <th className="px-3 py-2 text-right font-medium">活动数</th>
                <th className="px-3 py-2 text-right font-medium">品牌投入</th>
                <th className="px-3 py-2 text-right font-medium">窗口增量纯销</th>
                <th className="px-3 py-2 text-right font-medium">有效增量纯销</th>
                <th className="px-3 py-2 text-right font-medium">Incremental ROI</th>
                <th className="px-3 py-2 text-center font-medium">等级</th>
              </tr></thead>
              <tbody>
                {platformSummary.map(p => (
                  <tr key={p.channel} className="border-b border-slate-50">
                    <td className="px-3 py-2 font-medium text-slate-700">{p.channelLabel}</td>
                    <td className="px-3 py-2 text-right tabular-nums">{p.count}</td>
                    <td className="px-3 py-2 text-right tabular-nums">¥{fmtMoney(p.totalInvestment)}</td>
                    <td className="px-3 py-2 text-right tabular-nums">{p.included > 0 ? '¥' + fmtMoney(p.totalWindowIncremental) : '—'}</td>
                    <td className="px-3 py-2 text-right tabular-nums font-medium text-green-600">{p.included > 0 ? '¥' + fmtMoney(p.totalEffectiveIncremental) : '—'}</td>
                    <td className="px-3 py-2 text-right tabular-nums font-bold">{fmtROI(p.roi)}</td>
                    <td className="px-3 py-2 text-center"><span className="text-xs px-1.5 py-0.5 rounded-full font-bold" style={{background: (gradeColors[p.grade] || '#94a3b8') + '20', color: gradeColors[p.grade] || '#94a3b8'}}>{p.grade}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ================= 活动经营质量矩阵（规则二十四~二十七） ================= */}
      {/* v3.2（TEST 01）：无活动时也渲染卡片并显示空态文案，不得白屏 */}
      {(
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
          <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
            <div>
              <h3 className="font-semibold">活动经营质量矩阵</h3>
              <p className="text-xs text-slate-400 mt-0.5">X = Incremental ROI（1x 增量销售效率参考线，非利润回本线；真正回本 = 品牌增量贡献净额 ≥ 0）· Y = Persistence（0 为界）· ◆ 菱形 = 品牌净利为负的风险活动 · 仅展示最终态活动</p>
            </div>
            <div className="flex flex-wrap gap-3 text-xs text-slate-500">
              {Object.entries(QUALITY_META).map(([k, m]) => (
                <span key={k} className="inline-flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{background: m.color}}/>{m.label}</span>

          {matrixPoints.length === 0 ? (
            <div className="py-10 text-center text-slate-400 text-sm">暂无足够活动数据生成经营质量矩阵</div>
          ) : (() => {
            const W = 720, H = 360, padL = 46, padR = 16, padT = 18, padB = 42;
            const xs = matrixPoints.map(p => p.roi);
            const ys = matrixPoints.map(p => p.persistence);
            const xMin = Math.min(0, ...xs), xMax = Math.max(1.5, ...xs);
            const yMin = Math.min(-0.2, ...ys), yMax = Math.max(0.2, ...ys);
            const xRange = (xMax - xMin) || 1, yRange = (yMax - yMin) || 1;
            const px = v => padL + ((v - xMin) / xRange) * (W - padL - padR);
            const py = v => padT + (1 - (v - yMin) / yRange) * (H - padT - padB);
            const xCut = 1, yCut = 0;
            const hovered = matrixHover ? matrixPoints.find(p => p.id === matrixHover) : null;
            const xTicks = [0, 1, 2, 3, 4, 5, 6, 8, 10].filter(t => t >= xMin && t <= xMax);
            const yTicks = [-1, -0.5, 0, 0.5, 1].filter(t => t >= yMin && t <= yMax);
            return (
              <div className="flex flex-col lg:flex-row gap-4">
                <div className="flex-1 overflow-x-auto">
                  <svg viewBox={`0 0 ${W} ${H}`} className="w-full min-w-[520px] select-none">
                    <rect x={px(xCut)} y={py(yMax)} width={Math.max(0, px(xMax) - px(xCut))} height={Math.max(0, py(yCut) - py(yMax))} fill="#16a34a" opacity="0.06"/>
                    <rect x={px(xCut)} y={py(yCut)} width={Math.max(0, px(xMax) - px(xCut))} height={Math.max(0, py(yMin) - py(yCut))} fill="#ea580c" opacity="0.06"/>
                    <rect x={px(xMin)} y={py(yMax)} width={Math.max(0, px(xCut) - px(xMin))} height={Math.max(0, py(yCut) - py(yMax))} fill="#0d9488" opacity="0.06"/>
                    <rect x={px(xMin)} y={py(yCut)} width={Math.max(0, px(xCut) - px(xMin))} height={Math.max(0, py(yMin) - py(yCut))} fill="#dc2626" opacity="0.06"/>
                    <line x1={px(xMin)} y1={py(yCut)} x2={px(xMax)} y2={py(yCut)} stroke="#94a3b8" strokeDasharray="4 4"/>
                    <line x1={px(xCut)} y1={py(yMin)} x2={px(xCut)} y2={py(yMax)} stroke="#94a3b8" strokeDasharray="4 4"/>
                    <line x1={px(xMin)} y1={py(yMin)} x2={px(xMax)} y2={py(yMin)} stroke="#e2e8f0"/>
                    <line x1={px(xMin)} y1={py(yMin)} x2={px(xMin)} y2={py(yMax)} stroke="#e2e8f0"/>
                    {xTicks.map(t => (<g key={'x' + t}><line x1={px(t)} y1={py(yMin)} x2={px(t)} y2={py(yMin) + 4} stroke="#cbd5e1"/><text x={px(t)} y={py(yMin) + 16} textAnchor="middle" fontSize="10" fill="#94a3b8">{t}x</text></g>))}
                    {yTicks.map(t => (<g key={'y' + t}><line x1={px(xMin) - 4} y1={py(t)} x2={px(xMin)} y2={py(t)} stroke="#cbd5e1"/><text x={px(xMin) - 8} y={py(t) + 3} textAnchor="end" fontSize="10" fill="#94a3b8">{Math.round(t * 100)}%</text></g>))}
                    <text x={px(xMax)} y={py(yMin) + 32} textAnchor="end" fontSize="11" fill="#64748b">Incremental ROI →</text>
                    <text x={px(xMin) + 6} y={py(yMax) - 6} fontSize="11" fill="#64748b">Persistence ↑</text>
                    <text x={px((xCut + xMax) / 2)} y={py(yMax) + 14} textAnchor="middle" fontSize="11" fontWeight="600" fill="#16a34a" opacity="0.7">战略型</text>
                    <text x={px((xCut + xMax) / 2)} y={py(yMin) - 8} textAnchor="middle" fontSize="11" fontWeight="600" fill="#ea580c" opacity="0.7">爆发型</text>
                    <text x={px((xMin + xCut) / 2)} y={py(yMax) + 14} textAnchor="middle" fontSize="11" fontWeight="600" fill="#0d9488" opacity="0.7">培育型</text>
                    <text x={px((xMin + xCut) / 2)} y={py(yMin) - 8} textAnchor="middle" fontSize="11" fontWeight="600" fill="#dc2626" opacity="0.7">消耗型</text>
                    {matrixPoints.map(p => {
                      const cx = px(p.roi), cy = py(p.persistence);
                      const color = (QUALITY_META[p.quality] || QUALITY_META.consumptive).color;
                      const op = p.observing ? 0.5 : 0.92;
                      return (
                        <g key={p.id} transform={`translate(${cx},${cy})`} opacity={op} style={{cursor: 'pointer'}}
                           onMouseEnter={() => setMatrixHover(p.id)} onMouseLeave={() => setMatrixHover(h => h === p.id ? null : h)}

                            ? <polygon points="0,-8 7,0 0,8 -7,0" fill="#fff" stroke={color} strokeWidth="2.5"/>
