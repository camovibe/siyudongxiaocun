    return Array.from(set).filter(Boolean).sort();
  }, [channelWeekly, channelSkuWeekly]);

  const getPeriodIdx = (label) => PERIODS.findIndex(p => p.label === label);

  const normalizeActivity = (act) => {

    const legacySubsidy = Math.max(0, toSafeNum(act.activityPriceSubsidy, 0));

    // 历史数据兼容：旧活动只有 activityPriceSubsidy 时归入消费者端补贴，不重复扣减
    const consumerPriceSubsidy = hasNewFields ? Math.max(0, toSafeNum(act.consumerPriceSubsidy, 0)) : legacySubsidy;
    const distributorRebate = hasNewFields ? Math.max(0, toSafeNum(act.distributorRebate, 0)) : 0;
    return { ...act, skuMode, activityChannel, activityPriceSubsidy: legacySubsidy, consumerPriceSubsidy, distributorRebate };

    return !!(channelSkuWeekly?.[code]?.[channel]?.[idx]);
  };

  const getGradeFromROI = (roi, observationComplete) => {
    if (!observationComplete) return '—';
    if (roi >= ROI_CONFIG.gradeThresholds.S) return 'S';
    if (roi >= ROI_CONFIG.gradeThresholds.A) return 'A';
    if (roi >= ROI_CONFIG.gradeThresholds.B) return 'B';
    if (roi >= ROI_CONFIG.gradeThresholds.C) return 'C';
    return 'D';
  };

  // 经营质量分类（规则二十四/二十五）：X=Incremental ROI（1x 投入回本线为界），Y=Persistence（0 为界）
  const classifyQuality = (roiVal, persistVal) => {
    const p = Number(persistVal);
    if (!Number.isFinite(p)) return null;
    if (roiVal !== Infinity && !Number.isFinite(Number(roiVal))) return null;
    const roiHigh = roiVal === Infinity || Number(roiVal) >= 1;
    const persistHigh = p >= 0;
    if (roiHigh && persistHigh) return 'strategic';
    if (roiHigh && !persistHigh) return 'explosive';
    if (!roiHigh && persistHigh) return 'cultivation';
    return 'consumptive';
  };
  const QUALITY_META = {
    strategic: { label: '战略型活动', desc: '当期增量效率高，活动结束后仍能保留增量', color: '#16a34a' },
    explosive: { label: '爆发型活动', desc: '活动期间有效，但持续性弱，可能为一次性促销/节点驱动', color: '#ea580c' },
    cultivation: { label: '培育型活动', desc: '当期投放效率一般，但对渠道/用户/销售持续性存在价值', color: '#0d9488' },
    consumptive: { label: '消耗型活动', desc: '既没有明显增量效率，也没有形成持续增长', color: '#dc2626' }
  };
  const RISK_META = {
    normal: { label: '正常', color: '#16a34a' },
    brand_loss: { label: '风险：品牌净利为负', color: '#dc2626' },
    baseline_insufficient: { label: 'Baseline不足', color: '#d97706' },
    window_incomplete: { label: '窗口未满', color: '#d97706' },
    observing: { label: '观察中', color: '#2563eb' }
  };

  // 自动经营结论（规则二十八）：效率、持续性、双方经济结果多维并列，不压缩成单一总分
  const buildConclusion = ({ roiVal, persistVal, brandNet, distEconNet }) => {
    const p = Number(persistVal);
    const roiKnown = roiVal === Infinity || Number.isFinite(Number(roiVal));
    if (!roiKnown && !Number.isFinite(p)) return null;
    const roiHigh = roiVal === Infinity || (roiKnown && Number(roiVal) >= 1);
    const persistHigh = Number.isFinite(p) ? p >= 0 : false;
    const brandOk = Number(brandNet) > 0;
    const distOk = Number(distEconNet) > 0;
    if (roiHigh && persistHigh && brandOk && distOk) return '优质活动：增量效率高、持续性强，且品牌与托盘商均保持正向经济收益，具备复制价值。';
    if (roiHigh && persistHigh && !brandOk) return '高效率但低经济质量：活动带来了明显增量与持续性，但品牌最终净利为负，应优先检查活动投入及补贴结构。';
    if (roiHigh && !persistHigh && brandOk) return '爆发型活动：活动期增量效率较高，但持续性有限，更适合节点型活动，不宜直接判断为长期增长引擎。';
    if (!roiHigh && persistHigh && brandOk) return '培育型活动：短期效率一般，但活动后的销售保持较好，建议从长期渠道价值而非单场ROI判断。';
    if (!roiHigh && !persistHigh && !brandOk) return '消耗型活动：短期没有形成有效增量，活动后也未形成持续改善，同时品牌净利为负，应考虑停止或重构。';
    if (!roiHigh && !persistHigh) return '短期增量效率与活动后持续性均偏弱，建议复盘活动机制与投入结构后再决定是否继续。';
    if (!roiHigh && persistHigh) return '培育型活动：短期效率一般，活动后保持一定增量，但需关注品牌净利水平，避免以补贴维持表面持续性。';
    return '效率与经济结果不完全同向：建议结合增量利润与双方净利结构进一步复盘。';
  };

  const calculateForActivity = (rawAct) => {
    const act = normalizeActivity(rawAct);
    const startIdx = getPeriodIdx(act.startWeek);
    if (startIdx < 0) return { error: `起始周 "${act.startWeek}" 不在时间轴中，当前可用周期：${PERIODS.map(p => p.label).join('、')}` };

    const activityChannel = act.activityChannel || 'ALL';
    const isAllChannels = !activityChannel || activityChannel === 'ALL';

    const validSkus = (act.skuMode === 'all' ? skuMaster.map(s => s.code) : (act.skuCodes || []))
      .filter(code => skuMaster.some(s => s.code === code));
    if (validSkus.length === 0) return { error: '未选择有效 SKU' };

    if (!isAllChannels && hasChannelSkuData) {
      let hasAnyData = false;
      for (const code of validSkus) {
        for (let i = 0; i < PERIODS.length; i++) {
          if (channelHasData(activityChannel, code, i)) { hasAnyData = true; break; }
        }
        if (hasAnyData) break;
      }
      if (!hasAnyData) {
        return {
          error: `该平台（${activityChannel}）暂无 SKU 周度终端纯销数据，无法计算该活动 ROI。请先上传该平台的 SKU×周度数据。`,
          diagnosis: { startWeek: act.startWeek, startIdx, activityChannel, validSkuCount: validSkus.length, baselineAvailable: 0, baselineRequired: act.baselinePeriods, windowAvailable: 0, windowRequired: act.windowPeriods, postAvailable: 0, postRequired: act.postPeriods, windowWeeks: [], postWeeks: [] }
        };
      }
    }

    /* 周有效性判定（v3.1 修正）：
       渠道/SKU 周销数据为稀疏记录——仅当周有动销的 SKU 才有行，无行 = 当周未售货 = 真实 0，而非上传缺口。
       - Baseline 有效周：整周 ≥1 个 SKU 有记录（与 v2 口径一致）；整周无任何记录才算上传缺口，跳过。
       - 周内无记录 SKU 贡献 0（真实 0 销量与未动销在 GMV 口径下等价）。
       - 注：v3.0 曾按 every() 要求全部 SKU 有行才算完整周，稀疏数据下会误判为 0 个可用 Baseline 周，已废止；
         fullCoverage 仅保留为诊断信息，不作为 Baseline 过滤条件。 */
    const hasAnyRecordAt = (idx) => validSkus.some(code => hasRecordAt(activityChannel, code, idx));
    const isCompleteWeekAt = (idx) => hasAnyRecordAt(idx);
    const isFullCoverageAt = (idx) => validSkus.every(code => hasRecordAt(activityChannel, code, idx));
    const missingSkusAt = (idx) => validSkus.filter(code => !hasRecordAt(activityChannel, code, idx));

    const getVal = (idx) => {
      if (!hasAnyRecordAt(idx)) return null;
      return validSkus.reduce((sum, code) => {
        const v = getActivityChannelMetricValue(activityChannel, code, idx);
        return Number.isFinite(v) ? sum + v : sum;
      }, 0);
    };

    // 单周聚合：GMV / 销量 / 托盘商成本(供货价×销量) / 品牌成本(成本价×销量)，复用 cost/supply 价格体系（规则三）
    const weekAggAt = (idx) => {
      if (!hasAnyRecordAt(idx)) return null;
      let gmv = 0, sales = 0, distCOGS = 0, brandCOGS = 0;
      validSkus.forEach(code => {
        const g = getActivityChannelMetricValue(activityChannel, code, idx);
        const s = getActivityChannelSalesValue(activityChannel, code, idx);
        const gv = Number.isFinite(g) ? g : 0;
        const sv = Number.isFinite(s) ? s : 0;
        gmv += gv; sales += sv;
        distCOGS += toSafeNum(supply?.[code], 0) * sv;
        brandCOGS += toSafeNum(cost?.[code], 0) * sv;
      });
      return { idx, gmv, sales, distCOGS, brandCOGS, complete: isFullCoverageAt(idx), missingSkus: missingSkusAt(idx) };
    };

    // Baseline 自适应：actualBaselinePeriods = min(配置, startIdx)，纳入所有有效周（整周≥1条记录；规则二十，v3.1 口径）
    const actualBaselinePeriods = Math.min(act.baselinePeriods, startIdx);
    const baselineWeekAggs = [];
    for (let i = startIdx - 1; i >= 0 && baselineWeekAggs.length < actualBaselinePeriods; i--) {
      if (!isCompleteWeekAt(i)) continue;
      const agg = weekAggAt(i);
      if (agg) baselineWeekAggs.push(agg);
    }
    const baselineSales = baselineWeekAggs.map(w => w.gmv);

    const activityWeekSellOut = getVal(startIdx) || 0;

    // Activity Window 聚合（主口径，与 Post Observation 分开）
    const windowWeekAggs = [];
    let windowVal = 0;
    for (let i = startIdx; i < startIdx + act.windowPeriods && i < PERIODS.length; i++) {
      const wv = getVal(i); windowVal += (wv === null ? 0 : wv);
      const agg = weekAggAt(i);
      if (agg) windowWeekAggs.push(agg);
    }

    // Post Observation 聚合：未观察到的未来周不计入（不当 0）
    const postWeekAggs = [];
    const postActivitySales = [];
    for (let i = startIdx + act.windowPeriods; i < startIdx + act.windowPeriods + act.postPeriods && i < PERIODS.length; i++) {
      const pv = getVal(i); postActivitySales.push(pv === null ? 0 : pv);
      const agg = weekAggAt(i);
      if (agg) postWeekAggs.push(agg);
    }

    const diagnosis = {
      startWeek: act.startWeek, startIdx,
      activityChannel: isAllChannels ? 'ALL（全渠道兼容）' : activityChannel,
      validSkuCount: validSkus.length,
      baselineAvailable: baselineSales.length, baselineRequired: act.baselinePeriods,
      actualBaselinePeriods,
      windowAvailable: Math.min(act.windowPeriods, Math.max(0, PERIODS.length - startIdx)), windowRequired: act.windowPeriods,
      postAvailable: postActivitySales.length, postRequired: act.postPeriods,
      windowWeeks: [], postWeeks: []
    };
    for (let i = startIdx; i < startIdx + act.windowPeriods && i < PERIODS.length; i++) {
      const hasData = hasAnyRecordAt(i);
      const wv = getVal(i);
      const gmv = wv === null ? 0 : wv;
      diagnosis.windowWeeks.push({ label: PERIODS[i]?.label, idx: i, gmv, hasData });
    }
    for (let i = startIdx + act.windowPeriods; i < startIdx + act.windowPeriods + act.postPeriods && i < PERIODS.length; i++) {
      const hasData = hasAnyRecordAt(i);
      const pv = getVal(i);
      const gmv = pv === null ? 0 : pv;
      diagnosis.postWeeks.push({ label: PERIODS[i]?.label, idx: i, gmv, hasData });
    }

    // v3.2（规则二十三）：missing 诊断——收集各阶段内未动销/无记录的 SKU×周，
    // 供 UI 展示「XX SKU 在 XX 周缺少数据」。稀疏上传语义下无行 = 未动销 = 真实 0，仅作诊断展示，不影响计算。
    diagnosis.missingPeriods = [];
    const collectMissing = (aggs, stage) => {
      aggs.forEach(w => {
        if (w && Array.isArray(w.missingSkus) && w.missingSkus.length > 0) {
          diagnosis.missingPeriods.push({ stage, period: PERIODS[w.idx]?.label, missingSkus: w.missingSkus.slice() });
        }
      });
    };
    collectMissing(baselineWeekAggs, 'Baseline');
    collectMissing(windowWeekAggs, 'Activity Window');
    collectMissing(postWeekAggs, 'Post Observation');

    /* ================= Activity Economics（活动经营利润，规则五十四集中计算） =================
       经济链条：GNC品牌方 --供货价--> 托盘商 --终端成交价--> C端
       托盘商净利沿用系统 opRate；品牌净利 = 品牌毛利 - 品牌投入 - 消费者端价格补贴 - 托盘商返利 */
    const op = Math.min(90, Math.max(0, toSafeNum(opRate, 0))) / 100;
    const winP = Math.max(1, Number(act.windowPeriods) || 1);
    const sumAgg = (arr, k) => arr.reduce((t, w) => t + (Number.isFinite(Number(w?.[k])) ? Number(w[k]) : 0), 0);
    const wGmv = sumAgg(windowWeekAggs, 'gmv'), wSales = sumAgg(windowWeekAggs, 'sales');
    const wDistCOGS = sumAgg(windowWeekAggs, 'distCOGS'), wBrandCOGS = sumAgg(windowWeekAggs, 'brandCOGS');
    const invest = Math.max(0, toSafeNum(act.brandInvestment, 0));
    const consumerSub = act.consumerPriceSubsidy;
    const rebate = act.distributorRebate;
    const totalInvest = invest + consumerSub + rebate;

    const wDistGross = wGmv - wDistCOGS;
    const wDistNet = wGmv * (1 - op) - wDistCOGS;
    const wDistEconNet = wDistNet + rebate;
    const wBrandRevenue = wDistCOGS;
    const wBrandGross = wDistCOGS - wBrandCOGS;
    const wBrandNet = wBrandGross - invest - consumerSub - rebate;
    const marginOf = (p, r) => (Number.isFinite(p) && Number.isFinite(r) && r > 0 ? p / r : null);

    // Baseline 周均利润（Baseline 不扣活动投入，规则十四）
    const blN = baselineWeekAggs.length;
    const blGmvW = blN > 0 ? sumAgg(baselineWeekAggs, 'gmv') / blN : null;
    const blSalesW = blN > 0 ? sumAgg(baselineWeekAggs, 'sales') / blN : null;
    const blDistCOGSW = blN > 0 ? sumAgg(baselineWeekAggs, 'distCOGS') / blN : null;
    const blBrandCOGSW = blN > 0 ? sumAgg(baselineWeekAggs, 'brandCOGS') / blN : null;
    const blDistGrossW = blN > 0 ? blGmvW - blDistCOGSW : null;
    const blDistNetW = blN > 0 ? blGmvW * (1 - op) - blDistCOGSW : null;
    const blBrandGrossW = blN > 0 ? blDistCOGSW - blBrandCOGSW : null;
    const blBrandNetW = blBrandGrossW;

    // 增量利润：Baseline 周均 × 活动窗口周数（规则十六）；Baseline < 2 周时不计算（规则二十二）
    const canIncremental = blN >= 2;
    const incDistGross = canIncremental ? wDistGross - blDistGrossW * winP : null;
    const incDistNet = canIncremental ? wDistNet - blDistNetW * winP : null;
    const incDistEconNet = canIncremental ? wDistEconNet - blDistNetW * winP : null;
    const incBrandGross = canIncremental ? wBrandGross - blBrandGrossW * winP : null;
    const incBrandNet = canIncremental ? wBrandNet - blBrandNetW * winP : null;
    const incBrandNetRate = canIncremental ? marginOf(incBrandNet, wBrandRevenue) : null;
    const incDistNetRate = canIncremental ? marginOf(incDistEconNet, wGmv) : null;

    // v3.2（规则二十/二十六）：Incremental Profit / Investment = 品牌增量净利 ÷ 品牌真实投入合计
    // 与 Incremental ROI（新增终端纯销效率）并列，不互相替代；分母 ≤0 或增量不可算时为 null
    const profitInvestment = (canIncremental && incBrandNet !== null && totalInvest > 0) ? incBrandNet / totalInvest : null;

    // Post Observation 经济（规则五十五）：投入只归属活动窗口，Post 不重复扣减（规则三十七）
    const pGmv = sumAgg(postWeekAggs, 'gmv'), pSales = sumAgg(postWeekAggs, 'sales');
    const pDistCOGS = sumAgg(postWeekAggs, 'distCOGS'), pBrandCOGS = sumAgg(postWeekAggs, 'brandCOGS');
    const pObserved = postWeekAggs.length;
    const postDistGross = pGmv - pDistCOGS;
    const postDistNet = pGmv * (1 - op) - pDistCOGS;
    const postBrandGross = pDistCOGS - pBrandCOGS;
    const postBrandNet = postBrandGross;
    const postIncGmv = canIncremental ? pGmv - blGmvW * pObserved : null;

    const economics = {
      terminal: {
        gmv: r2(wGmv), sales: r2(wSales),
        avgSellPrice: wSales > 0 ? r2(wGmv / wSales) : null,
        baselineWeeklyGmv: blGmvW === null ? null : r2(blGmvW),
        baselineWindowGmv: canIncremental ? r2(blGmvW * winP) : null,
        incrementalSellout: canIncremental ? r2(Math.max(0, wGmv - blGmvW * winP)) : null
      },
      distributor: {
        revenue: r2(wGmv),
        grossProfit: r2(wDistGross), grossMargin: marginOf(wDistGross, wGmv),
        netProfit: r2(wDistNet), netMargin: marginOf(wDistNet, wGmv),
        economicNetProfit: r2(wDistEconNet),
        incrementalGrossProfit: incDistGross === null ? null : r2(incDistGross),
        incrementalNetProfit: incDistNet === null ? null : r2(incDistNet),
        incrementalEconomicNetProfit: incDistEconNet === null ? null : r2(incDistEconNet),
        incrementalNetProfitRate: incDistNetRate
      },
      brand: {
        revenue: r2(wBrandRevenue),
        grossProfit: r2(wBrandGross), grossMargin: marginOf(wBrandGross, wBrandRevenue),
        netProfit: r2(wBrandNet), netMargin: marginOf(wBrandNet, wBrandRevenue),
        incrementalGrossProfit: incBrandGross === null ? null : r2(incBrandGross),
        incrementalNetProfit: incBrandNet === null ? null : r2(incBrandNet),
        incrementalNetProfitRate: incBrandNetRate
      },
      investment: { brandInvestment: r2(invest), consumerPriceSubsidy: r2(consumerSub), distributorRebate: r2(rebate), legacyActivityPriceSubsidy: r2(act.activityPriceSubsidy), totalBrandInvestment: r2(totalInvest) },
      baseline: {
        weeks: blN, configured: act.baselinePeriods,
        weekly: blN > 0 ? { gmv: r2(blGmvW), sales: r2(blSalesW), distGross: r2(blDistGrossW), distNet: r2(blDistNetW), brandGross: r2(blBrandGrossW), brandNet: r2(blBrandNetW) } : null
      },
      post: {
        observedWeeks: pObserved, expectedWeeks: act.postPeriods,
        complete: pObserved >= act.postPeriods,
        gmv: r2(pGmv), sales: r2(pSales),
        distGross: r2(postDistGross), distNet: r2(postDistNet),
        brandGross: r2(postBrandGross), brandNet: r2(postBrandNet),
        incrementalGmv: postIncGmv === null ? null : r2(postIncGmv)
      },
      // v3.2：增量利润投入比（品牌增量净利 / 品牌真实投入合计）
      profitInvestment: profitInvestment === null ? null : r2(profitInvestment, 4)
    };

    // Economic Risk（规则四十二）：与 ROI Grade 并列存在，不覆盖（规则二十三）
    const wAvailNow = Math.min(act.windowPeriods, Math.max(0, PERIODS.length - startIdx));
    const windowCompleteNow = wAvailNow >= act.windowPeriods;
    const postCompleteNow = postActivitySales.length >= act.postPeriods;
    const economicRisk = [];
    if (!canIncremental) economicRisk.push('baseline_insufficient');
    // v3.2（规则十八）：增量毛利为正但增量净利为负（未覆盖活动投入），同样标记 Brand Loss
    if (wBrandNet < 0 || (canIncremental && incBrandGross > 0 && incBrandNet < 0)) economicRisk.push('brand_loss');
    if (!windowCompleteNow) economicRisk.push('window_incomplete');
    if (!postCompleteNow) economicRisk.push('observing');
    if (economicRisk.length === 0) economicRisk.push('normal');

    // Baseline 自适应降级：actualBaseline >= 2 才计算可靠 Incremental ROI 及增量利润（规则二十二）
    if (baselineSales.length < 2) {
      return {
        error: `Baseline不足，无法计算可靠增量ROI及增量利润（实际仅 ${baselineSales.length} 个有效 Baseline 周）`,
        status: 'baseline_insufficient',
        baselineInfo: { configured: act.baselinePeriods, actual: baselineSales.length },
        // 仅作参考展示，绝不冒充 Incremental ROI（规则二十二）
        activityGmvRatio: totalInvest > 0 ? windowVal / totalInvest : null,
        economics,
        economicRisk,
        diagnosis: { ...diagnosis, dataCompleteness: 'baseline不足' }
      };
    }


    const result = calculateActivityROI({
      baselineSales, activityWeekSellOut, activityWindowSellOut: windowVal, windowPeriods: act.windowPeriods,
      postActivitySales, postPeriodsRequired: act.postPeriods, brandInvestment: act.brandInvestment, activityPriceSubsidy: act.activityPriceSubsidy,
      consumerPriceSubsidy: act.consumerPriceSubsidy, distributorRebate: act.distributorRebate
    });

    // Window Available < Window Required：窗口未满，Grade="—"，状态="观察中"，数据补齐后自动转正常定级
    const wAvail = Math.min(act.windowPeriods, Math.max(0, PERIODS.length - startIdx));
    if (wAvail < act.windowPeriods) {
      if (result.evaluation) {
        result.evaluation.grade = '—';
        result.evaluation.label = '观察中';
        result.evaluation.recommendation = `活动窗口未满（${wAvail}/${act.windowPeriods}周），暂不定级`;
      }
    }

    // Post Available < Post Required：可计算当前ROI，但Grade="—"，状态="观察中"
    if (postActivitySales.length < act.postPeriods) {
      if (result.evaluation) {
        result.evaluation.grade = '—';
        result.evaluation.label = '观察中';
        result.evaluation.recommendation = '活动后观察期未满，暂不定级';
      }
      if (result.postActivity) {
        result.postActivity.observationComplete = false;
      }
    }


    // 活动重叠风险诊断
    const overlapWarnings = [];
    activities.forEach(otherAct => {
      if (otherAct.id === act.id) return;
      const otherStart = getPeriodIdx(otherAct.startWeek);
      if (otherStart < 0) return;
      const otherEnd = otherStart + (otherAct.windowPeriods || 3);
      const thisEnd = startIdx + (act.windowPeriods || 3);
      const overlapStart = Math.max(startIdx, otherStart);
      const overlapEnd = Math.min(thisEnd, otherEnd);
      if (overlapEnd > overlapStart) {
        const overlapWeeks = overlapEnd - overlapStart;
        overlapWarnings.push(`⚠ 与「${otherAct.name}」活动窗口重叠${overlapWeeks}周，当前ROI可能存在归因重叠。`);
      }
    });
    if (overlapWarnings.length > 0 && diagnosis) {
      diagnosis.overlapWarnings = overlapWarnings;
    }

    const roiVal = result.return?.incrementalSellOutROI;
    const persistVal = result.postActivity?.persistenceRate;
    const quality = classifyQuality(roiVal, persistVal);
    const conclusion = buildConclusion({ roiVal, persistVal, brandNet: wBrandNet, distEconNet: wDistEconNet });

    // v3.2（规则十八）：增量价值覆盖判断（可多条同时成立）
    const coverageNotes = [];
    if (canIncremental) {
      if (incBrandGross > 0 && incBrandNet < 0) coverageNotes.push({ type: 'warn', text: '增量毛利为正，但未覆盖活动投入' });
      if (incBrandNet >= 0) coverageNotes.push({ type: 'ok', text: '增量价值已覆盖活动投入' });
      if (incBrandNet > 0 && profitInvestment !== null && profitInvestment >= 0.5) coverageNotes.push({ type: 'ok', text: '增量利润具备较好投入回报' });
      if (profitInvestment !== null && profitInvestment >= 1) coverageNotes.push({ type: 'ok', text: '每投入 ¥1 活动成本，额外产生 ≥ ¥1 增量净利' });
    }

    // v3.2（规则二十七）：「怎么看这场活动？」经营解释（规则自动生成，可多条并列）
    const interpretNotes = [];
    if (canIncremental) {
      if (incBrandNet < 0) interpretNotes.push('活动虽然产生了增量销售，但增量利润未覆盖品牌活动投入。');
      if (incBrandNet >= 0 && profitInvestment !== null && profitInvestment >= 1) interpretNotes.push('活动新增利润已经覆盖全部活动投入，具备较强经济价值。');
      const roiHigh = roiVal === Infinity || Number(roiVal) >= 1;
      if (roiHigh && profitInvestment !== null && profitInvestment < 0.5) interpretNotes.push('销售效率较高，但利润转化效率偏低，需检查折扣、补贴、返利及产品毛利结构。');
    }
    const pNum = Number(persistVal);
    if (Number.isFinite(pNum)) {
      if (pNum >= 0) interpretNotes.push('活动结束后仍保持较强增量，具备较好的持续性。');
      else interpretNotes.push('活动结束后增量快速衰减，可能主要依赖活动刺激。');
    }

    return { ...result, economics, economicRisk, quality, conclusion, coverageNotes, interpretNotes, diagnosis };
  };

  const platformSummary = useMemo(() => {
    const map = {};
    activities.forEach(act => {
      const ch = act.activityChannel || 'ALL';
      const res = calculateForActivity(act);
      if (res?.error || !res?.activityWindow) return;
      if (!map[ch]) {
        map[ch] = { channel: ch, channelLabel: ch === 'ALL' ? '全渠道兼容' : ch, count: 0, totalInvestment: 0, totalWindowIncremental: 0, totalEffectiveIncremental: 0 };
      }
      map[ch].count++;
      map[ch].totalInvestment += (res.investment?.totalBrandInvestment || 0);
      map[ch].totalWindowIncremental += (res.activityWindow?.windowIncrementalSellOut || 0);
      map[ch].totalEffectiveIncremental += (res.effectiveIncremental?.effectiveIncrementalSellOut || 0);
    });
    return Object.values(map).map(p => {
      const roi = p.totalInvestment > 0 ? p.totalEffectiveIncremental / p.totalInvestment : 0;
      const allObsComplete = activities.filter(a => (a.activityChannel || 'ALL') === p.channel).every(act => {
      const res = calculateForActivity(act);
      return res && !res.error && res.postActivity && res.postActivity.observationComplete;
    });
    return { ...p, roi, grade: getGradeFromROI(roi, allObsComplete) };
    });
  }, [activities, skuWeeks, channelSkuWeekly, skuMaster, cost, supply, opRate]);

  const activityStats = useMemo(() => {
    let completed = 0, observing = 0, validRoiCount = 0, totalInvestment = 0, totalEffective = 0, totalROI = 0;
    // v3.2（规则二十）：增量/整体利润聚合；利润率一律 total profit / total revenue，禁止 average(margin)
    let validPersistCount = 0, totalPersistence = 0;
    let totalIncBrandGP = 0, totalIncBrandNP = 0, totalIncDistGP = 0, totalIncDistNP = 0;
    let totalBrandGP = 0, totalBrandNP = 0, totalDistGP = 0, totalDistNP = 0;
    const addIfFinite = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
    activities.forEach(act => {
      const res = calculateForActivity(act);
      if (res?.error || !res?.return) return;
      if (res.postActivity?.observationComplete) completed++; else observing++;
      totalInvestment += (res.investment?.totalBrandInvestment || 0);
      totalEffective += (res.effectiveIncremental?.effectiveIncrementalSellOut || 0);
      const roi = res.return?.incrementalSellOutROI;
      // ROI 平均值只统计有效 ROI：null / NaN / Infinity 一律不进入
      if (Number.isFinite(roi)) { totalROI += roi; validRoiCount++; }
      const persist = Number(res.postActivity?.persistenceRate);
      if (Number.isFinite(persist)) { totalPersistence += persist; validPersistCount++; }
      const E = res.economics;
      if (E) {
        totalIncBrandGP += addIfFinite(E.brand?.incrementalGrossProfit);
        totalIncBrandNP += addIfFinite(E.brand?.incrementalNetProfit);
        totalIncDistGP += addIfFinite(E.distributor?.incrementalGrossProfit);
        totalIncDistNP += addIfFinite(E.distributor?.incrementalNetProfit);
        totalBrandGP += addIfFinite(E.brand?.grossProfit);
        totalBrandNP += addIfFinite(E.brand?.netProfit);
        totalDistGP += addIfFinite(E.distributor?.grossProfit);
        totalDistNP += addIfFinite(E.distributor?.netProfit);
      }
    });
    // 增量利润投入比 = 总品牌增量净利 / 总品牌真实投入（总/总口径）
    const incrementalProfitInvestment = totalInvestment > 0 ? totalIncBrandNP / totalInvestment : null;
    return {
      total: activities.length, completed, observing,
      avgROI: validRoiCount > 0 ? totalROI / validRoiCount : null,
      avgIncrementalROI: validRoiCount > 0 ? totalROI / validRoiCount : null,
      avgPersistence: validPersistCount > 0 ? totalPersistence / validPersistCount : null,
      totalEffective, totalInvestment,
      totalBrandInvestment: totalInvestment,
      totalBrandTrueInvestment: totalInvestment,
      totalIncrementalBrandGrossProfit: totalIncBrandGP,
      totalIncrementalBrandNetProfit: totalIncBrandNP,
      totalIncrementalDistributorGrossProfit: totalIncDistGP,
      totalIncrementalDistributorNetProfit: totalIncDistNP,
      totalBrandGrossProfit: totalBrandGP,
      totalBrandNetProfit: totalBrandNP,
      totalDistributorGrossProfit: totalDistGP,
      totalDistributorNetProfit: totalDistNP,
      incrementalProfitInvestment
    };
  }, [activities, skuWeeks, channelSkuWeekly, skuMaster, cost, supply, opRate]);

  // 经营质量矩阵数据（规则五十七）：仅 ROI 与 Persistence 均有限的活动进入；空数组安全（规则五十八）
  const matrixPoints = useMemo(() => {
    const pts = [];
    activities.forEach(act => {
      const res = calculateForActivity(act);
      if (!res || res.error) return;
      const roi = res.return?.incrementalSellOutROI;
      const persist = res.postActivity?.persistenceRate;
      if (!Number.isFinite(Number(roi)) || !Number.isFinite(Number(persist))) return;
      pts.push({
        id: act.id, name: act.name || act.id,
        roi: Number(roi), persistence: Number(persist),
        gmv: res.economics?.terminal?.gmv ?? null,
        incrementalSellout: res.activityWindow?.windowIncrementalSellOut ?? null,
        brandGross: res.economics?.brand?.grossProfit ?? null,
        brandNet: res.economics?.brand?.netProfit ?? null,
        brandNetMargin: res.economics?.brand?.netMargin ?? null,
        distGross: res.economics?.distributor?.grossProfit ?? null,
        distNet: res.economics?.distributor?.netProfit ?? null,
        distNetMargin: res.economics?.distributor?.netMargin ?? null,
        incBrandGross: res.economics?.brand?.incrementalGrossProfit ?? null,
        incBrandNet: res.economics?.brand?.incrementalNetProfit ?? null,
        incDistNet: res.economics?.distributor?.incrementalNetProfit ?? null,
        profitInvestment: res.economics?.profitInvestment ?? null,
        brandLoss: Number.isFinite(Number(res.economics?.brand?.netProfit)) ? res.economics.brand.netProfit < 0 : false,
        observing: !(res.postActivity?.observationComplete),
        economicRisk: res.economicRisk || ['normal'],
        quality: res.quality || classifyQuality(roi, persist)
      });
    });
    return pts;
  }, [activities, skuWeeks, channelSkuWeekly, skuMaster, cost, supply, opRate]);

  const resetForm = () => {
    setFName(''); setFActivityChannel(''); setFInvestment(''); setFConsumerSubsidy(''); setFRebate(''); setFSkus([]); setFSkuMode('all'); setEditingId(null);
  };

  const handleEdit = (act) => {
    const normalized = normalizeActivity(act);
    setEditingId(act.id);
    setFName(act.name);
    setFActivityChannel(normalized.activityChannel === 'ALL' ? '' : normalized.activityChannel);
    setFStartWeek(act.startWeek);
    setFWindow(act.windowPeriods);
    setFBaseline(act.baselinePeriods);
    setFPost(act.postPeriods);
    setFInvestment(act.brandInvestment);
    // 旧活动只有 activityPriceSubsidy 时，编辑界面兼容归入消费者端补贴（规则八）
    const actHasNewFields = act.consumerPriceSubsidy !== undefined || act.distributorRebate !== undefined;
    setFConsumerSubsidy(actHasNewFields ? (act.consumerPriceSubsidy ?? 0) : (act.activityPriceSubsidy || 0));
    setFRebate(actHasNewFields ? (act.distributorRebate ?? 0) : 0);
    setFSkuMode(normalized.skuMode);
    setFSkus(normalized.skuMode === 'custom' ? [...(act.skuCodes || [])] : []);
    setShowForm(true);
  };

  const handleSave = () => {
    // 金额字段统一 Number 安全转换，非法输入不产生 NaN，且必须 >= 0（规则五十一/五十二）
    const investment = Math.max(0, toSafeNum(fInvestment, 0));
    const consumerSub = Math.max(0, toSafeNum(fConsumerSubsidy, 0));
    const rebateVal = Math.max(0, toSafeNum(fRebate, 0));
    if (!fName || !fStartWeek || (investment + consumerSub + rebateVal) <= 0) { alert('请填写活动名称、起始周和品牌投入'); return; }
    if (!editingId && hasChannelSkuData && !fActivityChannel) { alert('请选择活动平台'); return; }
    const startIdx = PERIODS.findIndex(p => p.label === fStartWeek);
    const w = Number(fWindow || 3);
    if (startIdx < 0) { alert('起始周无效'); return; }
    const newAct = {
      id: editingId || Date.now().toString(), name: fName,
      activityChannel: fActivityChannel || 'ALL', startWeek: fStartWeek,
      windowPeriods: Number(fWindow) || 3, baselinePeriods: Number(fBaseline) || 8, postPeriods: Number(fPost) || 4,
      brandInvestment: investment,
      consumerPriceSubsidy: consumerSub, distributorRebate: rebateVal,
      // 旧字段保持为两者之和，作为历史 Brand True Investment 的兼容来源，不重复扣减
      activityPriceSubsidy: consumerSub + rebateVal,
      skuMode: fSkuMode,
      skuCodes: fSkuMode === 'all' ? [] : [...fSkus],
      createdAt: editingId ? (activities.find(a => a.id === editingId)?.createdAt || Date.now()) : Date.now(), updatedAt: Date.now()
    };
    if (editingId) { setActivities(prev => prev.map(a => a.id === editingId ? newAct : a)); setSelectedId(editingId); }
    else { setActivities(prev => [...prev, newAct]); setSelectedId(newAct.id); }
    setEditingId(null); setShowForm(false); resetForm();
  };

  const handleDelete = (id) => { if (!confirm('确定删除该活动？')) return; setActivities(prev => prev.filter(a => a.id !== id)); if (selectedId === id) setSelectedId(null); };

  const selectedActivity = activities.find(a => a.id === selectedId);
  const rawResult = selectedActivity ? calculateForActivity(selectedActivity) : null;
  const hasError = rawResult && rawResult.error;
  const result = hasError ? null : rawResult;
  const diagnosis = rawResult?.diagnosis || null;

  const gradeColors = { S: '#16a34a', A: '#0d9488', B: '#ca8a04', C: '#ea580c', D: '#dc2626', '—': '#94a3b8' };
  const gradeBg = { S: 'bg-green-50 border-green-200', A: 'bg-teal-50 border-teal-200', B: 'bg-yellow-50 border-yellow-200', C: 'bg-orange-50 border-orange-200', D: 'bg-red-50 border-red-200', '—': 'bg-slate-50 border-slate-200' };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <h2 className="text-lg font-bold text-slate-800">活动 ROI 分析</h2>
          <span className="text-xs text-slate-500">基于终端纯销 GMV · 多 SKU 聚合 · 平台维度</span>
        </div>
        {!isReadOnly && (
        <button onClick={() => { setShowForm(!showForm); if (showForm) { resetForm(); } }} className="inline-flex items-center gap-1.5 text-sm font-medium px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
          <Target className="w-4 h-4"/>{showForm ? '取消' : '新增活动'}
        </button>
        )}
      </div>

      <div className="text-xs text-slate-400 flex items-center gap-1">
        <Info className="w-3.5 h-3.5"/>
        <span>评级阈值为罗盘内部管理规则，不代表行业标准。</span>
      </div>

      <div className="text-xs text-slate-400 flex items-center gap-1">
        <Info className="w-3.5 h-3.5"/>
        <span>活动配置已纳入罗盘总数据 JSON；导入/导出罗盘数据时将同步恢复活动配置，ROI 结果根据最新经营数据自动重新计算。</span>
      </div>

      {activityStats.total > 0 && (
        <div className="grid grid-cols-2 lg:grid-cols-6 gap-3">
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">活动总数</div><div className="text-xl font-bold text-slate-800">{activityStats.total}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">已完成观察</div><div className="text-xl font-bold text-green-600">{activityStats.completed}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">观察中</div><div className="text-xl font-bold text-amber-600">{activityStats.observing}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">平均 Incremental ROI</div><div className="text-xl font-bold text-indigo-600">{fmtROI(activityStats.avgROI)}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">总有效增量纯销</div><div className="text-xl font-bold text-slate-800">¥{fmtMoney(activityStats.totalEffective)}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">总品牌投入</div><div className="text-xl font-bold text-slate-800">¥{fmtMoney(activityStats.totalInvestment)}</div></div>
        </div>
      )}

      {/* v3.2（规则二十/二十一）：增量价值聚合统计，全部 null-safe */}
      {activityStats.total > 0 && (() => {
        const tierPI = econTier('incrementalProfitInvestment', activityStats.incrementalProfitInvestment);
        return (
        <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">品牌增量毛利合计 <span className="text-slate-300">vs Baseline</span></div><div className="text-xl font-bold text-slate-800">{fmtSignedMoney(activityStats.totalIncrementalBrandGrossProfit)}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">品牌增量净利合计 <span className="text-slate-300">vs Baseline</span></div><div className={`text-xl font-bold ${activityStats.totalIncrementalBrandNetProfit < 0 ? 'text-red-600' : 'text-slate-800'}`}>{fmtSignedMoney(activityStats.totalIncrementalBrandNetProfit)}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">托盘商增量净利合计 <span className="text-slate-300">vs Baseline</span></div><div className={`text-xl font-bold ${activityStats.totalIncrementalDistributorNetProfit < 0 ? 'text-red-600' : 'text-slate-800'}`}>{fmtSignedMoney(activityStats.totalIncrementalDistributorNetProfit)}</div></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">增量利润投入比（总/总）</div><div className="text-xl font-bold text-indigo-600">{activityStats.incrementalProfitInvestment === null ? '—' : safePct(activityStats.incrementalProfitInvestment, 1)}</div>{tierPI && <span className="text-xs px-1.5 py-0.5 rounded-full font-medium" style={{background: tierPI.color + '1a', color: tierPI.color}}>{tierPI.label}</span>}</div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div className="text-xs text-slate-500">平均 Persistence</div><div className="text-xl font-bold text-slate-800">{safePct(activityStats.avgPersistence, 1)}</div></div>
        </div>
        );
      })()}

      {showForm && (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 space-y-4">
          <h3 className="font-semibold text-slate-700">{editingId ? '编辑活动' : '录入活动'}</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div><label className="text-xs text-slate-500 mb-1 block">活动名称</label><input type="text" value={fName} onChange={e => setFName(e.target.value)} placeholder="例如：618大促" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            {hasChannelSkuData && (
              <div>
                <label className="text-xs text-slate-500 mb-1 block">活动平台 {!editingId && <span className="text-red-500">*</span>}</label>
                <select value={fActivityChannel} onChange={e => setFActivityChannel(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                  <option value="">{editingId ? '保持当前（全渠道兼容）' : '请选择平台'}</option>
                  {channels.map(ch => <option key={ch} value={ch}>{ch}</option>)}
                </select>
                {channels.length === 0 && <p className="text-xs text-amber-600 mt-1">暂无平台数据，请先上传渠道 SKU 周度数据</p>}
              </div>
            )}
            <div><label className="text-xs text-slate-500 mb-1 block">活动起始周</label><select value={fStartWeek} onChange={e => setFStartWeek(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
                  {(() => {
                    // v3.2（规则二十四）：只允许选择能完整覆盖 Activity Window 的起始周；
                    // 编辑历史活动时保留原起始周选项，不强制改写
                    const w = Math.max(1, Number(fWindow) || 3);
                    const validOpts = PERIODS.filter((p, i) => i + w <= PERIODS.length);
                    const curIdx = PERIODS.findIndex(p => p.label === fStartWeek);
                    const keepCurrent = !!editingId && curIdx >= 0 && !validOpts.some(p => p.label === fStartWeek);
                    const opts = keepCurrent ? [...validOpts, PERIODS[curIdx]] : validOpts;
                    return opts.slice().reverse().map(p => <option key={p.idx} value={p.label}>{p.label}{keepCurrent && p.label === fStartWeek ? '（当前·窗口未满）' : ''}</option>);
                  })()}
                </select>
                {(() => {
                  const w = Number(fWindow || 3);
                  const idx = PERIODS.findIndex(p => p.label === fStartWeek);
                  if (idx >= 0 && idx + w > PERIODS.length) {
                    return <p className="text-xs text-amber-500 mt-1">窗口超出已有数据 {idx + w - PERIODS.length} 周：保存后活动按可用周数计算，标记「观察中 · 窗口未满」，数据补齐后自动转正常定级</p>;
                  }
                  return null;
                })()}</div>
            <div><label className="text-xs text-slate-500 mb-1 block">活动窗口（周）</label><input type="number" min={1} max={8} value={fWindow} onChange={e => {
              const nw = Math.max(1, Number(e.target.value) || 1);
              setFWindow(nw);
              // v3.2（规则二十四）：窗口变化后，起始周可选范围动态变化；新建时自动校正到最近的可完整覆盖起始周
              if (!editingId) {
                const idx = PERIODS.findIndex(p => p.label === fStartWeek);
                if (idx >= 0 && idx + nw > PERIODS.length) {
                  const ni = Math.max(0, PERIODS.length - nw);
                  setFStartWeek(PERIODS[ni]?.label || '');
                }
              }
            }} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">Baseline 周数</label><input type="number" min={2} max={12} value={fBaseline} onChange={e => setFBaseline(Number(e.target.value))} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">活动后观察（周）</label><input type="number" min={1} max={8} value={fPost} onChange={e => setFPost(Number(e.target.value))} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">品牌基础投入（元）</label><input type="number" min={0} value={fInvestment} onChange={e => setFInvestment(e.target.value)} placeholder="现金+赠品+物料..." className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">消费者端价格补贴（元）</label><input type="number" min={0} value={fConsumerSubsidy} onChange={e => setFConsumerSubsidy(e.target.value)} placeholder="品牌为消费者承担的补贴" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
            <div><label className="text-xs text-slate-500 mb-1 block">托盘商返利 / 补贴（元）</label><input type="number" min={0} value={fRebate} onChange={e => setFRebate(e.target.value)} placeholder="品牌额外支付给托盘商" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block">参与 SKU</label>
            <SkuPicker skuMaster={skuMaster} selectedCodes={fSkus} mode={fSkuMode} onChange={({mode, codes}) => { setFSkuMode(mode); setFSkus(codes); }}/>
          </div>
          <div className="flex justify-end gap-2">
            {editingId && <button onClick={() => { setShowForm(false); resetForm(); }} className="px-4 py-2 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50">取消</button>}
            <button onClick={handleSave} className="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">{editingId ? '保存修改' : '保存并计算'}</button>
          </div>
        </div>
      )}

      {platformSummary.length > 0 && (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div className="px-4 py-3 border-b border-slate-100"><h3 className="font-semibold">平台 ROI 分析</h3><p className="text-xs text-slate-400 mt-0.5">按活动平台聚合已录入活动</p></div>

      {(
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">

            const xs = matrixPoints.map(p => p.roi);
            const ys = matrixPoints.map(p => p.persistence);
            const xMin = Math.min(0, ...xs), xMax = Math.max(1.5, ...xs);
            const yMin = Math.min(-0.2, ...ys), yMax = Math.max(0.2, ...ys);
            const xRange = (xMax - xMin) || 1, yRange = (yMax - yMin) || 1;

              <div className="flex flex-col lg:flex-row gap-4">

                  <svg viewBox={`0 0 ${W} ${H}`} className="w-full min-w-[520px] select-none">
                    <rect x={px(xCut)} y={py(yMax)} width={Math.max(0, px(xMax) - px(xCut))} height={Math.max(0, py(yCut) - py(yMax))} fill="#16a34a" opacity="0.06"/>
                    <rect x={px(xCut)} y={py(yCut)} width={Math.max(0, px(xMax) - px(xCut))} height={Math.max(0, py(yMin) - py(yCut))} fill="#ea580c" opacity="0.06"/>

                    <line x1={px(xCut)} y1={py(yMin)} x2={px(xCut)} y2={py(yMax)} stroke="#94a3b8" strokeDasharray="4 4"/>

                      const cx = px(p.roi), cy = py(p.persistence);

                      const op = p.observing ? 0.5 : 0.92;
                      return (
                        <g key={p.id} transform={`translate(${cx},${cy})`} opacity={op} style={{cursor: 'pointer'}}

                      <div className="border-t border-slate-200 pt-1.5 flex justify-between"><span className="text-slate-500">品牌毛利</span><span className="font-medium">{fmtSignedMoney(hovered.brandGross)}</span></div>

                      <div className="border-t border-slate-200 pt-1.5 flex justify-between"><span className="text-slate-500">品牌增量毛利</span><span className="font-medium">{fmtSignedMoney(hovered.incBrandGross)}</span></div>

                      <div className="text-slate-400 pt-1">点击活动点可跳转到活动明细</div>
                    </>
                  ) : (
                    <div className="text-slate-400 py-8 text-center">悬停或点击活动点<br/>查看三方经营明细</div>
                  )}
                </div>
              </div>
            );
          })()}
        </div>

      {activities.length > 0 && (
        <div className="flex flex-wrap gap-2">
          {activities.map(act => {

      {/* Baseline 不足时的降级展示（规则二十二）：仅展示活动窗口实际经营结果，增量指标一律 —，不以 GMV/投入 冒充增量ROI */}
      {hasError && rawResult?.status === 'baseline_insufficient' && rawResult?.economics && (() => { const E = rawResult.economics; return (
        <div className="bg-white rounded-xl border border-amber-200 shadow-sm overflow-hidden">
          <div className="px-4 py-3 border-b border-amber-100 bg-amber-50/50">

            <p className="text-xs text-slate-400 mt-0.5">Incremental ROI = — · Grade = — · 增量利润 = —（Baseline 需 ≥2 个完整周）</p>
          </div>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 p-4 text-sm">
            <div className="bg-slate-50 rounded-lg p-3"><div className="text-xs text-slate-500">Activity GMV</div><div className="text-lg font-bold text-slate-800 mt-0.5">{fmtSignedMoney(E.terminal.gmv)}</div></div>
            <div className="bg-slate-50 rounded-lg p-3"><div className="text-xs text-slate-500">Activity Sales</div><div className="text-lg font-bold text-slate-800 mt-0.5">{fmtNum(E.terminal.sales)} 件</div></div>
            <div className="bg-slate-50 rounded-lg p-3"><div className="text-xs text-slate-500">托盘商毛利 / 净利</div><div className="text-lg font-bold text-slate-800 mt-0.5">{fmtSignedMoney(E.distributor.grossProfit)} / {fmtSignedMoney(E.distributor.netProfit)}</div></div>
            <div className="bg-slate-50 rounded-lg p-3"><div className="text-xs text-slate-500">品牌毛利 / 净利</div><div className={`text-lg font-bold mt-0.5 ${E.brand.netProfit < 0 ? 'text-red-600' : 'text-slate-800'}`}>{fmtSignedMoney(E.brand.grossProfit)} / {fmtSignedMoney(E.brand.netProfit)}</div></div>
          </div>
          <div className="px-4 pb-4 text-xs text-slate-500">
            品牌投入 ¥{fmtMoney(E.investment.brandInvestment)} · 消费者端补贴 ¥{fmtMoney(E.investment.consumerPriceSubsidy)} · 托盘商返利 ¥{fmtMoney(E.investment.distributorRebate)}

          </div>

      {result && selectedActivity && (
        <div className="space-y-4">
          <div className="bg-slate-50 rounded-lg border border-slate-200 p-3 text-sm">
            <div className="flex flex-wrap gap-x-4 gap-y-1">
              <span><span className="text-slate-500">活动平台：</span><span className="font-medium">{selectedActivity.activityChannel && selectedActivity.activityChannel !== 'ALL' ? selectedActivity.activityChannel : '全渠道兼容'}</span></span>
              <span><span className="text-slate-500">参与 SKU：</span><span className="font-medium">{selectedActivity.skuMode === 'all' ? skuMaster.length + '个（全部）' : ((selectedActivity.skuCodes || []).filter(c => skuMaster.some(s => s.code === c)).length + '个')}</span></span>

          {/* ================= 效率 vs 经济结果 总结（规则四十） ================= */}

                <div className="flex justify-between"><span className="text-slate-500">活动周实际纯销</span><span className="font-medium">¥{fmtMoney(result.activityWeek.activityWeekSellOut)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">Baseline 周均纯销</span><span className="font-medium">¥{fmtMoney(result.activityWeek.activityWeekBaseline)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">活动周增量纯销</span><span className="font-medium text-green-600">¥{fmtMoney(result.activityWeek.activityWeekIncremental)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">增量率</span><span className="font-medium">{safePct(result.activityWeek.activityWeekIncrementalRate, 2)}</span></div>
              </div>
            </Card>

            <Card title="活动窗口详情" subtitle={`${result.activityWindow.windowPeriods} 周窗口`}>
              <div className="space-y-2 text-sm">
                <div className="flex justify-between"><span className="text-slate-500">窗口实际纯销</span><span className="font-medium">¥{fmtMoney(result.activityWindow.windowActualSellOut)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">窗口 Baseline 纯销</span><span className="font-medium">¥{fmtMoney(result.activityWindow.windowBaselineSellOut)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">窗口增量纯销</span><span className="font-medium text-green-600">¥{fmtMoney(result.activityWindow.windowIncrementalSellOut)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">窗口周均增量</span><span className="font-medium">¥{fmtMoney(result.activityWindow.windowWeeklyIncremental)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">窗口 Lift</span><span className="font-medium">{result.activityWindow.windowLift}x</span></div>

            <Card title="活动后持续性" subtitle={`${result.postActivity.postPeriods}/${result.postActivity.postPeriodsRequired} 周观察期`}>
              <div className="space-y-2 text-sm">
                <div className="flex justify-between"><span className="text-slate-500">活动后实际纯销</span><span className="font-medium">¥{fmtMoney(result.postActivity.postActualSellOut)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">活动后 Baseline 纯销</span><span className="font-medium">¥{fmtMoney(result.postActivity.postBaselineSellOut)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">活动后净增量</span><span className={`font-medium ${result.postActivity.postNetIncrementalSellOut >= 0 ? 'text-green-600' : 'text-red-500'}`}>{result.postActivity.postNetIncrementalSellOut >= 0 ? '+' : ''}¥{fmtMoney(Math.abs(result.postActivity.postNetIncrementalSellOut))}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">活动后周均增量</span><span className={`font-medium ${result.postActivity.postWeeklyIncremental >= 0 ? 'text-green-600' : 'text-red-500'}`}>{result.postActivity.postWeeklyIncremental >= 0 ? '+' : ''}¥{fmtMoney(Math.abs(result.postActivity.postWeeklyIncremental))}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">持续性系数</span><span className={`font-medium ${result.postActivity.persistenceRate >= 0 ? 'text-green-600' : 'text-red-500'}`}>{safePct(result.postActivity.persistenceRate, 1)}</span></div>
                {!result.postActivity.observationComplete && (
                  <div className="text-xs text-amber-600 bg-amber-50 rounded px-2 py-1 mt-1">观察期尚未完成，持续性数据可能不准确</div>
                )}
              </div>
            </Card>

            <Card title="有效增量与 ROI" subtitle="核心结论">
              <div className="space-y-2 text-sm">
                <div className="flex justify-between"><span className="text-slate-500">有效因子（管理规则）</span><span className="font-medium">{safePct(result.effectiveIncremental.effectiveFactor, 1)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">有效增量纯销</span><span className="font-medium text-green-600 font-bold">¥{fmtMoney(result.effectiveIncremental.effectiveIncrementalSellOut)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">品牌基础投入</span><span className="font-medium">¥{fmtMoney(result.investment.brandInvestment)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">消费者端价格补贴</span><span className="font-medium">¥{fmtMoney(result.investment.consumerPriceSubsidy)}</span></div>
                <div className="flex justify-between"><span className="text-slate-500">托盘商返利 / 补贴</span><span className="font-medium">¥{fmtMoney(result.investment.distributorRebate)}</span></div>
                {result.investment.legacyActivityPriceSubsidy > 0 && (result.investment.consumerPriceSubsidy + result.investment.distributorRebate) !== result.investment.legacyActivityPriceSubsidy && (
                  <div className="text-xs text-slate-400">历史字段「活动价格补贴」¥{fmtMoney(result.investment.legacyActivityPriceSubsidy)} 已兼容归并，不重复扣减</div>
                )}
                <div className="flex justify-between border-t border-slate-100 pt-1"><span className="text-slate-700 font-medium">品牌真实投入合计</span><span className="font-bold text-orange-600">¥{fmtMoney(result.investment.totalBrandInvestment)}</span></div>
                <div className="flex justify-between border-t border-slate-100 pt-2 mt-1"><span className="text-slate-700 font-medium">Incremental ROI</span><span className="font-bold text-indigo-600 text-lg">{fmtROI(result.return.incrementalSellOutROI)}</span></div>
                <div className="flex justify-between"><span className="text-slate-700 font-medium">增量成本率</span><span className="font-bold text-orange-600">{result.return.incrementalCostRatePercent}%</span></div>
              </div>
            </Card>
          </div>

          {diagnosis && (
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
              <button onClick={() => setShowDiagnosis(!showDiagnosis)} className="flex items-center gap-2 text-sm font-medium text-slate-700">
                <Info className="w-4 h-4"/> 活动 ROI 数据诊断 {showDiagnosis ? '▲' : '▼'}
              </button>
              {showDiagnosis && (
                <div className="mt-3 space-y-2 text-sm">
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div className="text-slate-500">活动起始周：<span className="text-slate-700">{diagnosis.startWeek}</span></div>
                    <div className="text-slate-500">起始周 Index：<span className="text-slate-700">{diagnosis.startIdx}</span></div>
                    <div className="text-slate-500">活动平台：<span className="text-slate-700">{diagnosis.activityChannel}</span></div>
                    <div className="text-slate-500">有效 SKU：<span className="text-slate-700">{diagnosis.validSkuCount}</span></div>
                    <div className="text-slate-500">Baseline 可用周数：<span className="text-slate-700">{diagnosis.baselineAvailable}/{diagnosis.baselineRequired}</span></div>
                    <div className="text-slate-500">活动窗口可用周数：<span className="text-slate-700">{diagnosis.windowAvailable}/{diagnosis.windowRequired}</span></div>
                    <div className="text-slate-500">活动后可用周数：<span className="text-slate-700">{diagnosis.postAvailable}/{diagnosis.postRequired}</span></div>
                  </div>
                  <div className="space-y-1">
                    <p className="text-xs font-medium text-slate-600">活动窗口数据：</p>
                    <div className="flex flex-wrap gap-1">
                      {diagnosis.windowWeeks.map(w => (
                        <span key={w.idx} className="text-xs px-2 py-0.5 rounded-full bg-green-50 text-green-700 border border-green-100">✓ {w.label} ¥{fmtMoney(w.gmv)}</span>
                      ))}
                      {diagnosis.windowWeeks.length === 0 && <span className="text-xs text-amber-600">暂无数据</span>}
                    </div>
                  </div>
                  <div className="space-y-1">
                    <p className="text-xs font-medium text-slate-600">活动后数据：</p>
                    <div className="flex flex-wrap gap-1">
                      {diagnosis.postWeeks.map(w => (
                        <span key={w.idx} className="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-100">✓ {w.label} ¥{fmtMoney(w.gmv)}</span>
                      ))}
                      {diagnosis.postWeeks.length === 0 && <span className="text-xs text-amber-600">暂无数据</span>}
                    </div>
                  </div>
                  {diagnosis.missingPeriods && diagnosis.missingPeriods.length > 0 && (
                    <div className="space-y-1">
                      <p className="text-xs font-medium text-slate-600">SKU×周 缺失诊断（稀疏上传语义：无记录 = 当周未动销 = 真实 0，仅提示不扣减）：</p>
                      <div className="flex flex-wrap gap-1">
                        {diagnosis.missingPeriods.slice(0, 6).map((m, i) => (
                          <span key={i} className="text-xs px-2 py-0.5 rounded-full bg-slate-50 text-slate-600 border border-slate-200">
                            {m.stage} · {m.period}：{m.missingSkus.slice(0, 3).map(code => skuMaster.find(s => s.code === code)?.name || code).join('、')}{m.missingSkus.length > 3 ? ` 等 ${m.missingSkus.length} 个 SKU` : ' SKU'} 无记录
                          </span>
                        ))}
                        {diagnosis.missingPeriods.length > 6 && <span className="text-xs text-slate-400 self-center">… 共 {diagnosis.missingPeriods.length} 个周存在 SKU 无记录</span>}
                      </div>
                    </div>
                  )}
                  {hasError && <p className="text-xs text-red-600">❌ {rawResult.error}</p>}
                  {!hasError && <p className="text-xs text-green-600">✓ 数据完整，可以计算 ROI</p>}
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {!result && activities.length === 0 && (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-10 text-center text-slate-400 text-sm">
          <Target className="w-12 h-12 mx-auto mb-3 text-slate-300"/>
          <p>暂无活动数据</p>
          <p className="mt-1">暂无活动数据，待本地可编辑版录入并同步后在此展示</p>
        </div>
      )}
    </div>
  );
}

function Card({title, subtitle, action, children}){

  return (

    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4">

      {(title || subtitle || action) && (

        <div className="flex items-start justify-between gap-2 mb-3">

          <div>

            {title && <h3 className="font-semibold text-slate-800">{title}</h3>}

            {subtitle && <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>}

          </div>

          {action ? <div className="shrink-0">{action}</div> : null}

        </div>

      )}

      {children}

    </div>

  );

}

function Kpi({icon,tint,label,value,chg,sub,onClick}){

  const up=chg>=0;

  return <div className={`bg-white rounded-xl border border-slate-200 shadow-sm p-4 ${onClick?'cursor-pointer':''}`} onClick={onClick}><div className="flex items-center justify-between"><span className="text-sm text-slate-500">{label}</span><span className="p-1.5 rounded-lg" style={{background:tint+'1a',color:tint}}>{icon}</span></div><div className="mt-2 text-2xl font-bold tabular-nums">{value}</div>{chg!==undefined&&<div className={`mt-1 text-xs flex items-center gap-1 ${up?'text-green-600':'text-red-500'}`}>{up?<TrendingUp className="w-3.5 h-3.5"/>:<TrendingDown className="w-3.5 h-3.5"/>}{pct(chg)}<span className="text-slate-400">环比</span></div>}{sub&&<div className="mt-1 text-xs text-slate-400">{sub}</div>}</div>;

}

function NumInput({value,onChange}){

  return <input type="number" step="0.01" value={value} onChange={e=>onChange(e.target.value===''?'':Number(e.target.value))} className="w-24 text-right border border-slate-200 rounded-md px-2 py-1 text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-indigo-400"/>;

}

function SkuManagerModal({ skuMaster, setSkuMaster, regenerateAll, onClose }) {
  // 适配层：将当前Dashboard的调用方式转换为A版SkuManager的接口
  const handleSave = (newRows) => {
    regenerateAll(newRows);
    onClose();
  };
  return <SkuManagerInner skuMaster={skuMaster} onSave={handleSave} onClose={onClose} />;
}

function SkuManagerInner({skuMaster,onSave,onClose}){
  const [rows,setRows]=useState(()=>skuMaster.map(s=>({code:s.code,name:s.name,cat:s.cat,status:'ok',msg:''})));
  const [err,setErr]=useState('');
  const [csvInfo,setCsvInfo]=useState(null);
  const fileRef=useRef(null);

  const detectDelimiter=(text)=>{
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length===0)return ',';
    const delimiters=[',',';','\t'];
    let best=',';let max=0;
    for(const d of delimiters){
      const re=new RegExp(d==='\t'?'\\t':d.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
      const cnt=(lines[0].match(re)||[]).length;
      if(cnt>max){max=cnt;best=d;}
    }
    return best;
  };

  const parseCSV=(text)=>{
    text=text.replace(/^\uFEFF/,'');
    const delimiter=detectDelimiter(text);
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length===0)return [];
    const first=lines[0];
    const hasHeader=first.includes('编码')||first.includes('code')||first.includes('商品')||first.includes('名称');
    const startIdx=hasHeader?1:0;
    const out=[];
    for(let i=startIdx;i<lines.length;i++){
      const line=lines[i].trim(); if(!line)continue;
      const cols=[];let cur='';let inQuote=false;
      for(let j=0;j<line.length;j++){
        const ch=line[j];
        if(ch==='"'){inQuote=!inQuote;}
        else if(ch===delimiter&&!inQuote){cols.push(cur.trim());cur='';}
        else{cur+=ch;}
      }
      cols.push(cur.trim());
      out.push(cols);
    }
    return out;
  };

  const validateCsvRow=(cols)=>{
    const [code,name,cat]=cols;
    if(!code||!code.trim())return{code:'',name:'',cat:'',status:'err',msg:'编码不能为空'};
    if(!name||!name.trim())return{code:code.trim(),name:'',cat:'',status:'err',msg:'名称不能为空'};
    if(!CATS.find(c=>c.key===cat))return{code:code.trim(),name:name.trim(),cat,status:'err',msg:'品类不存在：'+cat};
    return{code:code.trim(),name:name.trim(),cat,status:'ok',msg:''};
  };

  const applyCsvRows=(validated)=>{
    const okRows=validated.filter(r=>r.status==='ok');
    const errRows=validated.filter(r=>r.status==='err');
    setRows(p=>{
      let updated=[...p];
      okRows.forEach(r=>{
        const idx=updated.findIndex(x=>x.code===r.code);
        if(idx>=0){updated[idx]={...r,status:'ok',msg:''};}
        else{updated.push({...r,status:'ok',msg:''});}
      });
      errRows.forEach(r=>{
        updated.push({...r});
      });
      return updated;
    });
    setCsvInfo({total:validated.length,ok:okRows.length,err:errRows.length});
  };

  const handleFile=(file)=>{
    if(!file)return;
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext!=='csv'){setErr('仅支持 .csv 格式');return;}
    setErr('');
    setCsvInfo(null);
    const reader=new FileReader();
    reader.onload=(e)=>{
      const buf=new Uint8Array(e.target.result);
      let text;
      try{
        text=new TextDecoder('utf-8',{fatal:true}).decode(buf);
      }catch(err){
        try{
          text=new TextDecoder('gbk').decode(buf);
        }catch(err2){
          setErr('文件编码无法识别（请用记事本打开→另存为→UTF-8）');
          return;
        }
      }
      const raw=parseCSV(text);
      if(raw.length===0){
        setErr('CSV 内容为空，请检查文件');
        return;
      }
      const validated=raw.map(cols=>validateCsvRow(cols));
      applyCsvRows(validated);
    };
    reader.onerror=()=>{setErr('文件读取失败');};
    reader.readAsArrayBuffer(file);
  };
  const handleDrop=(e)=>{e.preventDefault();const files=e.dataTransfer.files;if(files.length>0)handleFile(files[0]);};
  const handleDragOver=(e)=>{e.preventDefault();};
  const handleSelect=()=>{if(fileRef.current)fileRef.current.click();};

  const downloadTemplate=()=>{
    const BOM='\uFEFF';
    let csv='商品编码,名称,品类\n';
    skuMaster.forEach(s=>{csv+=s.code+','+s.name+','+s.cat+'\n';});
    const blob=new Blob([BOM+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='模板_SKU维护.csv';a.click();URL.revokeObjectURL(url);
  };

  const moveRow = (i, dir) => {
    if ((dir === -1 && i === 0) || (dir === 1 && i === rows.length - 1)) return;
    const newRows = [...rows];
    [newRows[i], newRows[i + dir]] = [newRows[i + dir], newRows[i]];
    setRows(newRows);
  };
  const addRow=()=>{
    setRows(p=>[...p,{code:'',name:'',cat:CATS[0].key,status:'ok',msg:''}]);
  };
  const removeRow=(i)=>{setRows(p=>p.filter((_,idx)=>idx!==i));};
  const updateRow=(i,k,v)=>{setRows(p=>{const n=[...p];n[i]={...n[i],[k]:v,status:'ok',msg:''};return n;});};
  const validate=()=>{
    const codes=new Set();
    for(const r of rows){
      if(r.status==='err')return '请先修正表格中标红的异常行';
      if(!r.code.trim())return '编码不能为空';
      if(codes.has(r.code.trim()))return '编码重复：'+r.code;
      codes.add(r.code.trim());
      if(!r.name.trim())return '名称不能为空';
      if(!CATS.find(c=>c.key===r.cat))return '品类不存在：'+r.cat;
    }
    return '';
  };
  const submit=()=>{
    const msg=validate();
    if(msg){setErr(msg);return;}
    setErr('');
    /* 说明：新增/修改 SKU 会保留原 SKU 的 price/demand/profile，
       仅在新增时以默认值兜底。 */
    onSave(rows.map((r, i) => {
      const old = skuMaster.find(s=>s.code===r.code.trim());
      return {
        code:r.code.trim(), name:r.name.trim(), cat:r.cat,
        price: old?.price ?? 100,
        demand: old?.demand ?? 200,
        profile: old?.profile ?? 'healthy',
        sortOrder: i,
      };
    }));
    onClose();
  };
  return (
    <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl my-auto">
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <h3 className="font-bold flex items-center gap-2"><Boxes className="w-5 h-5 text-indigo-600"/>SKU 维护</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
        </div>
        <div className="p-5 space-y-4">
          <p className="text-xs text-slate-500">当前共 {rows.length} 个 SKU。添加、删除或修改后点击保存，看板数据将自动重新生成。</p>
          {err && <p className="text-xs text-red-500 bg-red-50 rounded-lg px-3 py-2">{err}</p>}
          {csvInfo && (
            <div className="flex items-center gap-2 rounded-lg bg-emerald-50 px-3 py-2 text-sm text-emerald-700">
              <CheckCircle2 className="w-4 h-4"/>
              CSV 解析完成：覆盖/新增 {csvInfo.ok} 行，异常 {csvInfo.err} 行。
              <button onClick={()=>setCsvInfo(null)} className="text-emerald-800 underline text-xs ml-2">清除</button>
            </div>
          )}
          <div className="flex items-center gap-2">
            <button onClick={downloadTemplate} className="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
              <Download className="w-3.5 h-3.5"/>下载导入模板
            </button>
            <input type="file" ref={fileRef} accept=".csv" className="hidden" onChange={e=>{handleFile(e.target.files[0]);e.target.value='';}}/>
            <button onClick={handleSelect} className="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
              <Upload className="w-3.5 h-3.5"/>上传 CSV
            </button>
          </div>
          <div onDrop={handleDrop} onDragOver={handleDragOver}
            className="flex flex-col items-center justify-center gap-1 rounded-lg border-2 border-dashed border-slate-300 py-6 hover:border-indigo-400 hover:bg-indigo-50 transition-colors cursor-pointer"
            onClick={handleSelect}>
            <p className="text-xs text-slate-500">或拖拽 CSV 文件到此处</p>
          </div>
          <div className="overflow-x-auto rounded-lg border border-slate-200">
            <table className="w-full text-sm text-left">
              <thead className="bg-slate-50 text-slate-500">
                <tr>
                  <th className="px-3 py-2 font-medium">编码</th>
                  <th className="px-3 py-2 font-medium">名称</th>
                  <th className="px-3 py-2 font-medium">品类</th>
                  <th className="px-3 py-2 font-medium">校验</th>
                  <th className="px-3 py-2 font-medium"></th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i)=>{
                  const isErr = r.status==='err';
                  const isNew = !skuMaster.find(s=>s.code===r.code);
                  const rowCls = `border-t border-slate-100 ${isErr?'bg-red-50':isNew?'bg-blue-50':''}`;
                  return (
                    <tr key={i} className={rowCls}>
                      <td className="px-3 py-2"><input value={r.code} onChange={e=>updateRow(i,'code',e.target.value)} className="w-24 border border-slate-200 rounded px-2 py-1 text-sm font-mono"/></td>
                      <td className="px-3 py-2"><input value={r.name} onChange={e=>updateRow(i,'name',e.target.value)} className="w-48 border border-slate-200 rounded px-2 py-1 text-sm"/></td>
                      <td className="px-3 py-2">
                        <select value={r.cat} onChange={e=>updateRow(i,'cat',e.target.value)} className="border border-slate-200 rounded px-2 py-1 text-sm">
                          {CATS.map(c=><option key={c.key} value={c.key}>{c.key}</option>)}
                        </select>
                      </td>
                      <td className="px-3 py-2">
                        {isErr
                          ? <span className="inline-flex items-center gap-1 text-red-600 text-xs"><AlertCircle className="w-3.5 h-3.5"/>{r.msg}</span>
                          : <span className="inline-flex items-center gap-1 text-emerald-600 text-xs"><CheckCircle2 className="w-3.5 h-3.5"/>通过</span>
                        }
                      </td>
                      <td className="px-3 py-2">
                        <div className="flex items-center gap-1.5">
                          <button onClick={()=>moveRow(i,-1)} disabled={i===0} className={`text-xs px-1.5 py-0.5 rounded border ${i===0?'text-slate-300 border-slate-100':'text-slate-500 border-slate-200 hover:bg-slate-100'}`}>↑</button>
                          <button onClick={()=>moveRow(i,1)} disabled={i===rows.length-1} className={`text-xs px-1.5 py-0.5 rounded border ${i===rows.length-1?'text-slate-300 border-slate-100':'text-slate-500 border-slate-200 hover:bg-slate-100'}`}>↓</button>
                          <button onClick={()=>removeRow(i)} className="text-red-400 hover:text-red-600 text-xs ml-1">删除</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <button onClick={addRow} className="inline-flex items-center gap-1 rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
            + 添加 SKU
          </button>
          <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
            <button onClick={onClose} className="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">取消</button>
            <button onClick={submit} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">保存并重新生成数据</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PasswordSetting({current,onSave,onClose}){

  const [val,setVal]=useState(''); const [confirm,setConfirm]=useState(''); const [err,setErr]=useState('');

  const submit=()=>{if(!val){setErr('请输入新密码');return;} if(val!==confirm){setErr('两次输入不一致');return;} onSave(val); onClose();};

  return <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto"><div className="bg-white rounded-2xl shadow-xl w-full max-w-sm my-auto"><div className="flex items-center justify-between px-5 py-4 border-b border-slate-100"><h3 className="font-bold flex items-center gap-2"><Settings className="w-5 h-5 text-indigo-600"/>设置访问密码</h3><button onClick={onClose} className="..."><X className="w-5 h-5"/></button></div><div className="p-5 space-y-4"><div className="space-y-2"><label className="text-sm text-slate-600">新密码</label><input type="password" value={val} onChange={e=>{setVal(e.target.value);setErr('');}} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div><div className="space-y-2"><label className="text-sm text-slate-600">确认密码</label><input type="password" value={confirm} onChange={e=>{setConfirm(e.target.value);setErr('');}} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"/></div>{err&&<p className="text-xs text-red-500">{err}</p>}<div className="flex justify-end gap-2"><button onClick={onClose} className="...">取消</button><button onClick={submit} className="...">保存</button></div></div></div></div>;

}

function GistSyncModal({data,onLoad,onClose}){

  const [token,setToken]=useState('');

  const [gistId,setGistId]=useState(()=>{const saved=safeStorage.getItem('zhaofeng_gist_id'); return saved||DEFAULT_GIST_ID;});

  const [status,setStatus]=useState('');

  const [loading,setLoading]=useState(false);

  useEffect(()=>{if(window.location.protocol!=='file:'){const saved=safeStorage.getItem('zhaofeng_gist_id'); if(saved) setGistId(saved);}},[]);

  const showMsg=(msg)=>{setStatus(msg);setTimeout(()=>setStatus(''),4000);};

  const push=async()=>{if(!token){showMsg('请输入 GitHub PAT Token');return;} setLoading(true); try{const body={description:'兆丰渠道周转数据',public:false,files:{'data.json':{content:JSON.stringify(data,null,2)}}}; const url=gistId?`https://api.github.com/gists/${gistId}`:'https://api.github.com/gists'; const method=gistId?'PATCH':'POST'; const res=await fetch(url,{method,headers:{'Authorization':`token ${token}`,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify(body)}); const json=await res.json(); if(!res.ok)throw new Error(json.message||`HTTP ${res.status}`); const newId=json.id; if(newId){setGistId(newId); if(window.location.protocol!=='file:')safeStorage.setItem('zhaofeng_gist_id',newId);} showMsg(gistId?'✅ Gist 更新成功':`✅ Gist 创建成功，ID: ${newId}`);}catch(e){showMsg('❌ 失败: '+e.message);}finally{setLoading(false);}};

  const pull=async()=>{if(!gistId){showMsg('请输入 Gist ID');return;} setLoading(true); try{const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:token?{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}:{}}); const json=await res.json(); if(!res.ok)throw new Error(json.message||`HTTP ${res.status}`); const content=json.files?.['data.json']?.content; if(!content)throw new Error('Gist 中未找到 data.json'); const parsed=JSON.parse(content); onLoad(parsed); if(window.location.protocol!=='file:')safeStorage.setItem('zhaofeng_gist_id',gistId); showMsg('✅ 拉取成功，数据已更新');}catch(e){showMsg('❌ 失败: '+e.message);}finally{setLoading(false);}};

  return <div className="fixed inset-0 z-50 flex items-start sm:items-center justify-center bg-black/40 p-4 overflow-y-auto"><div className="bg-white rounded-2xl shadow-xl w-full max-w-md my-auto"><div className="flex items-center justify-between px-5 py-4 border-b border-slate-100"><h3 className="font-bold flex items-center gap-2"><Upload className="w-5 h-5 text-indigo-600"/>Gist 同步</h3><button onClick={onClose} className="..."><X className="w-5 h-5"/></button></div><div className="p-5 space-y-4"><div className="rounded-lg bg-amber-50 border border-amber-200 px-3 py-2 text-xs text-amber-700"><p className="font-semibold">首次使用流程：</p><ol className="list-decimal list-inside mt-1 space-y-0.5"><li>生成 Token，勾选 gist 权限</li><li>输入 Token 点击「推送」→ 自动生成 secret Gist</li><li>记录 Gist ID，填入 HTML 中 GIST_ID 常量</li></ol></div><div className="space-y-2"><label className="text-sm text-slate-600">GitHub PAT Token</label><input type="password" value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxx" className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono"/></div><div className="space-y-2"><label className="text-sm text-slate-600">Gist ID</label><input type="text" value={gistId} onChange={e=>setGistId(e.target.value)} className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono"/></div>{status&&<p className="text-xs px-3 py-2 rounded-lg bg-slate-50 text-slate-700">{status}</p>}<div className="flex justify-end gap-2"><button onClick={onClose} className="...">关闭</button><button onClick={pull} disabled={loading} className="...">拉取</button><button onClick={push} disabled={loading} className="...">{loading?'推送中...':'推送'}</button></div></div></div></div>;

}



const root = createRoot(document.getElementById('root'));

root.render(<ErrorBoundary><Dashboard/></ErrorBoundary>);

</script>
